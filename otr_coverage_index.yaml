    under ComfyUI 0.34 DynamicVRAM the reference drop leaves an orphaned VBAR
    resident (Leg C3, unchanged), run_graph(evict_after_use={"clip"}) which
    unloads the named dynamic patcher through unload_model_and_clones at its
    drop (free 620 MB -> 6998 MB on the 8 GB card; sha256 identical on the 5080
    on both paths). Design arc: docs/2026-09-02-encoder-eviction/.

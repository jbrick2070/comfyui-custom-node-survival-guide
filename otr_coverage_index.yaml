- ref: 2026-08-18 emotion-ceiling re-qualification (live render, otr/episodes/lemmy_production_audition_ceiling_2026-08-18)
  title: |
    A qualification record cited its audition MANIFEST.json BY SHA256 while the audition script
    defaulted to that same directory, so re-running the instrument to refresh the evidence destroyed
    the bytes the record named -- green run, files present, citation silently unverifiable. The first
    re-audition attempt also produced BYTE-IDENTICAL clips under changed code, which looked like
    confirmation and proved nothing: the instrument was bypassing the code path that had changed. A
    partial guard (refuse only when MANIFEST.json exists) left the WAVs and the whole _KEY directory
    -- the blinding map that says which arm a human approved -- unprotected.
  verdict: promoted
  bible_id: '12.111'
  source: live-execution
  note: |
    The generalisable half is that an INSTRUMENT and a RECORD have different lifetimes and nothing
    states the dependency: an audition script is written to be re-run, a qualification is written to
    be permanent, and the moment the record cites the output by hash that output became append-only.
    Fix shape: refuse any non-empty output location including every sibling directory, render to a
    NEW dated directory per run, and put the runtime (live fingerprint, resolved params PER ARM,
    reference hash) INSIDE the artifact so the citation is checkable without trusting a second file.
    The defect class travels -- a sibling instrument in the same repo writes a manifest cited by
    sha256 in three provisional records with no guard at all, tracked separately.
- ref: 2026-08-18 emotion-ceiling audition arms (live render, otr/episodes/lemmy_production_audition_ceiling_2026-08-18)
  title: |
    A blinded three-arm audition looped `os.environ[key] = value` over each arm's override dict, so an
    arm meaning "use the code's defaults" (an empty or partial dict) silently inherited whatever the
    PREVIOUS arm in the shuffled order had left set. Caught by a panel review before it shipped, then
    proven live: the "shipped" arm rendered immediately after a "ceiling disabled" control arm resolved
    the control's leftover setting, not its own defaults -- a qualification built from that arm would
    have certified a build that was never rendered. Non-deterministic across runs, since the shuffle
    decides which arm runs first.
  verdict: promoted
  bible_id: '12.112'
  source: live-execution
  note: |
    The generalisable half is INCREMENTAL vs TOTAL state reset in a sequential loop: each arm's dict,
    read alone, looks complete and correct, and the bug is only visible against the EXECUTION ORDER --
    exactly what a blinded/shuffled harness deliberately hides from the reader. Fix shape: pop every
    key ANY arm controls before applying THIS arm's overrides, so the reset is total by construction
    rather than reordering arms or memoizing a diff, which both leave the underlying bug for the next
    added arm or shuffle seed.
- ref: 2026-08-18 scifi_news_pro coda fix, kibitz r3 antigravity (live render, otr/obs signal_lost_the_borrowed_voice_20260818_115506 vs signal_lost_the_last_reading_20260818_122159)
  title: |
    A four-iteration live chase (two attempts disproved before the fix landed): a script-writing pass
    was told "never state a real-world fact in the outro or CODA, a separate factual note is appended
    by the producer after you" -- while the SAME prompt-assembly code dumped the full state object,
    INCLUDING that already-generated factual note, into the writer's own context, because a later pass
    had already run and written its result onto the shared state object before the writer's prompt was
    built. The writer echoed the note almost word for word. Found by a scoped kibitz review (antigravity)
    after two solo fix attempts missed it; proven both ways on real renders (leaked, then clean).
  verdict: promoted
  bible_id: '12.113'
  source: live-execution
  note: |
    The generalisable half is that a NEGATIVE instruction ("never state X") and a POSITIVE leak (X is
    sitting in the model's own context) are added by independent code paths, so nothing forces them to
    be checked against each other -- the contradiction exists only in their runtime combination, which
    neither reading the prompt text nor reading the state-passing code in isolation reveals. Fix shape:
    exclude the forbidden field from the ONE prompt-build call's serialization, not from the shared
    state object itself, and not by further strengthening the instruction alone (already tried, does
    not hold on a small local model once the fact is visible).
- ref: 2026-08-17 PBUG-20260817-08 Lemmy cameo voice cast on an ordinary character (live published episodes signal_lost_rivers_embrace_20260817_233013 and signal_lost_kinetic_motion_clause_live_test_20260817_050130); fixed 8f3c7615, verified and closed 2026-08-18
  title: |
    The cameo character's operator-qualified voice reference sat in the general char_voice pool like
    any other row, so the seeded draw handed his signature Cockney to ordinary characters in episodes
    whose cast contained no cameo at all. Nothing errored -- the reference is valid and the pick is
    deterministic and auditable -- but a voice can only mean "this is him" while it is the only place
    it is ever heard. Operator ruling: "only Lemmy should get Lemmy voice". Fixed by deriving the
    reserved set FROM the voice policy (every local_wav route on any engine) and dropping those ids
    from the candidate pool as a deterministic pre-filter; only clones of his own recording are
    reserved, never the shared catalogue voices he merely borrows, and the policy path stamps his
    entry directly so reserving cannot starve him of it.
  verdict: promoted
  bible_id: '12.114'
  source: live-execution
  note: |
    Two generalisable halves, and the second cost more time than the first. (1) A reservation that
    exists as a CONVENTION in one subsystem is invisible to a different subsystem that enumerates the
    same catalogue; the coupling has to be mechanical, derived from the granting authority, or a
    hand-kept exclusion list drifts the first time somebody adds a grant. (2) CORRECTED 2026-08-18,
    and the correction is the more valuable half: the defect reappeared SIXTEEN HOURS after a correct
    fix, and this row first recorded that as a stale-resident-server artifact. THAT DIAGNOSIS WAS
    WRONG. The guard sat inside the deterministic selector, and production reached the same assignment
    through an LLM-proposal path that validated and stamped on its own -- skipping the selector on
    1871 of 1953 assignments. The leak walked around a guard that worked perfectly in its own path.
    A stale process and an uncovered path look identical from the outside; the way to separate them is
    to reproduce on a FRESHLY IMPORTED module through the path production actually takes, never by
    reasoning about process start times against commit timestamps -- that argument fits both stories
    and picks the comfortable one. Corpus silence proved nothing either: at a ~1% assignment rate the
    defect is absent from most samples while fully live. Also recorded: count a corpus by ROLE before
    concluding anything about pool concentration -- a pinned announcer legitimately repeats one asset
    in every episode and dominates a naive frequency count.

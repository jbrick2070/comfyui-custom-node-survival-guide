- id: "08.06"
  phase: 8
  area: output_node
  symptom: |
    Pure data-flow placeholder nodes (CharacterForge, ScenePainter,
    VisualCompositor, etc.) are flagged as output nodes by static
    regression tests, even though they only return in-memory tensors
    or strings.
  cause: |
    OUTPUT_NODE = True was copy-pasted onto every node class in the
    pack, including data-flow placeholders that never actually write
    files to disk. The flag changes ComfyUI's execution behavior
    (forces evaluation, exposes preview UI, triggers Save semantics)
    in ways that misrepresent these nodes' role and break path-safety
    checks.
  fix: |
    Reserve OUTPUT_NODE = True for nodes whose execute() actually
    writes a file the user is meant to retrieve (mp4, png, wav,
    json). Data-flow nodes that just return tensors/dicts to
    downstream nodes should NOT carry the flag. Run a regression
    grep on every OUTPUT_NODE-flagged file confirming there is at
    least one folder_paths.get_output_directory() / write call.
  verify: |
    Bug Bible regression test_output_nodes_use_folder_paths passes;
    grep `OUTPUT_NODE = True` and confirm each match also writes a
    real artifact.
  tags: [output_node, placeholder, registration, dataflow]
  legacy_id: BUG-LOCAL-001

- id: "04.07"
  phase: 4
  area: workflow-json
  symptom: |
    POST /prompt returns HTTP 400 because widget values arrive in
    the wrong slots: numeric values land in string params, dropdown
    values land in the wrong dropdown, etc. Workflow renders fine in
    the UI but breaks on programmatic invocation.
  cause: |
    Workflow→API converters that walk widgets_values positionally
    against INPUT_TYPES often forget that ComfyUI EXCLUDES linked
    inputs (those wired to another node's output) from
    widgets_values entirely. If the converter does not skip linked
    inputs, every value after the first link is shifted.
  fix: |
    Build a `linked_set` of input names that have an incoming wire
    in the workflow JSON's `links` array. When mapping
    widgets_values positionally against INPUT_TYPES order, skip
    every name that is in `linked_set`. Linked params get filled
    from the link map instead.
  verify: |
    Programmatic submission of the workflow JSON via
    /prompt returns HTTP 200 with no value_not_in_list /
    invalid_input_type errors, and the realized inputs match what
    the UI shows.
  tags: [widget-drift, workflow-to-api, linked-inputs, positional]
  legacy_id: BUG-LOCAL-003

- id: "04.08"
  phase: 4
  area: combo
  symptom: |
    POST /prompt rejects a dropdown value with
    `value_not_in_list: '[icon] standard (12 min)' not in
    ['[EMOJI] standard (12 min)', ...]`. The workflow JSON saved a
    real Unicode glyph (U+1F4FB radio etc.) in the slot but the
    INPUT_TYPES choice list uses a plain `[EMOJI]` text placeholder
    (or vice versa).
  cause: |
    The web UI sometimes substitutes display-only emoji glyphs into
    saved widget values while the running node code keeps text
    placeholders for portability. ComfyUI's API validation does
    exact-string comparison, so the glyph form and the placeholder
    form do not match even though they look interchangeable.
  fix: |
    Add a tiny normalizer in the workflow→API mapper that strips
    leading emoji codepoints OR `[TAG]` prefixes before comparing
    against the schema's allowed list, then remaps to whichever
    form the running node actually expects. Land tests against
    both directions (glyph→placeholder, placeholder→glyph).
  verify: |
    Round-trip a workflow JSON containing each dropdown form
    through the API; both the UI and /prompt accept it.
  tags: [combo, encoding, emoji, api, exact-string-match]
  legacy_id: BUG-LOCAL-005

- id: "04.09"
  phase: 4
  area: workflow-json
  symptom: |
    After a "fix" that skipped ALL linked inputs from the
    widgets_values walk, a different node now misses values: a
    dropdown receives a number, a float receives an empty string.
    The fix overshot.
  cause: |
    ComfyUI's web UI distinguishes between two kinds of links: a
    plain link (input wired straight to an output, no widget UI)
    versus a "converted widget" (input that was originally a widget
    and was right-clicked into a socket, retaining the
    `"widget": {"name": ...}` metadata block). Plain links DO NOT
    consume widgets_values slots; converted widgets DO. Treating
    both identically corrupts mapping in the opposite direction.
  fix: |
    On every linked input, inspect the `widget` metadata. If
    present, the input still owns its widgets_values slot and must
    be counted in the positional walk; if absent, skip it
    entirely. The two classes need separate handling.
  verify: |
    Regression test where a node has a mix of plain-linked + widget-
    converted-linked + free widgets: every realized input matches
    what the UI shows.
  tags: [widget-drift, converted-widget, linked-inputs, workflow-to-api]
  legacy_id: BUG-LOCAL-006

- id: "04.10"
  phase: 4
  area: workflow-json
  symptom: |
    Same node randomly drifts on different machines: on one host the
    widget mapping is correct, on another the same workflow JSON
    submits with shifted values. Both machines run the same
    ComfyUI version.
  cause: |
    ComfyUI's `/object_info` endpoint can return the optional input
    list in a different order than the node's INPUT_TYPES dict
    iteration order, depending on Python dict ordering, custom node
    decorators, or upstream changes to the API. Workflow→API
    mappers that compute slot positions from `/object_info` while
    the workflow JSON saved widgets_values in INPUT_TYPES order
    (the UI's source) will silently mis-map every optional input
    after the first divergence.
  fix: |
    Pick ONE source of truth — INPUT_TYPES order — and read it
    from the node class directly (or import-based introspection)
    rather than from `/object_info`. Use `/object_info` only for
    type validation, never for slot positions. If the node's
    INPUT_TYPES is dynamic, expose a stable order via a
    `WIDGET_VALUE_ORDER` class attribute and consume that.
  verify: |
    Capture a debug dump of both the `/object_info` schema for the
    node and the realized widget keys in the API prompt; their
    intersection should match every widgets_values slot.
  tags: [widget-drift, object-info, input_types, schema-order]
  legacy_id: BUG-LOCAL-008

- id: "04.11"
  phase: 4
  area: combo
  symptom: |
    A guardrail / mode toggle (e.g. "Low VRAM profile") in a
    dropdown has zero observable effect. Logs do not record any
    enforcement, and the user gets full default behavior.
  cause: |
    The dropdown choice was renamed in INPUT_TYPES (e.g. for UI
    polish or to match a new tier name) but the runtime code that
    string-matches against the choice (`if profile == "Low VRAM
    Mode": ...`) was not grepped and updated. The string never
    matches, the if-branch is dead code, and the guardrail
    silently never fires. No exception, no warning.
  fix: |
    Treat the set of dropdown choices as a typed enum. Define them
    once as module-level string constants and import the constants
    at every call site. When renaming a choice, replace the
    constant in one place and let the type checker / grep find all
    usages.
  verify: |
    Integration test that selects each profile from the dropdown
    and asserts the corresponding guardrail log line appears (or
    that the corresponding code path actually fires).
  tags: [combo, dropdown, dead-code, string-mismatch, guardrail]
  legacy_id: BUG-LOCAL-011

- id: "04.12"
  phase: 4
  area: workflow-json
  symptom: |
    Workflow→API mapper emits a custom-typed input as the wrong
    KIND of value (e.g. project_state arrives as a string when it
    should be a custom dict). The dropdown that comes after it gets
    that custom type's intended value, and so on cascading.
  cause: |
    ComfyUI's INPUT_TYPES can declare custom types (e.g.
    `("PROJECT_STATE",)`) that are SOCKET-ONLY — they have no
    widget representation in the UI and never appear in
    widgets_values. A positional walker that iterates every input
    in INPUT_TYPES order and consumes a slot per iteration will
    consume slot N+1 for the input that should have come from a
    socket, shifting all downstream inputs by one.
  fix: |
    Add an `_is_widget_backed(spec)` helper that returns True only
    for primitives (STRING/INT/FLOAT/BOOLEAN) and dropdowns
    (list-typed specs); False for all custom socket-only types.
    Walk INPUT_TYPES in declaration order but consume a
    widgets_values slot only when `_is_widget_backed` is True.
    Custom-typed inputs come from the link map or are omitted.
    Defense in depth: declare socket-only inputs LAST in the
    optional block so any future regression cannot shift widget
    slots.
  verify: |
    Regression test asserts (a) socket-only typed values never
    appear in `inputs`, (b) the dropdown that follows them keeps
    the correct value, and (c) instrumented `API_PAYLOAD` and
    `DRIFT_DETECTED` log lines fire on the live request.
  tags: [widget-drift, socket-only, custom-type, positional, input_types]
  legacy_id: BUG-LOCAL-027

- id: "04.13"
  phase: 4
  area: workflow-json
  symptom: |
    Two nodes in the same workflow JSON both have linked converted
    widgets but their widgets_values arrays are shaped
    differently — one has 4 slots for 6 widget-backed params, the
    other has 5 slots for 5 widget-backed params. A single mapper
    that picks one shape and forces it gets one node right and
    breaks the other.
  cause: |
    ComfyUI's web UI saves widgets_values in two inconsistent
    shapes depending on when and how a widget was converted to a
    socket: "stripped" (linked converted widgets consume zero
    slots) and "preserved" (linked converted widgets keep an empty
    placeholder slot). Both shapes are valid in the wild; neither
    is universal. The shape difference is invisible to inspection.
  fix: |
    Auto-sense the mode per node from slot-count arithmetic: if
    `len(widgets_values) == widget_backed_count` AND there is at
    least one linked widget-backed input, treat it as preserved
    mode (linked params each consume an empty placeholder). If
    `len(widgets_values) == unlinked_count`, treat it as stripped
    mode. Ambiguous cases (truncated trailing optionals, manual
    JSON edits) default to stripped mode, which errs toward
    omission rather than mis-mapping.
  verify: |
    Regression suite covers BOTH shapes in a single workflow JSON.
    Mapper produces correct realized inputs on each node without
    a global config knob.
  tags: [widget-drift, preserved-stripped, auto-sense, converted-widget, workflow-json]
  legacy_id: BUG-LOCAL-029

- id: "11.12"
  phase: 11
  area: llm
  symptom: |
    A "high creativity" or "maximum chaos" preset (high temperature,
    high top_p) silently produces dialogue in non-canonical formats:
    `*NAME*(emotion): line` with single asterisks where the parser
    expects 0 or 2; or no markup at all. The parser's permissive
    fallback returns nonzero matches by latching onto structural
    tags (ENV/SFX/MUSIC), so dialogue_count > 0 and the safety gate
    does not fire — the episode ships with garbage characters and
    near-silent audio.
  cause: |
    Three compounding gaps: (1) no temperature ceiling, so the LLM
    drifts off-format; (2) parser regex is too narrow to recognize
    the off-format output; (3) permissive fallback has no structural-
    name blocklist, so it accepts SFX/ENV tags as cast members and
    masks the failure. Any one of the three would have produced a
    loud failure; together they hide it.
  fix: |
    Defense in depth: (a) clamp creativity preset temperatures so
    the LLM stays within format range (e.g. cap at ~0.95 for
    Mistral-Nemo-class models); (b) harden the primary regex to
    accept 0..N asterisks / mixed markdown around the name; (c)
    add a Format Normalizer pass — same LLM, very low temperature,
    rewrites whatever the writer produced into strict canonical
    form BEFORE parsing; (d) maintain a structural-name blocklist
    (SCENE/ACT/ENV/SFX/MUSIC/NARRATOR/TITLE/VOICEOVER/etc.) that
    every parser fallback consults so structural tags can never
    masquerade as characters.
  verify: |
    Run a "maximum creativity" preset 5 times. Runtime log shows
    `CREATIVITY ... temp=<= 0.95` and `FORMAT_NORM: Success` (or
    documented failure) on every run, dialogue_count > 0 with
    real character names, and the structural-name blocklist
    rejects any tag the writer accidentally promoted to a
    character.
  tags: [llm, creativity, format-drift, normalizer-pass, structural-blocklist, parser-resilience]
  legacy_id: BUG-LOCAL-014

- id: "11.13"
  phase: 11
  area: llm
  symptom: |
    A normalization / rewrite LLM pass exceeds its wall-clock
    budget (e.g. 120s timeout). The token stream shows the dialogue
    count plateau early then keep generating prose, scene
    descriptions, or stage-direction filler for hundreds more
    tokens. Pipeline silently falls back to the un-normalized text.
  cause: |
    Token budget was sized off input length with too-generous
    headroom (e.g. `min(2048, len/3 + 500)`), and there was no
    early-stop heuristic. After the dialogue content is exhausted
    the model drifts into narrative prose to fill the budget. The
    timeout is a blunt wall-clock kill, not a quality gate.
  fix: |
    Tighten BOTH dimensions: (a) lower max_new_tokens to a tighter
    multiple of input length (e.g. `min(1024, len/4)`) so there is
    no "generate filler to reach budget" runway; (b) lower the
    wall-clock timeout to match the new token budget at observed
    throughput; (c) for long inputs, chunk by structural marker
    (scene / section) and apply per-chunk budget+timeout instead
    of one-shot. Log token-generated, budget, and elapsed per pass
    so future regressions are visible.
  verify: |
    Run a long input (e.g. 50+ dialogue lines) through the pass.
    Log shows wall-time < timeout and tokens-generated within
    budget; no fallback-to-original message.
  tags: [llm, token-budget, wall-time, runaway-tokens, early-stop, normalizer]
  legacy_id: BUG-LOCAL-019

- id: "11.14"
  phase: 11
  area: llm
  symptom: |
    Episodes systematically undershoot a user-facing duration
    target (e.g. user picks 8-minute target, output is 3.7
    minutes). The LLM prompt cites the same minute target but
    output is much shorter. Estimator was right by line count,
    wrong by duration.
  cause: |
    User-facing units (minutes) are not measurable by the LLM —
    the LLM has no reliable internal mapping from words to
    spoken duration. Prompts that demand "an N-minute episode"
    rely on the model's vibe of length, which varies wildly by
    model and temperature. The downstream estimator typically
    uses a generic words-per-minute constant (e.g. 130 wpm for
    "speech") that does not match the actual TTS engine's pace
    (e.g. Bark plays at ~67 wpm).
  fix: |
    Two-part: (a) measure your TTS engine's actual wpm against a
    fixed-length reference and bake that constant into the
    estimator (`TTS_WPM = 67`); (b) translate user-facing minutes
    to LLM-facing word count (`target_words = target_minutes *
    TTS_WPM`) in the prompt — "write at least N words of
    dialogue" is countable; "write an N-minute episode" is not.
    Add a post-generation enforcement step that re-runs the LLM
    if word count is < 70% of target.
  verify: |
    Across N=10 runs at the same target, observed runtime falls
    within 10-20% of target. The estimator log line names the
    measured wpm constant. Post-generation enforcement triggers
    only on undershoot.
  tags: [llm, duration, words-per-minute, target-words, post-enforcement, units]
  legacy_id: BUG-LOCAL-020

- id: "11.15"
  phase: 11
  area: llm
  symptom: |
    A single-pass LLM polish step (grammarian, format normalizer,
    rewriter) times out on long inputs and silently falls back to
    the unpolished text. Short inputs work fine.
  cause: |
    Token budget × backend throughput exceeds the wall-clock
    timeout for long inputs. Single-pass design has no graceful
    way to stay under budget — the operation either fits or
    fails.
  fix: |
    Chunk the input by a structural marker (scene, section,
    paragraph). Apply the polish pass per chunk with its own
    token budget + timeout (e.g. 1024 tokens / 75-90s each).
    Reassemble the chunks. Reserve single-pass for inputs below
    a heuristic threshold (e.g. <= 50 dialogue lines or < 2
    chunks). Each chunk has its own quality safety check; failed
    chunks keep their original text without blocking the rest.
  verify: |
    Run a long input (50+ structural units). Log shows `Chunked
    mode` followed by per-chunk progress and `Chunked complete`.
    Total wall time scales linearly with chunk count, not
    quadratically.
  tags: [llm, chunked-generation, polish, normalizer, timeout, scaling, xref-11.13]
  legacy_id: BUG-LOCAL-023

- id: "11.16"
  phase: 11
  area: llm
  symptom: |
    Format normalizer pass is skipped on a malformed script. The
    skip-heuristic says "looks fine, save the LLM call." Downstream
    parser then fails because the script was actually malformed.
  cause: |
    Skip heuristics that check ONE signal (dialogue line count,
    scene count, cast count) and skip when ANY signal looks
    healthy will let through scripts where one structural piece
    is sound and others are missing. A "ghost run" with bracket
    dialogue but no CAST or scene markers passes a dialogue-only
    check.
  fix: |
    Require ALL THREE signals present before skipping: dialogue
    lines AND scene markers AND distinct cast count. Missing any
    one forces normalization to run. Log the skip decision with
    each individual count so future regressions are visible.
  verify: |
    Feed a ghost run (dialogue only, no CAST, no scenes) through
    the heuristic. It must NOT skip; the runtime log must record
    `missing: scenes cast` (or whichever signals are absent).
  tags: [llm, normalizer, skip-heuristic, ghost-run, defense-in-depth, xref-11.09]
  legacy_id: BUG-LOCAL-024

- id: "12.37"
  phase: 12
  area: regression
  symptom: |
    A regex like `===\s*SCENE\s+(\S+?)\s*===` matches the literal
    sentinel word `FINAL` (e.g. `=== SCENE FINAL ===`) as a scene
    number. Downstream counters double-count scenes and parsers
    treat sentinel-section content as content.
  cause: |
    `\S+?` matches any non-whitespace token. When the domain values
    are integers (scene numbers) but the sentinel token is also
    non-whitespace, the regex cannot tell them apart. Greedy /
    lazy makes no difference here.
  fix: |
    Type the capture group to the actual domain. For numeric
    scene numbers use `\d+`. Add a separate explicit pattern for
    the sentinel (`=== SCENE FINAL ===`) that emits a typed
    terminator token (e.g. the string `END`) instead of a number.
    Downstream consumers can then tell the kinds apart cleanly.
  verify: |
    Regression test with a script containing `=== SCENE 1 ===`,
    `=== SCENE 2 ===`, `=== SCENE FINAL ===`. Counter returns 2
    scenes plus a terminator, not 3 scenes.
  tags: [regex, sentinel, type-the-capture, parser, scene-marker]
  legacy_id: BUG-LOCAL-026

- id: "11.17"
  phase: 11
  area: llm
  symptom: |
    Critique-and-revise (or any per-pass diagnostic) crashes with
    `ZeroDivisionError` because it computes `(revised_len /
    draft_len) * 100`. Crash propagates and aborts the whole
    pipeline even though the revised pass produced a complete
    script.
  cause: |
    Diagnostic code computed a ratio without guarding for zero
    denominator. The initial draft pass legitimately returned 0
    chars (LLM produced nothing recoverable); ratio math blew up.
  fix: |
    Always guard ratios with a zero-denominator check. Either
    return a sentinel (`-1.0`, `None`, `nan`) or log a warning and
    fall through to the next stage. Diagnostic code must never
    propagate exceptions to the main pipeline.
  verify: |
    Inject an empty draft text into the diagnostic. Pipeline
    completes; log shows the warning; no traceback.
  tags: [llm, diagnostic, zero-division, guard, robustness]
  legacy_id: BUG-LOCAL-085

- id: "11.18"
  phase: 11
  area: llm
  symptom: |
    LLM-output parser (Director plan, structured JSON, schema
    validator) raises `ValueError` on a malformed output. The
    exception propagates and aborts the entire pipeline run, losing
    upstream LLM/Bark/audio work that already succeeded.
  cause: |
    "Abort to prevent silent failure" was the original policy, but
    it was applied at every parse failure, even ones where
    downstream just needs a structured plan and could accept a
    minimal default. There was no fallback path and no debug-dump
    of the raw LLM output.
  fix: |
    Three-piece pattern: (1) typed exception class
    (`<Subject>JSONParseError(ValueError)` carrying the raw
    output); (2) ALWAYS dump the raw LLM output to a timestamped
    debug file under your output dir BEFORE raising — cheap
    insurance for post-mortem; (3) build a minimum-viable fallback
    plan from upstream signals already in scope (script VOICE
    tags → minimal voice_assignments, default values for
    everything else). Log loudly that the fallback fired so the
    operator sees reduced quality but the run completes.
  verify: |
    Force a parse failure (mock the LLM output). Pipeline reaches
    audio/video phases at default quality; raw output is preserved
    on disk; log records `<Subject>: BUG-090 fallback active`
    instead of a traceback.
  tags: [llm, parser-resilience, fallback, raw-output-dump, dont-abort-after-expensive-work]
  legacy_id: BUG-LOCAL-090

- id: "11.19"
  phase: 11
  area: llm
  symptom: |
    Script parser registers structural tags as cast members
    (`ALARM BLARING`, `BACK AT THE LAB`, `EQUIPMENT ALARMS`,
    etc.). Downstream Director writes voice_assignments for them,
    TTS renders silence or noise for them, real characters get
    fewer lines than they should.
  cause: |
    Cast-detection blocklist checked only the FIRST WORD against
    a small structural-token enumeration (ENV / SFX / SCENE /
    ACT / MUSIC ...). Multi-word stage-direction phrases whose
    first word is innocuous (`ALARM`, `BACK`, `CHAMBER`) bypass
    the check. Enumeration approach is wrong by construction —
    the set of permissible first-word tokens is unbounded.
  fix: |
    Replace first-word enumeration with a content-based regex
    blocklist that scans the WHOLE name for patterns:
    `\bBLARING\b`, `\bWHOOSH\b`, `\bAT THE\b`, prefixes like
    `^SFX\b`, `^MUSIC\b`. Apply identically to every parser
    acceptance path (inline, standalone, bare-NAME). When a
    rejection happens, route the line to its next-most-plausible
    category (e.g. SFX entry) rather than dropping silently —
    the LLM's intent was to mark a cue, just not as a character.
    Treat the blocklist as a regression-test asset that grows
    over the project's life.
  verify: |
    Feed the parser a script with both `[ALARM BLARING]` and
    `[GENERAL THOMPSON, male, 50s]`. Cast set contains exactly
    `{GENERAL THOMPSON}`; ALARM BLARING is in the SFX list.
  tags: [parser, cast-detection, content-blocklist, multi-word, sfx-route, multi-path-symmetry]
  legacy_id: BUG-LOCAL-091

- id: "07.11"
  phase: 7
  area: video
  symptom: |
    Multi-layer video composite has the wrong layer in the
    pillarbox / letterbox. Pillarbox shows solid magenta where it
    should show an audio-reactive visualizer. Foreground subjects
    look pink/washed out.
  cause: |
    Filter graph put the procgen / texture layer on TOP at
    `addition` blend ~50% over a black canvas + foreground.
    Additive blend pushed pillarbox pixels from black toward the
    procgen color and tinted the foreground. The intent was
    "audio-reactive sheen" but the default opacity made the
    layer the dominant visual.
  fix: |
    In any multi-layer composite, the layer that fills negative
    space (pillarbox / letterbox / transparent regions) MUST be
    the BASE layer at full opacity, not a blanket overlay.
    Foreground content layers go on top of the base, masked to
    their own region. Default optional sheen passes to opacity 0
    and `lighten`/`screen` (preserves underlying tones) rather
    than `addition`/0.5 (saturates / tints). Test visually with
    real procgen content, not just unit-tested for ffmpeg syntax.
  verify: |
    Render a smoke composite with the new defaults. Pillarbox
    shows the visualizer; foreground subjects look natural.
    Dialing sheen opacity > 0 only flashes through on bright
    peaks, never tints the whole frame.
  tags: [composite, ffmpeg, blend-mode, pillarbox, layer-ordering, procgen]
  legacy_id: BUG-LOCAL-092

- id: "12.38"
  phase: 12
  area: regression
  symptom: |
    A dedup or merge step removes a row from a primary table, but
    referencing tables (lines, sfx, etc.) still point at the
    dropped row's id. Lookups silently fail or fall back to
    defaults; data integrity is broken without any error.
  cause: |
    The dedup function returned the deduplicated list but had no
    mechanism to surface a `loser_id → winner_id` alias map. The
    caller dropped the loser rows but never rewrote referencing
    table cells. Foreign-key safety was implicit and unenforced.
  fix: |
    Whenever dedup/merge REMOVES a row from a primary table:
    (1) the dedup function MUST return both the deduplicated list
    AND an alias map from loser-id to winner-id; (2) the caller
    MUST iterate every referencing table and rewrite cells whose
    id is in the alias map; (3) flatten chained aliases (A→B→C
    becomes A→C) so any reference resolves in one lookup; (4) log
    the alias map at INFO level so post-mortem can verify the
    rewrite touched every reference.
  verify: |
    Regression test: feed dedup a 3-row table with two near-
    duplicates and a referencing table that points at all three.
    After dedup + alias-rewrite, every reference resolves to a
    surviving row.
  tags: [dedup, foreign-key, alias-map, atomic-rewrite, data-integrity]
  legacy_id: BUG-LOCAL-098

- id: "11.20"
  phase: 11
  area: llm
  symptom: |
    LLM-output parser fails on malformed JSON. Pipeline either
    aborts (lost upstream work) or falls back to a minimum plan
    that throws away rich content the LLM had actually generated.
  cause: |
    Two-tier resilience (parse → minimal fallback) is the wrong
    shape for the common failure mode. Parse failures are usually
    structural malformation (unclosed brace, embedded markdown,
    JS-style comment leakage), not a model that doesn't
    understand the task. The content sits in the raw output —
    asking the LLM to re-emit it as valid JSON usually recovers
    everything.
  fix: |
    Three-tier resilience chain: (1) parse the LLM's first
    output directly — happiest path; (2) if parse fails, build a
    strict-JSON repair prompt that includes the failed raw output
    and the expected schema, call the LLM with very low
    temperature (0.05–0.15) and a smaller "cleanup" model when
    available, parse the repair output through the same
    extractor; (3) only if BOTH parses fail, fall back to a
    minimum-viable plan. Save raw output to a debug file every
    time a tier escalates.
  verify: |
    Force a parse failure. Log shows `BUG-099 JSON-repair retry`
    followed by `LLM-repair pass recovered content`. The plan has
    non-empty content fields preserved from the original LLM
    output, not a stripped-down default.
  tags: [llm, json-parse, three-tier-resilience, repair-pass, cleanup-model, content-recovery]
  legacy_id: BUG-LOCAL-099

- id: "11.21"
  phase: 11
  area: llm
  symptom: |
    Script parser captures a third-person stage direction as the
    dialogue body (e.g. "Lev bursts onto the deck...") and routes
    it to TTS. The actual dialogue line below the tag is silently
    dropped because no parser variant matched it. The audio
    contains narrative prose spoken in a character's voice.
  cause: |
    LLMs sometimes emit production-script-style formatting where
    a `[VOICE: NAME, traits]` tag is followed by a third-person
    action line and the actual dialogue is on the line BELOW.
    The parser's inline pattern greedily captures everything
    after the tag bracket as dialogue, treating the action line
    as the spoken line and never reaching the real dialogue.
  fix: |
    Add a heuristic mismatch-detector that runs after a parser
    variant matches: `_is_inline_narration(speaker, captured_text)`
    returns True when the captured text starts with the speaker's
    own first name in third person (real dialogue almost never
    starts with the speaker's name in third person about
    themselves). On True, look ahead to the next non-empty,
    non-tag line and treat THAT as the dialogue, consuming both
    source lines. On lookahead failure, log a warning and fall
    through to the variant's original behavior. Log info-level
    decisions so production runs are auditable.
  verify: |
    Feed the parser a `[VOICE: LEV] Lev bursts onto the deck.\n
    Got the spec yet?` two-line input. Output shows one dialogue
    line: speaker=LEV, text="Got the spec yet?". A `BUG-100:
    rejected inline narration` log line appears.
  tags: [parser, narration-leak, look-ahead, heuristic-mismatch, multi-format-llm]
  legacy_id: BUG-LOCAL-100

- id: "07.12"
  phase: 7
  area: audio
  symptom: |
    TTS clip starts with a non-verbal sound (breath, throat clear,
    chuckle) that bleeds 200-500 ms before the first dialogue
    word. Listeners perceive nonsense words leading every line.
  cause: |
    `_clean_text_for_bark` (or equivalent) translated parenthetical
    stage directions like `(panting)` to model-supported non-verbal
    tokens like `[pants]`. Bark renders the token at the START of
    the clip, where it leaks audio milliseconds into the next clip
    boundary. Whisper / human ear can over-interpret the rendered
    breath as articulated phonemes.
  fix: |
    Drop ALL parenthetical content via
    `re.sub(r'\([^)]{1,80}\)\s*', '', text)` BEFORE handing to
    TTS. Stage-direction parentheticals are screenplay shorthand
    for human actors, not for TTS engines. Bracketed tokens like
    `[laughs]` written explicitly by the dialogue author still
    pass through — only the auto-translated paren-form is
    dropped. If vocal flourish is desired, the dialogue author
    writes it inline ("Hahaha! That's rich.") so TTS tokenizes it
    as part of the utterance.
  verify: |
    `_clean_text_for_bark('(panting) we have lost time')` returns
    `'we have lost time'`. Bracketed `[laughs]` survives the
    whitelist. Two implementations of the helper in different
    modules pass an identical-output contract test.
  tags: [tts, bark, clip-boundary, nonverbal-token, paren-stripping]
  legacy_id: BUG-LOCAL-101

- id: "07.13"
  phase: 7
  area: audio
  symptom: |
    Audio-to-video model (HuMo, similar) renders clips where the
    audio consistently leads the lips by 100-200 ms. Constant
    offset every clip, every episode. Architecturally the model
    is audio-to-video so lips cannot lead audio; the lag is
    intrinsic.
  cause: |
    Audio-to-video models with image-anchored first frames
    (Wan + Whisper-conditioned audio cross-attention, etc.) hold
    the reference portrait static for ~3-6 output frames before
    motion onset. The first articulated lip motion lands at
    frame 3-6 (~120-240 ms at 25 fps). When per-line audio is
    fed in starting at sample 0 and per-line video starts at
    frame 0, the first audible phoneme aligns with the static
    freeze.
  fix: |
    Pre-pad each per-line audio with leading digital silence so
    the model burns its motion-onset freeze on the silence
    rather than the first phoneme. After VAE decode but before
    save, drop the leading pad_frames from the image tensor and
    the matching leading silence from the audio. The on-disk
    clip is the original duration and starts at the first
    articulated motion + first dialogue word — downstream
    timeline math is unchanged. Make the pad amount a tunable
    widget (default ~200 ms, min 0 = disabled). Stamp the pad
    value into the per-clip ledger entry for traceability.
  verify: |
    `pad(48000-sample tensor, 9600)` returns 57600 samples;
    `trim(57600, 9600)` returns 48000 samples (back to
    original). Saved clip is the requested duration. Listener
    perception of lag drops from "audio always leads" to
    "alignment within ~30 ms".
  tags: [audio-to-video, motion-onset, silence-pad, clip-boundary, humo, lip-sync]
  legacy_id: BUG-LOCAL-102

- id: "05.08"
  phase: 5
  area: execution-order
  symptom: |
    A render artifact required by an independent role (ANNOUNCER
    bookend image) is not produced because a different feature
    flag (open_close) is OFF. The role exists without that flag,
    so downstream gets a missing artifact and renders the wrong
    fallback (e.g. character portrait instead of broadcast still).
  cause: |
    The render gate was bound to a feature flag that doesn't
    fully cover when the artifact is needed. Flag and role policy
    were entangled; the flag controls more than its name suggests.
  fix: |
    Decouple gates from role policy. The render gate should fire
    based on the actual presence of the role in the work plan
    (`if any(line.role == "ANNOUNCER")`) not based on a flag
    that was originally meant for a related-but-different feature
    (`if open_close`). Audit every feature flag's gate condition
    to confirm it matches the actual dependency, not a sibling
    feature's name.
  verify: |
    Run with the feature flag OFF but the role present. Render
    artifact is produced. Flag-coverage test: for every flag,
    enumerate dependent artifacts and assert the gate condition
    matches the artifact's actual need.
  tags: [feature-flag, gate, role-policy, decoupling, artifact-render]
  legacy_id: BUG-LOCAL-127

- id: "07.14"
  phase: 7
  area: audio
  symptom: |
    `ffmpeg -shortest` concat mux truncates the tail of the master
    audio when sum(per-clip durations) is less than the intended
    total episode duration. ~70s of dialogue audio just disappears
    even though the per-clip files are intact.
  cause: |
    `concat -shortest` resolves the output length to the SHORTEST
    input. If the per-clip stream is shorter than the master mix
    (because static / silence-fill segments were dropped or some
    clips weren't rendered for non-speaking roles), the output
    truncates to the per-clip total. The per-clip stream's length
    is now the contract; the master mix loses content.
  fix: |
    Either tail-pad the per-clip stream with role-appropriate
    fills (radio still + ambient for ANNOUNCER, character still
    for non-speaking dialogue beats) so its length matches the
    master mix, OR replace `-shortest` with explicit `-t
    <total_episode_dur_s>` and let the longer stream be silenced
    naturally. Always log `mux outcome: per_clip_dur=X master_
    dur=Y delta=Z` so silent truncations are visible.
  verify: |
    Run a workflow where per-clip total is less than master mix
    total. Output mp4 duration matches the intended total
    episode duration; tail audio is preserved.
  tags: [ffmpeg, concat, shortest, audio-video-sync, tail-padding, mux]
  legacy_id: BUG-LOCAL-128

- id: "07.15"
  phase: 7
  area: model-class
  symptom: |
    A node correctly stamps `ref_image` for an ANNOUNCER role
    with a non-face image (radio still). The upstream model node
    receives the stamp but renders character-face video anyway.
    Logs say everything is wired correctly; visually the model
    ignores the input.
  cause: |
    `ref_image` in the upstream node looks like a strict
    first-frame I2V conditioner from outside, but inside the
    model body it is encoded into a soft `reference_latents`
    field appended to the positive conditioning. The actual
    generation starts from a zero latent and is denoised by
    KSampler. The reference is a soft attention HINT that the
    model (fine-tuned on human faces with audio-driven
    lip-sync) uses for face-identity continuity — it is NOT a
    strict first-frame lock and NOT a generic image-to-video
    starter. A non-face reference has nothing to lock onto;
    the model falls back to text-prompt-driven face generation.
  fix: |
    Class lesson: don't conflate conditioning-code shape with
    model capability. When a parameter exists in the upstream
    node API, READ THE NODE SOURCE to confirm what the parameter
    actually does. Specific case: when an audio-to-video model is
    face-locked, route non-face roles through a different code
    path (e.g. ANNOUNCER → static-image + audio mux, no audio-
    to-video model). Add a per-role dispatch table that selects
    the correct render backend by role+reference-shape, not by
    whether the upstream node "supports" `ref_image`.
  verify: |
    For each non-face role, the rendered clip first frame is the
    expected non-face image (read via ffmpeg -vframes 1). For
    face roles, the rendered clip uses the face reference. Log
    shows the per-role dispatch decision.
  tags: [model-class, conditioning, ref-image, capability-vs-shape, dispatch]
  legacy_id: BUG-LOCAL-129

- id: "05.09"
  phase: 5
  area: execution-order
  symptom: |
    A two-step ledger update silently skips both steps when one
    of two preconditions is unmet. Some rows have valid placement
    metadata, but mirrored rows are missing entirely from a
    downstream consumer's view.
  cause: |
    Compound conditional gate `if A and B:` collapses two
    independent steps under one branch. When A is empty/falsy,
    BOTH steps are skipped — including the step that would
    process whatever already-valid data B contains.
  fix: |
    Split the gate into two: `if A and B: <step that needs both>`
    AND `if A: <step that only needs A>`. When the steps' data
    requirements differ, their gates must differ. Add an
    unconditional log line at the end of the loop (`mirror
    outcome: in=N appended=M filtered=K`) so silent zero-mirror
    runs are visible.
  verify: |
    Run with B empty. Step 1 skips (correctly), step 2 still
    processes A's rows. Outcome log line records the actual
    counts.
  tags: [conditional-gate, independent-steps, ledger-update, silent-skip]
  legacy_id: BUG-LOCAL-130

- id: "11.22"
  phase: 11
  area: llm
  symptom: |
    Bookend / template enforcer regex doesn't match the modern
    prompt format. A required template section is detected as
    missing on every run. Secondary fallback fires repeatedly
    even when the original output is correct.
  cause: |
    Regex format drift. The detection regex was written when the
    prompt asked for one format (e.g. bare `ANNOUNCER:`); the
    prompt was updated to a different format (e.g. bracketed
    `[VOICE: ANNOUNCER]`) but the regex was not updated. The
    primary detector never matches the new shape. Compounding:
    the secondary fallback has no ultimate fallback — when it
    also fails, output ships in the bad shape.
  fix: |
    Treat prompt format and detection regex as a paired contract.
    When you change one, update the other in the same atomic
    commit. Detection regex should accept BOTH old and new
    formats during transitions:
    `^(?:ANNOUNCER\s*:|\[VOICE\s*:\s*ANNOUNCER\b)` with
    `IGNORECASE`. Widen the head/tail sniff window from 500 to
    2000 chars to survive long preambles. Add a deterministic
    ultimate fallback (placeholder text keyed off episode_title)
    so the section is ALWAYS present even when both LLM passes
    fail.
  verify: |
    Verify-script with 11 cases: bare-colon, bracketed-VOICE,
    mixed-case, multiline, after-preamble, plus negative cases
    (regular text, other-character VOICE tags, the word
    "announcer" mid-sentence). All match correctly. Live run
    shows ANNOUNCER role on first AND last line.
  tags: [llm, regex-format-drift, prompt-detector-contract, ultimate-fallback]
  legacy_id: BUG-LOCAL-131

- id: "11.23"
  phase: 11
  area: llm
  symptom: |
    Length prompts ask for "AT LEAST N words" of a small target
    (e.g. 30 words for a smoke run). The LLM produces 200+ words.
    Floor satisfied; ceiling absent; downstream rendering takes
    hours instead of minutes.
  cause: |
    "AT LEAST N words" is a floor with no upper bound. The LLM
    treats it as permission to write whatever feels narratively
    complete. For small targets, "narratively complete" is
    typically 10-100x larger than N — the LLM rationally
    overshoots into the hundreds.
  fix: |
    For short targets (<= some threshold like 50 words), branch
    the length instruction to use BOTH floor AND ceiling:
    "EXACTLY N words (range: N to ceiling, HARD CAP) ... STOP
    writing as soon as you have a beginning, middle, and end
    that fit in <ceiling> words. Long monologues are FORBIDDEN."
    Ceiling = `max(N + 10, N * 1.4)`. For long-form targets
    (>=51 words), keep the original "AT LEAST" phrasing because
    long dialogue should be free to grow into the full target.
  verify: |
    Run 5 ultra-smoke trials at 30-word target. Each output's
    word count is between 25 and 45.
  tags: [llm, length-prompt, floor-ceiling, smoke-preset, overshoot]
  legacy_id: BUG-LOCAL-132

- id: "12.39"
  phase: 12
  area: llm-routing
  symptom: |
    Round-robin LLM consult script returns valid markdown every
    run, but spot-checking the saved transcripts shows the calls
    are landing on stale fallback models (gpt-4.1, gemini-2.5-pro,
    mistral-nemotron) instead of the intended frontier rungs.
    The script's stderr just says "model unavailable, trying
    next..." with no information about WHY.
  cause: |
    Three convergent failure classes when AI coding agents call
    out to multiple LLM providers via hardcoded model lists:
    (1) MODEL NAME DRIFT — providers rename, deprecate, and
    replace models on a months-not-years cadence; hardcoded
    ladders go stale silently.
    (2) ENDPOINT DRIFT — newer models (e.g. OpenAI gpt-5.x)
    are scoped to specific endpoints (Responses) and 4xx on
    others (Chat). Without endpoint-aware dispatch the script
    falls through silently.
    (3) ALIASING PITFALLS — `*-latest` aliases resolve to
    whatever the provider currently considers "latest," which
    can change without notice and silently land on a different
    tier.
    Compounded by generic untyped error logging that hides
    model_not_found vs endpoint_mismatch vs permission vs
    rate-limit.
  fix: |
    Apply five formalizations:
    (1) PROBE-FIRST. At startup hit `GET /v1/models` for each
        provider, intersect with the configured ladder, prune
        dead rungs, log the live set.
    (2) LADDER-STALENESS ALARM. Track `last_reviewed:` date in
        config. Warn at startup if older than ~60 days.
    (3) ENDPOINT-AWARE DISPATCH. Tag each model entry with
        `endpoint=responses|chat|both|generate_content` and
        route correctly per rung.
    (4) CAPABILITY TAGS + ROUTING. Tag each model with
        `(text|vision|tools|reasoning)`. Callers express needs
        (`needs="reasoning+tools"`), runner filters by
        capability rather than relying on operator-maintained
        order.
    (5) TYPED ERROR LOGGING. On every fall-through, log the
        typed reason (model_not_found vs endpoint_mismatch vs
        permission vs rate_limit vs transport). Fall through
        on the first four; re-raise on transport / 401 /
        unknown.
    Reference implementation lives in `llm_round_robin/` in
    this repo — drop it next to your custom-node pack and let
    your AI agent invoke it via `python -m llm_round_robin
    --question file.md --topic xyz [--needs reasoning+tools]`.
  verify: |
    Round-robin run logs HTTP codes per attempt; saved
    transcript shows the consult landed on a top-of-ladder
    rung (or the typed reason for each fall-through is
    visible). The probe pruned stale rungs before any consult
    fired. Ladder-staleness alarm warns when last_reviewed is
    >60 days old.
  tags: [llm-routing, stale-api-ladder, probe-first, endpoint-aware, capability-routing, typed-error-logging, model-deprecation]
  legacy_id: BUG-LOCAL-133

- id: "11.24"
  phase: 11
  area: llm
  symptom: |
    A single point-of-truth normalizer claims "all downstream
    consumers see clean text," but downstream counters report
    zero dialogue on a perfectly good script. Pipeline triggers
    expensive rescue passes that throw their own valid output
    away.
  cause: |
    The normalizer's regex set didn't recognize a new LLM-emitted
    format that the parser at the END of the pipeline DID accept.
    Counters BETWEEN the normalizer and the final parse stage
    were blind to the format. A parser fix at the final stage
    didn't propagate backward into intermediate counters or
    rescue paths — they were written once and never revisited
    when format support widened.
  fix: |
    (a) When you add a new accepted format to a parser, audit
    every regex BETWEEN the model output and the final parse for
    the same blind spot — if a counter has its own regex, update
    it in the same commit.
    (b) Rescue pipelines (extension passes, fallbacks) have their
    own regexes; audit those too.
    (c) When a normalizer's docstring promises "single point of
    truth," its test battery must exercise EVERY observed LLM
    output format against it as a regression-test asset.
  verify: |
    Direct smoke-test the normalizer's text against the new
    format; count of dialogue lines after normalization matches
    the parser's count. Rescue path is not triggered when the
    primary path produces valid output.
  tags: [llm, normalizer, format-drift, single-point-of-truth, audit-the-audit, parser-coordination]
  legacy_id: BUG-LOCAL-063

- id: "11.25"
  phase: 11
  area: llm
  symptom: |
    The LLM systematically produces narration-only "scripts"
    where most dialogue is stage direction and characters never
    talk. Word count is high; meaningful character dialogue
    count is zero.
  cause: |
    Prompt audit reveals three gaps: (1) the min-line floor is
    asserted in only 1 of N prompts (system prompt), so user
    prompts and follow-up passes don't re-assert it — LLMs
    under-weight system-prompt rules vs user-prompt rules on
    short calls; (2) ZERO prompts explicitly forbid narration-
    only output; the failure mode is unnamed in the prompt set;
    (3) prompts insist on ONE specific format (e.g. `[VOICE:
    NAME, ...]`) when the underlying model often emits a
    parseable shorthand variant naturally — the prompt is
    fighting the model on a format the parser already accepts.
  fix: |
    Re-assert the dialogue-count floor at the top of EVERY
    LLM call site (system + user + spine + evaluator + critique
    + revise). Add an explicit `=== HARD REQUIREMENTS ===`
    block listing: REQ-1 character dialogue is mandatory
    (narration-only scripts are rejected), REQ-2 the parser
    accepts both `[VOICE: NAME, ...]` and `[NAME, ...]`
    interchangeably (pick one), REQ-3 the NAME slot must be a
    character name, not a gender/descriptor word. Add
    DIALOGUE DENSITY as an explicit selection criterion to
    any spine-evaluator step.
  verify: |
    Across N runs, no `0 dialogue lines` DONE telemetry. Final
    output has dialogue word count near target. Spine
    evaluator never picks narration-heavy winners.
  tags: [llm, prompt-audit, dialogue-floor, narration-collapse, multi-format-tolerance]
  legacy_id: BUG-LOCAL-062

- id: "12.40"
  phase: 12
  area: caching
  symptom: |
    Long pipeline reports "LLM cache mismatch (Context Cap: 6144)"
    every phase boundary even though every input (model_id,
    profile, context_cap, etc.) is identical. Each mismatch
    triggers a full unload + cold reload (~15-17s). Wall-clock
    thrashes 60-90s per run with zero quality benefit.
  cause: |
    Two design weaknesses: (1) the cache check was a single
    `or`-joined boolean expression, so when it tripped the log
    only said "mismatch detected" without naming the field —
    debugging required guessing; (2) the device-residency
    sub-check read `next(model.parameters()).device` and only
    inspected the FIRST parameter from the iterator. With
    bitsandbytes 4-bit quantization the parameter iteration
    order is non-deterministic and a CPU-resident metadata
    buffer (quant_state, embed_tokens with offload, dequant
    scratch) frequently lands first. The check then fired a
    false-positive eviction every phase boundary.
  fix: |
    (a) Replace the single-param probe with a scan of up to N
    parameters (N=8 is enough). Treat the cache as still-resident
    if ANY scanned param is on `cuda`. Use the model's own
    `.hf_device_map` attribute when accelerate is in play.
    (b) Replace the inline boolean cache check with explicit
    per-field delta collection — each of `device`, `quantized`,
    `model_id`, `budget_profile`, `VERSION`, `context_cap` is
    compared individually and recorded as
    `(name, cached, requested)` tuples.
    (c) The runtime log line names the specific drifted field(s)
    so future regressions are diagnosable on first glance.
  verify: |
    Across N phase-boundary transitions with identical inputs,
    the cache-mismatch log line never appears. Wall-clock from
    one phase to the next drops from ~17s to <1s.
  tags: [llm, cache-thrash, quantized-param-iter, device-check, opaque-log, bitsandbytes, xphase-06]
  legacy_id: BUG-LOCAL-065

- id: "12.41"
  phase: 12
  area: regression
  symptom: |
    A pipeline reports "Success" with a count (e.g. "polished
    19 -> 16 lines") but the very next stage reports a wildly
    different count ("AFTER_PARSE count=1"). 15 dialogue lines
    vanished silently between the two stages with no warning.
  cause: |
    Three independent structural asymmetries can combine to make
    a silent drop invisible: (1) a regex character class differs
    by one character (e.g. `[A-Z][A-Z0-9 ]` vs `[A-Z][A-Z0-9_ ]`)
    between the parser and every other counter, so underscore-
    containing names slip through every other check but die at
    the parser; (2) a "_post_total" counter is missing one of
    the patterns that "_pre_total" counts (asymmetric counter
    at the gate); (3) a rescue path fires only on raised
    exceptions, not on quantity floors, so "succeeded but
    produced too little" never triggers it.
  fix: |
    (a) Lock all "same-thing" regex character classes to a
    shared module-level constant so divergence is impossible.
    (b) Audit every `_pre_total` / `_post_total` pair for
    symmetry; both must count every variant of the relevant
    structure.
    (c) Add a quantity-floor rescue trigger: if expected >= K
    and the actual parse produced < 50% of expected, fire a
    rescue pass on the un-parsed text and adopt the rescued
    parse only if it recovers MORE than the original.
  verify: |
    Regression file with 20 tests covering: 7 underscore /
    spaced / mixed names exercise the regex symmetry; 5
    counter symmetry tests across all token forms; 6 floor-
    threshold tests covering the trigger zone, the no-trigger
    zone, and the close-enough-to-skip zones. All pass.
  tags: [pipeline-counter-asymmetry, parser-regex-divergence, silent-drop, rescue-on-floor, regex-shared-constant]
  legacy_id: BUG-LOCAL-066

- id: "12.42"
  phase: 12
  area: hygiene
  symptom: |
    A "single super-folder" output design was introduced (e.g.
    `output/myproject/`) but write paths drifted: some nodes write
    to the new tree, others still hardcode the old path. A media
    server / sync tool watching the new folder misses half the
    artifacts.
  cause: |
    Foldering was added incrementally without a single source of
    truth. Each write path was hardcoded at its call site. Intent
    was documented in roadmap docs but not enforced by code review
    or tests.
  fix: |
    (a) Centralise all write paths in a single helper module (e.g.
    `output_paths.py`). Every node imports from it, never
    hardcodes. (b) Add a regression test that asserts the write-
    path SHAPE of every node that exposes its output dir. (c)
    Never move existing files when migrating to a new folder —
    legacy consumers need a stable read path.
  verify: |
    Grep for hardcoded `output/<old_name>/` strings — zero matches
    except in migration-fallback code. All test assertions on path
    shape pass.
  tags: [output-foldering, centralised-helper, legacy-fallback, intent-not-enforced, super-folder]
  legacy_id: BUG-LOCAL-067

- id: "12.43"
  phase: 12
  area: regression
  symptom: |
    Two upstream stages emit a key naming the same logical entity
    in different forms (spaces vs underscores, ALL CAPS vs Title
    Case). A merge step keyed on raw strings does not collapse
    them, so the merged table has two rows for one entity. Voice/
    style/render assignments end up on the ghost row; downstream
    consumers see the speaking row and find `<assignment>=None`,
    falling back silently to defaults.
  cause: |
    Lookup mismatches across name-spaces are silent by default —
    they dont raise, they dont log, they just append a duplicate
    row. Two parsers that "should" produce the same key often
    diverge across JSON serialise/deserialise round-trips.
  fix: |
    Whenever two upstream stages produce keys for the same entity,
    define a shared normaliser and apply it on BOTH sides of every
    lookup. Persist the normalised form as the canonical one.
  verify: |
    Regression test that exercises the merge with realistic mixed-
    form inputs. Result: one row, both fields populated.
  tags: [name-namespace, normaliser, merge-key, silent-duplicate, canonical-form, normalizer]
  legacy_id: BUG-LOCAL-068

- id: "12.44"
  phase: 12
  area: ledger
  symptom: |
    Every node renders deterministic on-disk artifacts (WAV, PNG,
    MP4) but the canonical ledger has `wav_path=None` /
    `png_path=None` for those rows. Auditing which artifact backed
    which logical row requires globbing the cache directory by
    hash.
  cause: |
    Render nodes computed the deterministic cache_path before
    generation but never wrote it into the ledger. The Ledger
    classs `apply_*_paths()` methods existed for this purpose;
    nobody invoked them.
  fix: |
    Every node that renders a deterministic on-disk artifact MUST
    write the path back to the canonical ledger before the node
    returns. Pattern: at end of execute(), auto-discover the most
    recent `*_ledger.json`, walk relevant rows, stamp `path` and
    `dur_s`, write atomically. Wrap in try/except so a missing-
    ledger or write-failure logs a warning but never fails the
    node. Stamp BOTH cache-hit and freshly-generated paths.
  verify: |
    After a full pipeline run, every row in `ledger.music[]`,
    `ledger.sfx[]`, `ledger.shots[]` has a non-empty `path` field
    and a positive `dur_s` (where applicable).
  tags: [ledger, write-back, traceability, auto-discover, cache-stamping]
  legacy_id: BUG-LOCAL-095

- id: "12.45"
  phase: 12
  area: regression
  symptom: |
    A heuristic that fills in for a missing ledger field clumps
    results into the first N*K seconds because it uses a fixed-
    interval slot formula. Downstream consumers miss large portions
    of the timeline.
  cause: |
    Heuristics that ignore content scale poorly. A fixed-interval
    slot picker doesnt know that line 0 is 4 seconds and line 12
    is 12 seconds; every clip lands in lockstep.
  fix: |
    When a heuristic is needed at all, prefer one that scales WITH
    the available data: word_count, char_count, total duration.
    For per-line timings: `start = total_dur * (sum_words_so_far /
    sum_words_total)`. Preserve a priority chain so the heuristic
    auto-disables once the proper write-back lands. Log the
    heuristics outputs.
  verify: |
    Feed the consumer a ledger with `total_dur=300` and 30 lines
    of equal word_count. Spread across timeline is even (max - min
    within 5% of 300).
  tags: [heuristic, scaling, priority-chain, ledger-write-back, per-line-timings]
  legacy_id: BUG-LOCAL-094

- id: "12.46"
  phase: 12
  area: vram
  symptom: |
    A timeout wrapper around a long-running model call (e.g.
    `concurrent.futures.ThreadPoolExecutor`) fires its timeout. The
    next phase OOMs even though the timed-out model was supposed
    to be unloaded. nvidia-smi shows the models weights still
    resident.
  cause: |
    `ThreadPoolExecutor` does NOT cancel the worker thread on
    timeout — Python threads cant be cancelled. The worker keeps
    running with live references to the model. The cache dicts
    `del` drops only one reference; GC cannot collect because the
    abandoned thread still holds others. GPU memory stays pinned.
  fix: |
    Two-step: (a) before deleting cache references, call
    `cache["model"].cpu()` — even when other live references
    exist, `.cpu()` frees the CUDA tensors backing the weights;
    (b) avoid `ThreadPoolExecutor` for model calls entirely; use
    `signal`-based timeouts (POSIX) or accept full-completion
    semantics. Add `torch.cuda.synchronize()` before any `.cpu()`
    call.
  verify: |
    Force a timeout. Post-unload telemetry reads ~0.03 GiB
    allocated. Next phase loads cleanly. No
    cudaErrorIllegalAddress.
  tags: [vram, threadpoolexecutor, timeout, orphan-thread, cuda-synchronize, model-unload, xref-12.19, xphase-07]
  legacy_id: BUG-LOCAL-111

- id: "06.06"
  phase: 6
  area: caching
  symptom: |
    A specific model + hardware + quantization combination produces
    `CUDA error: device-side assert triggered` during inference.
    Other models in the same dropdown work fine on the same
    hardware.
  cause: |
    Empirical incompatibility between specific model architecture,
    specific quantization mode, specific hardware architecture,
    and specific upstream library versions. The failure mode is
    not theoretical — its a real combination that throws on first
    inference attempt.
  fix: |
    Class lesson: model-platform combinations need empirical
    compatibility testing, not assumed support. When you discover
    a known-bad combination, REMOVE that model from your nodes
    dropdown immediately. Add a one-liner CONSTANTS block
    documenting the diagnosis. Document the test gate in README so
    users on different hardware know they can re-enable.
  verify: |
    Dropdown does not list the incompatible model. CONSTANTS block
    + comment cite the failure signature and date.
  tags: [model-compat, quantization, blackwell, bitsandbytes, dropdown-filter, empirical-testing, xphase-07]
  legacy_id: BUG-LOCAL-110

- id: "07.16"
  phase: 7
  area: vram
  symptom: |
    A large GGUF video unet (e.g. LTX-2.3 22B audio-in) renders at a wild
    6.84-or-223 s/it lottery -- one beat ~54s, the next ~30 MIN -- often
    stalling at "0/8 Model Initializing". It is NOT an OOM; it just crawls.
    Per-step time swings ~30x at BYTE-IDENTICAL reported VRAM ("X usable,
    Y loaded, full load: True"); nvidia-smi shows only ~200 MiB free.
  cause: |
    Two compounding faults. (1) A VAE node wired to BOTH the pre-sampler
    (i2v encode) AND the post-sampler (decode) stays pinned in VRAM through
    the whole denoise loop, because the executor's free_after_use only
    releases a node after its LAST consumer runs -- so ~1.4 GB is stolen
    from the sampler. (2) On a desktop-VRAM-tight card (16 GB with ~5 GB
    eaten by Chrome/Electron desktop apps) the unet FULL-loads to the brim
    with ~0 activation room, so the per-step activation tensors spill to
    system RAM (NVIDIA "sysmem fallback") and crawl ~20-30x. Same symptom
    class as 11.07 / 07.01 / 07.03 (VRAM-pressure slowdown, no OOM), new trigger.
  fix: |
    (1) Split the dual-consumer VAE into two graph nodes (encode-side +
    decode-side) so free_after_use reclaims the encode VAE BEFORE the
    sampler. (2) Force a PARTIAL unet load by holding ~3 GB free for
    activations: bump comfy.model_management.EXTRA_RESERVED_VRAM (the real
    --reserve-vram global) around the graph run, restored in finally
    (exception-safe; never lower a higher operator reserve). The GGUF unet
    DOES honor partial load. Result: steady ~11 s/it, no spill, no lottery.
  verify: |
    A clean render shows the unet "loaded ... full load" with ~3 GB held
    free (usable = free - ~3.9 GB) and a steady per-step time, never spiking
    20x+; nvidia-smi keeps headroom through the sampler. Lower the reserve
    for more speed / less margin.
  tags: [vram, sysmem-fallback, activation-spill, partial-load, extra-reserved-vram, free-after-use, gguf, ltx, reserve, no-oom-crawl]
  legacy_id: ""

- id: "12.47"
  phase: 12
  area: harness
  symptom: |
    A headless soak/probe leg renders on the WRONG engine (or with wrong
    feature flags) even though the submitted workflow/profile is correct:
    the server log shows LOUD env-override lines (e.g. an engine force-map)
    that nobody in the current run set. Recurs across sessions -- a past
    cleanup note says "deleted so future boots are clean", then it happens
    again.
  cause: |
    The server launch script sources an OPTIONAL per-leg env hook file
    (extra "set X=Y" lines a playlist runner writes and is supposed to
    delete after its leg). A crashed/interrupted leg ORPHANS the hook, and
    the launcher then silently injects the stale env (engine force-maps,
    opt-in flags) into EVERY subsequent headless boot -- poisoning
    unrelated runs for days. File-based env leaks also survive User/
    Machine env-var audits, so the usual "check setx" diagnosis misses it.
  fix: |
    CONSUME-ONCE semantics in the launcher: when the hook exists, ECHO its
    contents LOUDLY into the server log, call it, then DELETE it -- one
    hook = one boot. Writers re-create the hook per leg, so the per-leg
    contract is preserved and a crash can no longer poison later boots.
    Generic rule: any "sourced side-file" a launcher honors must be
    consumed (or TTL-stamped) by the consumer, never left to accumulate
    on the writer's promise to clean up.
  verify: |
    The next boot's log shows either no hook line or the loud
    "consuming ... hook" block with the hook contents; the hook file is
    absent after any boot; a forced-engine probe leg's render histogram
    matches the engine the RUN configured (not the orphan's).
  tags: [harness, env-leak, headless-boot, launcher, orphan-file, consume-once, force-map, soak]
  legacy_id: BUG-LOCAL-415

- id: "11.26"
  phase: 11
  area: llm-output
  symptom: |
    A structured-call pass whose post-validator demands VERBATIM substrings
    of an earlier pass's text (e.g. key_terms copied from a concept) kills
    the whole pipeline loudly even when the model's answer is right in
    spirit: the model paraphrases ('grieving mother' for 'a mother,
    grieving'), or the copied phrase spans a line wrap in the source
    corpus. The generic repair turn re-paraphrases, the bounded retry
    ladder exhausts, and a production render dies in its first LLM stage.
  cause: |
    Two compounding faults. (1) The grounding check compared raw lowered
    strings, so a phrase that wraps across a newline (the corpus joins
    model fields with "\n") can NEVER match a single-line term -- a
    verbatim copy gets rejected. (2) Copy-exact is the one instruction
    small local models reliably fumble inside JSON emission, and the
    generic "fix the field" repair prompt neither names the verbatim
    contract nor offers a deterministic way out, so the repair attempt
    fails the same way and burns the ladder.
  fix: |
    (1) Whitespace-normalize BOTH sides of the verbatim test (collapse
    every whitespace run to one space, lowercase) -- still exact words in
    exact order, just wrap-proof. (2) Route the failure class to a TYPED
    repair: a deterministic call-site callback runs first (prune the
    ungrounded terms when enough verbatim survivors remain -- pure text
    filtering, no LLM spend, re-validated by the full gate), falling back
    to a directive that says COPY exact contiguous phrases and re-shows
    the source text. Generic rule: every "must quote the source verbatim"
    validator needs (a) whitespace-tolerant matching and (b) a
    deterministic subset-repair before any LLM re-roll. Two follow-on
    laws from the same live-smoke night: (c) a grounded quote proves the
    LINE EXISTS, not that it belongs to the CLASS -- for closed-
    vocabulary judge classes (a weapon must be NAMED to be heard on
    radio) the lexicon is the only kill authority and the confirm-quote
    path is reserved for open-phrasing classes; (d) any judge claim
    with a deterministically checkable core ("the closing line is
    absent") must be verified in code before it may kill -- the judge
    twice claimed a non-empty line it had just been shown was missing.
  verify: |
    A term that wraps across a line break in the source corpus grounds
    cleanly; a response with one paraphrased term among >= 2 verbatim
    terms finishes with NO second LLM call and the paraphrase pruned; a
    response with < 2 grounded terms takes the typed verbatim-copy repair
    turn and, if the model repeats itself, still fails loud after the
    bounded ladder. Statically: any file carrying an "anchor A2" style
    verbatim-grounding gate also carries a whitespace-collapse
    normalizer used on both sides of the substring test.
  tags: [llm-output, structured-call, post-validator, verbatim-grounding, whitespace-normalization, deterministic-repair, retry-ladder, repair-prompt, llm]
  legacy_id: ""


# ─────────────────────────────────────────────────────────────
# CHUNK 3 — Bulk fan-out from OTR PROD_BUG_LOG (2026-07-10/11)
# 23 entries promoted from live/prod-run bug staging under the
# Three-File Contract. legacy_id carries the originating PBUG id.
# ─────────────────────────────────────────────────────────────

- id: "02.15"
  phase: 2
  area: encoding
  symptom: |
    Detached headless boot (soak/API server launch) dies ~13 seconds in
    with exit code 1 and "SERVER DID NOT COME UP" in the log, even though
    the exact same launch works fine from an interactive terminal.
  cause: |
    A detached process (started via cmd.exe /c or Start-Process without an
    explicit encoding) inherits Windows' legacy cp1252 console codec, not
    UTF-8. Any print() in a startup-time script (prestartup_script.py, a
    custom node's module-level code, etc.) that emits a non-ASCII
    character -- most commonly a status emoji like a checkmark or
    cross-mark -- raises UnicodeEncodeError the instant it executes,
    killing the boot before the server ever binds its port.
  fix: |
    Set PYTHONUTF8=1 and PYTHONIOENCODING=utf-8 in the environment of
    every detached/headless launch path (launcher .cmd/.ps1), not just
    the interactive one. Any new boot path (soak harness, CI runner,
    scheduled task) must set both vars before invoking python.exe.
  verify: |
    Boot the server via the detached launcher and confirm PYTHONUTF8/
    PYTHONIOENCODING are present in its environment; the boot log shows
    no UnicodeEncodeError and the server reaches a listening state within
    the normal ~20s window. Grep every launcher script for PYTHONUTF8=1.
  tags: [windows, encoding, cp1252, headless, boot, launcher, unicode]
  legacy_id: PBUG-20260612-01

- id: "07.17"
  phase: 7
  area: vram
  symptom: |
    A full-episode VRAM soak measures a peak of 15.8GB against a 14.5GB
    ceiling, on both device modes, in a pipeline stage (LTX-AV) that
    combines a text encoder with a video generation pass.
  cause: |
    The text encoder (Gemma) stayed GPU-resident through the entire video
    pass instead of being released once its output was consumed, holding
    VRAM the video stage then had to compete for.
  fix: |
    Move the text encoder to CPU after its output is captured (attempted).
    A later re-measured soak PROVED this offload had NO effect on the
    measured peak, and the change was reverted. Record the disproof
    explicitly so the same offload isn't re-attempted blind on a future
    VRAM-ceiling rip -- re-derive the actual peak-VRAM contributor before
    trying an "obvious" fix.
  verify: |
    Full-episode soak reports peak VRAM; assert the measured peak matches
    the currently-accepted (reverted) architecture, not the offloaded one.
    Before proposing an encoder-offload fix for a similar VRAM-ceiling
    breach, re-soak once with the offload OFF to confirm it's still the
    right baseline.
  tags: [vram, soak, offload, text-encoder, ltx-av, disproven-fix]
  legacy_id: PBUG-20260616-01

- id: "11.27"
  phase: 11
  area: model-registry
  symptom: |
    Selecting a remote/cloud model slot (e.g. "openrouter:slot-a") crashes
    the episode at line-compose with a KeyError, even though the same code
    path works fine for every LOCALLY-curated model.
  cause: |
    The lookup did an exact-match dict access (rows[repo_id]) against a
    dict that was only ever populated from a CURATED, LOCAL model list.
    Remote/cloud model handles are never curated members of that dict, so
    the exact-match access always raises for them.
  fix: |
    Replace exact-match dict access with rows.get(repo_id) plus an
    explicit default (a generic/modern prompt profile) for any handle
    absent from the curated table, instead of assuming every valid model
    id is a member.
  verify: |
    Run with a remote/cloud model handle that is deliberately absent from
    the curated dict; assert the lookup falls back to the default profile
    and completes instead of raising KeyError. Grep any `dict[key]`
    lookup keyed by a user-selectable model handle and confirm it uses
    `.get()` with a documented default.
  tags: [llm-output, model-registry, keyerror, dict-lookup, remote-model, exact-match, llm]
  legacy_id: PBUG-20260618-01

- id: "07.18"
  phase: 7
  area: audio
  symptom: |
    A dedicated visualizer/render soak forcing edge-case beats (0-frame
    beats, fully silent beats) surfaces a cluster of four distinct
    crashes/misbehaviors in one soak run: no floor on 0-frame beats, no
    handling for an idle scope on a silent beat, an audio_ref check that
    over-gates valid input, and a master-audio slice that is never fed to
    a downstream consumer.
  cause: |
    Four separate missing guards, each independent: (1) no minimum-frame
    floor before a beat reaches frame-dependent logic, (2) no explicit
    handling path for an "idle" beat scope, (3) assert_usable() gated
    audio_ref too aggressively, rejecting legitimate input, (4) the b000
    master-audio slice was computed but never actually passed to the node
    that needed it.
  fix: |
    Add an explicit 0-frame floor before any frame-dependent computation;
    add an idle-scope branch that handles a silent beat without erroring;
    loosen the audio_ref gate in assert_usable to accept the valid case;
    wire the b000 master-audio slice through to its consumer.
  verify: |
    Run the visualizer soak forcing 0-frame beats, silent beats, and the
    audio_ref/master-slice edge cases together; every beat reaches
    status=success with none of the four original failure signatures.
  tags: [audio, video, visualizer, soak, 0-frame, idle-scope, audio-ref, master-audio]
  legacy_id: PBUG-20260618-02

- id: "08.07"
  phase: 8
  area: io
  symptom: |
    A PUBLISHED episode's bottom bars overlay renders flat/static or a
    solid color instead of tracking the audio -- the defect shipped all
    the way to a final published artifact, not just a dev render.
  cause: |
    The bars-overlay node read amplitude from the silent intermediate
    blend source used earlier in the compositing chain instead of the
    final master WAV that actually carries the mixed audio.
  fix: |
    Point the bars-overlay amplitude read at the master WAV, not the
    silent blend-stage source.
  verify: |
    Run the obs-final render pipeline; assert the bars overlay's
    amplitude trace correlates with the master WAV's amplitude envelope,
    not a flat/silent signal.
  tags: [io, audio-reactive, overlay, obs-final, published-artifact, silent-source]
  legacy_id: PBUG-20260620-01

- id: "05.10"
  phase: 5
  area: python-scoping
  symptom: |
    Every episode crashes at execution with UnboundLocalError, but only in
    a specific heavy node the unit-test suite never actually exercises.
  cause: |
    A local `import os` statement anywhere inside a function body makes
    `os` a LOCAL name for the ENTIRE function, even on lines executed
    before that import line runs. A meta-stamp line earlier in the same
    function referenced os.environ, and Python resolved `os` as the
    (not-yet-assigned) local rather than the module-level import, raising
    UnboundLocalError.
  fix: |
    Move the local import to the top of the function (or remove it in
    favor of the existing module-level import) so no name inside the
    function is ambiguous between local and global scope.
  verify: |
    An end-to-end test exercises the meta-stamp code path in the heavy
    node specifically (not just the light nodes the suite already
    covers). Lint/grep for any function containing both a
    module-level-shadowing `import X` and a reference to `X` earlier in
    the same function body.
  tags: [python, scoping, unboundlocalerror, shadowed-import, execution-model]
  legacy_id: PBUG-20260622-01

- id: "07.19"
  phase: 7
  area: audio
  symptom: |
    A pre-freeze sweep re-roles an ANNOUNCER-named cast row to an
    ordinary character role, sending it to a voice engine that cannot
    handle it and crashing with EngineUnusable.
  cause: |
    The cast-role-coercion function had no naming-convention exemption
    for a row whose cast id/name IS the announcer -- it treated every row
    as an ordinary candidate for role coercion.
  fix: |
    Exclude ANNOUNCER-named rows from role coercion explicitly, by
    name/id, before the coercion logic runs.
  verify: |
    Run an episode with the announcer keyed as an ordinary cast id (the
    trigger condition) and confirm it renders clean, without being
    re-roled or reaching the character voice engine.
  tags: [audio, casting, announcer, role-coercion, naming-convention]
  legacy_id: PBUG-20260622-02

- id: "07.20"
  phase: 7
  area: audio
  symptom: |
    A dialogue row whose content is PURE stage direction (zero spoken
    words) reaches the voice engine and crashes the render.
  cause: |
    No handling existed for a dialogue row that is degenerate -- all
    stage direction, no actual speech -- before it was handed to TTS.
  fix: |
    Recompose the row into real dialogue at the source (root fix) when
    possible; where recomposition isn't available, fall back to a
    silence backstop rather than crashing (flagged: a fail-soft backstop
    conflicts with a stricter no-fallback law adopted later -- re-evaluate
    against current policy before reusing this backstop).
  verify: |
    Force a stage-direction-only line through the pipeline; assert
    either the recompose path fires (real dialogue) or a controlled
    silence backstop, and in neither case does the render crash.
  tags: [audio, tts, stage-direction, degenerate-content, silence-backstop]
  legacy_id: PBUG-20260622-03

- id: "09.05"
  phase: 9
  area: cloud-api
  symptom: |
    A cloud music-generation API call is rejected with HTTP 422
    provider_rejected on short-duration requests.
  cause: |
    The requested clip duration was under the provider's documented
    minimum, and no floor was applied before sending the request.
  fix: |
    Apply a minimum-duration floor (request at least the provider
    minimum) and trim the result back down to the originally intended
    duration after generation.
  verify: |
    Request a duration below the provider's documented minimum; assert
    the outbound request is floored to the minimum and the call
    completes without a 422.
  tags: [cloud-api, network, contract, http-422, duration-floor]
  legacy_id: PBUG-20260704-01

- id: "09.06"
  phase: 9
  area: cloud-api
  symptom: |
    A cloud image-generation node call crashes with "TypeError: string
    indices must be integers".
  cause: |
    The node's Python-side model parameter expects a structured
    DYNAMICCOMBO-style dict, but the caller sent a bare model-name string
    -- the contract for what shape the model parameter must take varies
    PER cloud node even within the same provider family, so a pattern
    that works for one sibling node (a bare string) fails for another.
  fix: |
    Send the model parameter as the expected dict shape for this
    specific node rather than assuming the bare-string contract from a
    sibling node.
  verify: |
    Call the affected cloud node live; assert it completes instead of
    raising TypeError. Before reusing a call pattern across cloud nodes
    from the same provider, confirm each node's actual expected shape
    rather than assuming uniformity.
  tags: [cloud-api, contract, dict-vs-string, typeerror, provider-variance]
  legacy_id: PBUG-20260704-02

- id: "07.21"
  phase: 7
  area: audio
  symptom: |
    Two logically distinct voice ids resolve to the same underlying WAV
    file even when the caller explicitly disallows voice reuse.
  cause: |
    No check existed for the case where two different ids collide on the
    same underlying asset/provider identity -- the no-reuse gate only
    checked the requested id, not the resolved asset behind it.
  fix: |
    Add a same-asset/same-provider collision check that fires whenever
    allow_voice_reuse=False, independent of whether the requested ids
    differ.
  verify: |
    Resolve N voice ids under allow_voice_reuse=False; assert all N
    resolved WAV file hashes are distinct.
  tags: [audio, tts, voice-reuse, collision, asset-identity, no-fallback]
  legacy_id: PBUG-20260709-01

- id: "11.28"
  phase: 11
  area: llm-output
  symptom: |
    A creative-slot LLM's structured JSON output is truncated mid-object,
    causing schema failures in every downstream consumer, even though the
    requested context window (n_ctx) should have been large enough to
    hold the full response.
  cause: |
    The selected local quant (Q8 of a 4B-class model) cannot actually
    hold the requested n_ctx (4096) within the available VRAM; the
    loader silently downgraded to a smaller n_ctx (2048) instead of
    raising, so the caller had no signal that its context budget had
    been cut.
  fix: |
    Swap the affected slot to a model/quant combination that fits the
    requested n_ctx (root fix for this slot); separately, make every
    silent n_ctx downgrade in the loader RAISE instead of downgrading
    quietly, so any future capacity mismatch fails loud immediately
    rather than corrupting output downstream.
  verify: |
    Request an n_ctx above a given quant's actual capacity; assert the
    loader raises rather than silently returning a smaller context.
  tags: [llm-output, n_ctx, silent-downgrade, quantization, vram, truncation, llm]
  legacy_id: PBUG-20260710-01

- id: "11.29"
  phase: 11
  area: llm-output
  symptom: |
    A structured-call reroll path (e.g. a targeted revision retry) throws
    a jinja TemplateError mid-render.
  cause: |
    The reroll path emitted two consecutive user-role messages back to
    back; the chat template enforces strict user/assistant alternation
    and has no tolerance for two user turns in a row.
  fix: |
    Fold the reroll content into a SINGLE user message instead of
    appending a second one, preserving strict role alternation.
  verify: |
    Construct a reroll that would previously have emitted two
    consecutive user messages; assert the message list strictly
    alternates roles before it is sent to the chat template.
  tags: [llm-output, chat-template, jinja, role-alternation, reroll, llm]
  legacy_id: PBUG-20260710-04

- id: "11.30"
  phase: 11
  area: llm-output
  symptom: |
    A structured casting-JSON call truncates at its token ceiling; the
    salvage path extracts a partial object that then fails schema
    validation.
  cause: |
    The 1000-token budget allotted to the pass was too small for the
    full structured payload being requested, so truncation-then-salvage
    fired on essentially every call rather than as a rare edge case.
  fix: |
    Raise the token budget (1000 -> 1400) for this pass, and make the
    pre-validator tolerant of an expected wrapper shape so a
    well-formed-but-wrapped payload doesn't need the salvage path at all.
  verify: |
    Run a near-ceiling casting payload through the pass; assert it
    completes without the salvage path firing. This is the same
    token-ceiling truncation-then-salvage class recurring across
    multiple lanes -- check any new structured pass's token budget
    against its actual payload size before shipping.
  tags: [llm-output, token-budget, truncation, salvage, casting, structured-output, llm]
  legacy_id: PBUG-20260710-05

- id: "11.31"
  phase: 11
  area: llm-output
  symptom: |
    A roll dies on WORD_BUDGET exhaustion (e.g. 54 words returned against
    a 24-36 word acceptance band) even though the deviation is small in
    absolute terms.
  cause: |
    The acceptance band was sized as a flat +/-20% of the target word
    count. At a small target (e.g. 30 words) that proportional band is
    only ~12 words wide -- far too narrow for normal LLM length variance
    at small targets, even though the same +/-20% is reasonable at large
    targets.
  fix: |
    Add an absolute slack floor (+/-25 words) that governs at small
    targets; let the proportional (+/-20%) band take over only once the
    target is large enough (>=125 words) that the proportional band is
    wider than the floor.
  verify: |
    Unit test the word-band function at target=30 and confirm the
    absolute floor (not the proportional percentage) governs the
    accepted range. This same defect class was independently flagged,
    unfixed, in another lane at small word targets -- generalize the fix
    rather than patching one call site.
  tags: [llm-output, word-budget, proportional-band, small-targets, unit-test, llm]
  legacy_id: PBUG-20260710-06

- id: "11.32"
  phase: 11
  area: llm-output
  symptom: |
    A postamble/announcer row arrives downstream with
    speaker_role=character, skip=True, tts_skip_reason=null, after a
    fully green multi-pass pipeline run -- with NO compose-flag
    breadcrumb anywhere explaining the mutation.
  cause: |
    UNKNOWN / UNIDENTIFIED. An unsanctioned, cast-keyed mutator somewhere
    downstream flips the announcer row's fields without stamping a
    reason. Root mutator was NOT found despite investigation; this entry
    documents a mitigation, not a fix.
  fix: |
    Partial mitigation only: give the announcer row a sentinel char_id
    that exempts it from cast-keyed mutation paths, so the class of bug
    (any cast-keyed path touching the announcer) can no longer fire even
    though the specific offending path is still unidentified.
  verify: |
    NON-TESTABLE by static analysis -- the obligation is to TRACE every
    cast-keyed mutation path and assert none of them can flip the
    announcer's role/skip/reason fields without stamping a reason; this
    requires runtime instrumentation across the full pass sequence, not
    a file-level check. Treat the sentinel as a stopgap and keep the
    root-cause hunt open.
  tags: [llm-output, silent-mutation, unidentified-root-cause, announcer, sentinel, data-corruption, llm]
  legacy_id: PBUG-20260710-07

- id: "11.33"
  phase: 11
  area: llm-output
  symptom: |
    A model injects one of its own fictional/invented characters into a
    pass that is supposed to be a READ-ONLY rendering of real news
    content.
  cause: |
    No gate existed to catch invented cast names leaking into the
    real-source read pass -- the model treated the read pass as
    continuous with its fictional narrative rather than as verbatim
    source material.
  fix: |
    Add a cast-name-in-read gate that checks the read-pass output
    against the known fictional-cast roster and rejects with a teaching
    error (repair prompt) if a fictional name appears.
  verify: |
    Construct a fixture where a fictional cast name appears in the read
    output; assert the gate rejects it and issues the repair prompt
    rather than letting it through.
  tags: [llm-output, fiction-fact-bleed, cast-name, gate, real-news, source-fidelity, llm]
  legacy_id: PBUG-20260710-08

- id: "11.34"
  phase: 11
  area: llm-output
  symptom: |
    An otherwise clean, passing draft gets killed solely because its
    CODA section ends with a period instead of the required colon.
  cause: |
    The colon is structurally load-bearing to a downstream parser, but
    the model treats terminal punctuation as a stylistic choice; there
    was no normalization step before the structural check ran, so a
    semantically-equivalent period triggered a false kill.
  fix: |
    Normalize the CODA's terminal punctuation (pivot a trailing period
    to the required colon) in the shared pre-lex step before the
    structural check runs. Flagged: this fixes the punctuation
    false-kill, but an inner sentence-break defect in the same draft
    class remains a separate, real issue to track.
  verify: |
    Construct a CODA ending in '.'; assert it normalizes to ':' before
    parsing and does not trigger a false kill.
  tags: [llm-output, structural-punctuation, false-kill, normalization, parser-contract, llm]
  legacy_id: PBUG-20260710-09

- id: "11.35"
  phase: 11
  area: llm-output
  symptom: |
    A structured pass returns a fact whose cited source_spans quote does
    not match the actual payload slice at the given offsets; the
    validator halts the lane before any downstream dialogue/media spend.
  cause: |
    The repair prompt was not explicit that the field/start:end slice
    must be an exact, literal identity against the payload -- the
    model's typed repair attempt reproduced the same mismatch because
    the contract wasn't spelled out concretely enough to fix it.
  fix: |
    Harden the repair prompt to show the required
    payload[field][start:end] identity explicitly, plus slice-mismatch
    diagnostics, applied uniformly across every lane sharing this
    contract shape (a cross-lane audit found the same gap in multiple
    independent lanes).
  verify: |
    Construct an offset-span mismatch fixture; assert it converges to a
    correct span within the bounded repair-ladder budget. This is the
    first member of a P0 evidence-contract defect class -- check any
    new lane sharing the source_spans contract for the same gap.
  tags: [llm-output, source-spans, evidence-contract, repair-prompt, validator, cross-lane, llm]
  legacy_id: PBUG-20260710-10

- id: "11.36"
  phase: 11
  area: llm-output
  symptom: |
    A model returns evidence IDs in an unpadded shape (F0, F1, F2) where
    the schema contract requires zero-padded IDs (F01, F02, F03); the
    validator halts the lane on the shape mismatch.
  cause: |
    The typed-repair contract didn't give the model explicit lexical ID
    mappings, so the zero-padding requirement was only implicit and the
    model reproduced its own unpadded convention.
  fix: |
    Tighten the repair contract with explicit lexical ID mappings plus a
    recompute-quotes-from-payload-slice instruction, applied uniformly
    across every lane sharing the contract, while leaving dialogue
    content untouched (only the deterministic metadata repair is
    affected).
  verify: |
    Construct a fixture returning unpadded IDs; assert the repair
    converges to the correctly zero-padded shape within the
    repair-ladder budget. Pin the required pad width directly in schema
    tests so a future contract change can't silently drop it.
  tags: [llm-output, evidence-id, zero-padding, schema-contract, repair-ladder, llm]
  legacy_id: PBUG-20260711-01

- id: "11.37"
  phase: 11
  area: llm-output
  symptom: |
    After an evidence-ID repair converges to the correct shape, the SAME
    quote is repeated with WRONG start/end offsets -- a separate,
    span-integrity P0 failure the validator correctly halts on.
  cause: |
    The repair contract fixed the ID-shape defect but did not force
    offsets to be recomputed against the actual payload slice, so a
    structurally-correct ID could still carry a stale/wrong offset pair.
  fix: |
    Ship a fail-closed, METADATA-ONLY repair module that may reindex an
    EXACT quote already present in the source and normalize IDs, but may
    NOT invent or rewrite any dialogue content. Dialogue-level rewrites
    are reserved for a separate, later, context-aware creative pass --
    never a blind mechanical patch or a context-free LLM retry that
    could break story continuity.
  verify: |
    Construct an offset-shifted but EXACT-quote fixture; assert it
    reindexes deterministically. Assert the ID normalizer maps F0 -> F01
    (not F00 -- an actual off-by-one defect was caught validating this
    fix). Assert the dialogue field is byte-identical before and after
    the repair.
  tags: [llm-output, span-integrity, offset-repair, metadata-only, fail-closed, dialogue-preservation, llm]
  legacy_id: PBUG-20260711-02

- id: "11.38"
  phase: 11
  area: llm-output
  symptom: |
    A typed structured-output pass returns legacy Markdown prose on its
    first attempts, then a legacy-shaped score object missing required
    schema keys (with extra unrelated keys) on the typed repair attempt;
    the strict validation ladder halts before any dialogue/media spend.
    A compact typed draft can also name every nested field and length yet omit
    its literal/type semantics: the model then supplies a numeric advisory value
    where a narrative string belongs or invents a descriptive enum value, and
    the same omission survives typed repair.
    A small review artifact can likewise begin with the correct verdict and
    item shape but one over-cap string; an ambiguous repair then replaces a
    valid literal and string list with diagnostic vocabulary and objects.
    A tiny authored artifact can also have one over-cap string copied unchanged
    by repair when its exact per-field limits are present only in machine schema
    and a much larger original request competes with the failed object.
    A compact nested artifact can satisfy a locked global item count by placing
    every item into one local collection, crossing that collection's independent
    cap, when the prompt states the two constraints without relating them.
  cause: |
    The prompt/seam said "JSON only" but never named the exact current
    schema's required top-level keys, so the model copied the shape of
    its OWN input (a different, legacy structure) instead of the
    requested typed artifact.
    When a full schema is intentionally omitted for context fit, the compact
    replacement repeated field names but lost nested enum literals and the
    distinction between advisory numeric inputs and model-authored prose.
    Feeding a large original input and structured validation diagnostics into
    a small-artifact repair can also make those evidence shapes compete with
    the output schema.
  fix: |
    Append the exact required top-level schema keys to every typed pass
    and repair seam across all lanes sharing the contract, and
    explicitly forbid Markdown/prose output, while preserving full story
    context. A compact schema replacement must additionally name every
    load-bearing nested literal/type rule in model language (for example,
    enumerate allowed cue IDs and state that a narrative phase is a JSON string,
    never a word-band number). Feed the same compact contract to base, restart,
    and typed-repair calls. For a small repair, supply only the failed artifact
    plus bounded rejection evidence, preserve already-valid fields, and state
    that diagnostic codes/messages are not an output template. Do not normalize
    author-owned choices in Python. Repeat the small artifact's exact keys and
    per-field caps in plain model language. For a rejected authored string,
    require a real rewrite rather than an unchanged copy or mechanical clipping,
    and give the writer a conservative target below the hard rejection edge.
    When a locked global count is distributed across bounded nested collections,
    state the exact required flattened total, each local maximum, and the derived
    minimum collection count together at base and repair boundaries.
  verify: |
    Capture a typed-pass prompt for each affected lane; assert the exact
    required top-level schema keys are named in the prompt text. Live
    smoke must reach the next pass without legacy-key drift. For a compact draft,
    inject a numeric narrative phase and a descriptive enum name, then assert
    both the base and typed-repair prompts carry the precise nested literal/type
    rules and accept only the corrected model-authored draft.
    Also inject a correctly shaped review with one over-cap rationale; require
    repair to preserve its valid verdict and string-item list, shorten only the
    rejected prose, repeat the literal/item-type contract in both prompts, and
    omit the large original request from the repair turn.
    For a three-field authored artifact, inject one over-cap value and require
    the repair prompt to state all hard caps plus a lower rewrite target, carry
    only the failed artifact and rejection, preserve valid fields byte for byte,
    and accept only a model-authored bounded replacement.
    For nested topology, inject an artifact with too few total items and require
    the repair to meet the locked flattened total without crossing any local cap;
    assert base and repair prompts both name the exact total, local maximum, and
    derived minimum number of collections.
  tags: [llm-output, structured-output, schema-drift, legacy-shape, markdown, repair-seam, nested-literals, compact-schema, llm]
  legacy_id: PBUG-20260711-03

- id: "12.48"
  phase: 12
  area: concurrency
  symptom: |
    Intermittent save failures occur during a refine loop, specifically
    racing against a concurrent freeze cascade.
  cause: |
    A loser-directory cleanup step (removing the losing revision's
    working directory after a refine pass) raced against the freeze
    cascade, which could be reading/finalizing that same directory at
    the same time.
  fix: |
    Ship the LAST revision as the winner and drop the racing cleanup
    step entirely rather than trying to synchronize it against the
    freeze cascade.
  verify: |
    Run the refine loop repeatedly under load; assert zero save failures
    and that the freeze lands cleanly every time. This is a race class
    -- any future cleanup code added near the freeze cascade should be
    checked for the same race before shipping.
  tags: [concurrency, race-condition, refine-loop, freeze-cascade, cleanup]
  legacy_id: PBUG-20260623-01

- id: "11.39"
  phase: 11
  area: llm-output
  symptom: |
    A source-derived creative lane produces a structurally valid story that
    abandons its supplied source constraints, for example by turning ordinary
    objects into speculative artifacts or replacing the promised resolution
    with a genre invention.
  cause: |
    Source provenance was represented as opaque IDs or broad prose rather than
    as an immutable, literal grounding contract carried through every authored
    artifact and its audit boundaries.
  fix: |
    Derive a small immutable grounding contract containing the source's exact
    object, mechanism, and resolution anchors. Require those anchors at their
    owned score and spoken-script locations, validate them after every retake,
    and keep visual-style instructions on a separate channel that cannot alter
    any story message.
  verify: |
    Remove one required source literal from an otherwise valid artifact and
    assert the exact owning coordinate fails before publication. Switch only a
    visual-style setting and assert captured story messages remain byte-identical.
  tags: [llm-output, source-grounding, provenance, literal-anchor, channel-isolation, fail-closed, llm]
  legacy_id: PBUG-20260712-04

- id: "11.45"
  phase: 11
  area: llm-output
  symptom: |
    A structured response uses a plausible but non-canonical ownership shape:
    it packs several owned values into suffixed fields, nests a declared
    top-level collection inside a caller row, or puts a complete child
    collection under a parent that does not own it.
  cause: |
    Row schemas validated local fields but not canonical collection placement
    and exact ownership. A model could therefore return syntactically useful
    data in the wrong depth or cardinality, and a typed retry could repeat it.
  fix: |
    Define exact collection ownership and canonical depth at every nested row
    boundary. At the accepted typed-object boundary, lift or project only
    provably authoritative declared data into its canonical location, reject
    ambiguous, suffixed, or unknown shapes, and re-run the complete graph
    validator after projection.
  verify: |
    Test suffixed owned fields, a complete top-level collection nested in a
    caller row, and a complete child collection nested under the wrong parent.
    Assert the deterministic repair preserves authoritative values, produces
    the canonical shape for base and typed-repair responses, and fails closed
    for ambiguous or graph-invalid input.
  tags: [llm-output, schema-ownership, collection-placement, canonical-shape, typed-repair, fail-closed, llm]
  legacy_id: PBUG-20260712-01

- id: "11.40"
  phase: 11
  area: llm-output
  symptom: |
    A deterministic schema or ownership repair works on an initial model
    response but is skipped on a typed-repair response, allowing forbidden
    metadata, malformed collection placement, or duplicate ownership to reach
    the accepted artifact boundary.
  cause: |
    The repair was attached to one response factory or early parse branch
    instead of the single canonical boundary that validates every raw and
    repaired representation before acceptance.
  fix: |
    Put each proven-safe projection at the typed accepted-object boundary.
    Apply it to base and repair responses before the complete validator runs;
    preserve all non-owned authored fields, and reject an unknown or ambiguous
    shape rather than broadening a mechanical repair into content rewriting.
  verify: |
    Feed the same eligible defect through both the base and typed-repair
    response paths. Assert both converge through the projection, authored
    fields remain unchanged, and an out-of-scope shape still fails closed.
  tags: [llm-output, acceptance-boundary, deterministic-projection, typed-repair, ownership, fail-closed, llm]
  legacy_id: PBUG-20260712-06

- id: "11.41"
  phase: 11
  area: llm-output
  symptom: |
    An artifact contains two independent mechanical defects, but each safe
    normalizer refuses to run until the other defect is already absent, so the
    global validator can never see the jointly repaired artifact.
  cause: |
    Each projection was coupled to full-artifact validity instead of exposing
    a narrow, independently safe transform that can compose with other
    declared transforms before final validation.
  fix: |
    Factor each safe normalizer into a bounded projector and a full-validation
    wrapper. Apply only declared disjoint projectors in deterministic order,
    preserve authored content and chronology, then run the complete validator
    once over their shared result.
  verify: |
    Construct a fixture with both eligible defects in base and typed-repair
    responses. Assert the composed projection changes only owned fields,
    maintains deterministic order, and leaves an unrelated invalid condition
    rejected by the complete validator.
  tags: [llm-output, projection-composition, deterministic-order, canonical-validation, preservation, llm]
  legacy_id: PBUG-20260712-11

- id: "11.42"
  phase: 11
  area: llm-output
  symptom: |
    A full score or script is regenerated to correct one localized semantic
    omission, causing context-window overflow or repeating the omission while
    needlessly risking already-valid structure and prose. The same failure can
    appear when a complete typed artifact has only a few author-owned strings
    over finite schema caps: a whole-artifact typed repair reauthors valid
    surface but repeats the local overflow.
  cause: |
    The repair ladder treats a missing fact in one explicitly owned leaf as a
    whole-document failure instead of distinguishing local semantic repair
    from structural or global-contract repair. It may also classify visible
    Pydantic string-length errors as local without proving the still-hidden
    compiler, graph, reference, or rewrite contract is otherwise valid.
    A lazy slot wrapper can also erase the concrete transport behavior needed
    to choose a safe bounded patch route, and generic attempt accounting can
    overwrite a direct patch's real parse/schema failure with the empty
    factory-result classification. An upstream base or rewrite prompt can also
    expose private schema caps as authoring targets and invite a broad rewrite,
    creating more local overflows than the proven patch envelope can carry.
  fix: |
    Derive a minimal typed patch plan from immutable contract evidence. Allow
    the model to replace only the named leaf fields; require exact one-for-one
    target coverage, required literal anchors, no out-of-scope edits, and a
    complete merged-artifact validation. For author-owned over-cap prose,
    derive exact typed validation locations and declared caps, preserve the
    complete original selected text in a bounded request, preflight a probe
    through the complete artifact validator before patch dispatch, and let the
    author make one bounded shortening decision. Unknown, broader, hidden
    structural, malformed, or still-over-cap defects remain fail-closed on the
    normal ladder; never Python-clip author prose. Admit any transport only by
    an explicit behavioral capability: exact-tokenizer prompt-fit enforcement,
    or complete-message delivery with terminal provider/context failure. Keep
    output limits strict across provider-wide floor overrides. Preserve JSON
    transport through lazy slot wrappers; unknown wrappers are not patch
    eligible. Let a direct patch own its bounded receipt so
    generic completion handling cannot rewrite its parse/schema/contract truth.
    Because models approximate character counts, expose only a conservative
    authoring ceiling below each immutable schema cap; keep the larger hard
    rejection edge private so the model cannot anchor on it, and never
    Python-clip authored text. Name source inputs as explicit transform tasks,
    not output-like fields that invite unchanged copying, and keep the patch
    contract concise rather than duplicating competing instructions.
    Apply those conservative ceilings at base, restart, full-repair, and rewrite
    authoring boundaries as well as the local patch. A rewrite must change only
    prose required by its review and preserve every other prior prose leaf byte
    for byte; do not solve broad overflow by arbitrarily widening patch capacity.
    Distinguish a model-authored replacement overflow from an invalid patch
    root in the bounded receipt without retaining rejected prose.
  verify: |
    Remove one immutable literal from an otherwise valid score and script.
    Assert a small typed patch repairs only its planned target, rejects missing
    or unplanned targets, leaves every other field byte-identical, and clears
    the complete artifact validator. For a live over-cap prose shape, exercise
    every whitelisted leaf/cap, reject mixed or oversized-target errors, prove
    hidden graph/compiler failure takes the normal repair, require exactly one
    author patch call with a bounded receipt, and reject malformed, duplicate,
    unknown, blank, or still-over-cap replacement rows without another reroll.
    Exercise a scheduler-wrapped full-message remote slot and assert a captured
    localized shape uses same-slot JSON-mode bounded repair, its strict output
    limit survives a larger global floor, and an over-envelope shape preserves
    full repair. Assert malformed direct-patch receipts retain their real
    parse/schema statuses. Capture the repair request and require its authoring
    target to have safety margin below the hard cap. Inject a replacement just
    over that cap and require a prose-overflow receipt code with no rejected
    text retained. Capture base, full-repair, and rewrite instructions and prove
    each exposes only conservative prose ceilings; require rewrite to preserve
    non-target prose byte for byte.
  tags: [llm-output, bounded-patch, typed-schema, localized-repair, context-window, fail-closed, llm]
  legacy_id: PBUG-20260712-12

- id: "11.43"
  phase: 11
  area: llm-output
  symptom: |
    A narrow patch adds the newly missing literal but erases another immutable
    literal that was already valid in the same replaced field.
  cause: |
    The patch plan captured only the triggering omission and its validator
    checked patch-local coverage rather than the merged canonical artifact.
  fix: |
    Include every immutable invariant already present in each selected target,
    as well as newly missing requirements. Merge in memory and validate the
    complete canonical artifact at the structured-call boundary; return the
    precise merged-contract failure to the bounded retry ladder.
  verify: |
    Make a selected field contain one valid immutable literal and omit another.
    Assert the plan demands both, reject a patch that preserves only the new
    literal, and reject any patch whose merged artifact breaks graph, safety,
    grounding, or authorship validation.
  tags: [llm-output, bounded-patch, invariant-preservation, merged-validation, grounding, safety, llm]
  legacy_id: PBUG-20260712-13

- id: "11.44"
  phase: 11
  area: llm-output
  symptom: |
    An initial authoring pass has a guarded local-repair boundary, but a blind
    listener, optional polish, or final-audit retake bypasses it and reintroduces
    the same localized contract failure.
  cause: |
    The guarantee was attached to one call site rather than to the artifact's
    shared acceptance boundary, leaving later reauthoring routes with a weaker
    contract.
  fix: |
    Factor one guarded authoring helper for every route that returns the same
    artifact. It must accept structural/safety-valid output, invoke the bounded
    patch only for eligible local contract failures, validate the merged result,
    and expose the seam plus pass-specific receipt in the pipeline registry.
  verify: |
    Force a retake route to omit the same immutable literal repaired during
    initial authoring. Assert it invokes the shared small patch, records a
    pass-specific journal ID, reruns the downstream audit, and that every
    pipeline route advertises the repair seam.
  tags: [llm-output, shared-boundary, retake, bounded-patch, pipeline-contract, audit-receipt, xref-11.40, llm]
  legacy_id: PBUG-20260712-15

- id: "12.49"
  phase: 12
  area: metadata-provenance
  symptom: |
    A custom production lane writes a title, source label, or other provenance
    field that belongs to a different lane because shared defaults are stamped
    after the lane has made its own authoritative decision.
  cause: |
    Metadata ownership was implicit and a generic post-processing path
    overwrote a content-owned field instead of respecting the producing lane's
    explicit receipt.
  fix: |
    Assign one authoritative producer for each provenance field. Stamp the
    producer's receipt at the ownership boundary, preserve it through shared
    orchestration, and validate that published metadata agrees with the
    accepted artifact and selected source bank.
  verify: |
    Run two custom lanes with distinct title/source receipts through shared
    orchestration. Assert each published ledger preserves its own authoritative
    values and a conflicting generic default is rejected or ignored.
  tags: [metadata, provenance, ownership, ledger, source-bank, publication]
  legacy_id: PBUG-20260712-05

- id: "12.50"
  phase: 12
  area: test-orchestration
  symptom: |
    A detached smoke supervisor reports failure from a blank child exit code
    even though the canonical runner emitted explicit success and the required
    published asset and ledger exist.
  cause: |
    The supervisor treated an unavailable process-property read as a terminal
    failure without reconciling the runner's authoritative completion record.
  fix: |
    Define an ordered terminal-evidence contract: a real nonzero child exit or
    missing canonical success remains failure; a blank exit code may be treated
    as success only when the authoritative runner result and required durable
    output checks both pass. Record the reconciled verdict and evidence.
  verify: |
    Exercise a detached successful run whose child exit property is blank and
    assert the supervisor records PASS only with canonical success plus output
    checks. Repeat without the success marker or required asset and assert it
    remains a failure.
  tags: [test-orchestration, detached-process, exit-code, false-negative, durable-output, smoke-test]
  legacy_id: PBUG-20260712-16

- id: "11.46"
  phase: 11
  area: llm-output
  symptom: |
    A source-evidence row quotes text that exists in the payload but names the
    wrong source field or stale offsets, or it quotes a claim that does not
    exist literally in any allowed source field.
  cause: |
    Evidence validation checked a model-supplied field/offset tuple without a
    deterministic, fail-closed reconciliation against the actual source
    payload, allowing stale metadata and unsupported claims to share a repair
    path.
  fix: |
    Rehome an exact quote only when exactly one allowed source field contains
    it, then recompute offsets from that field. Retain only rows whose evidence
    is literal; drop unsupported facts during metadata-only repair, and fail
    closed for absent or ambiguous evidence. Never rewrite claim prose to make
    it appear supported.
  verify: |
    Test a unique exact quote with the wrong field and offsets, an exact quote
    found in multiple fields, and a paraphrased/unsupported claim. Assert only
    the unique literal quote is rehomed and reindexed; ambiguous or unsupported
    evidence cannot reach the accepted artifact.
  tags: [llm-output, source-evidence, field-provenance, offset-repair, literal-grounding, fail-closed, xref-11.37, llm]
  legacy_id: PBUG-20260711-04

- id: "11.47"
  phase: 11
  area: llm-output
  symptom: |
    A response begins with a malformed structured artifact containing a valid
    nested object, and a fallback parser promotes that child to the top level,
    hiding the outer corruption and producing misleading downstream errors.
  cause: |
    Best-effort brace scanning did not distinguish leading prose before one
    valid object from a malformed attempted root object containing descendants.
  fix: |
    Treat an invalid leading root object as a parse failure. Permit extraction
    only when leading non-JSON prose clearly precedes one complete top-level
    object; never salvage a nested child from a broken outer response.
  verify: |
    Feed malformed outer JSON containing a valid nested child and assert a
    top-level parse failure. Feed leading prose followed by one valid root
    object and assert normal parsing still succeeds.
  tags: [llm-output, json-parser, root-integrity, nested-object, parse-failure, fail-closed, json-parse, llm]
  legacy_id: PBUG-20260711-05

- id: "11.48"
  phase: 11
  area: llm-output
  symptom: |
    A structured artifact or its typed repair preserves top-level shape but
    omits nested required fields, violates cross-object locks, repeats legacy
    metadata enums, or leaves derived structural metadata inconsistent with an
    already accepted upstream graph.
  cause: |
    The repair prompt lacked a complete machine-derived field tree, the failed
    artifact/error context, or the authoritative upstream mappings needed to
    preserve graph-owned metadata. The model was asked to recreate mechanical
    structure it did not own.
  fix: |
    Generate required-path instructions from the current schema and include
    the failed artifact, exact error, preservation rules, and accepted
    cross-object mappings in typed repair. Derive eligible mechanical metadata
    deterministically from the accepted graph; never alter authored prose, and
    reject missing, ambiguous, or graph-inconsistent mappings.
  verify: |
    Force a nested required-field omission, a missing cast-locked speaker, a
    missing boundary, and a legacy metadata enum. Assert the repair contract
    names the complete required paths and authoritative mappings; deterministic
    metadata repair changes only owned fields and fails closed for bad graphs.
  tags: [llm-output, nested-schema, typed-repair, graph-metadata, deterministic-repair, preservation, llm]
  legacy_id: PBUG-20260711-06

- id: "11.49"
  phase: 11
  area: source-selection
  symptom: |
    A canonical source selector returns a thin or low-diversity payload that
    cannot meet the downstream lane's source contract, wasting a model slot or
    halting after queueing work.
  cause: |
    Candidate ranking optimized for topic match without enforcing the same
    minimum body-length, word-count, and lexical-diversity floor required by
    the selected creative lane.
  fix: |
    Apply the lane's source-sufficiency contract during candidate selection.
    Inspect a bounded candidate set, select only an eligible payload, and fail
    before queueing the lane with a precise selection reason when none qualify.
  verify: |
    Supply a ranked candidate list containing thin and eligible bodies. Assert
    selection skips thin candidates, returns an eligible source with its
    receipt, and fails before model dispatch when every candidate is below the
    declared floor.
  tags: [source-selection, source-sufficiency, precondition, rss, fail-before-spend, payload-quality]
  legacy_id: PBUG-20260711-11

- id: "11.50"
  phase: 11
  area: llm-output
  symptom: |
    A whole-artifact pass or its typed repair reserves output tokens from a
    word target or fixed ceiling alone, truncates its own schema-bearing prompt
    or serialized response, and may echo the request envelope instead of
    returning the requested artifact root. A source-evidence artifact with
    unbounded rows, per-row spans, or serialized strings has no defensible
    fixed reservation even when its top-level list count looks bounded.
    The same failure occurs when a nested whole-score artifact leaves scenes,
    shots, beats, line IDs, or authored prose unbounded: a low word target does
    not bound serialized planning metadata.
    A generic string clamp can also shorten a literal provenance quote at a word
    boundary while retaining its old coordinate end, creating a synthetic
    source-span mismatch that a raw metadata repair cannot parse if the quote
    still exceeds the finite schema cap.
  cause: |
    Budgeting ignored accepted line/item count, required per-item metadata, the
    failed-artifact repair context, or the fact that the model-facing schema
    itself had no finite serialized surface. The root contract also failed to
    forbid input-envelope keys or a known scalar-vs-array repair shape explicitly.
    A generic over-length-string clamp can further hide an authored-artifact
    overflow by silently changing prose instead of advancing the repair ladder.
    The same compatibility clamp is unsafe at a source-grounded P0 boundary:
    quote text is deterministic metadata, but claims and tone remain authored
    content, so one generic coercion cannot safely handle both classes.
  fix: |
    Bound the model-facing artifact surface first: rows, nested evidence spans,
    and every material serialized string/item length. Then calculate output
    reservation from every remaining structural size driver, including accepted
    line or item count, after the authoritative graph is final. Keep typed
    repair context to the failed artifact plus only the locked facts the model
    cannot derive; do not duplicate a copyable JSON request envelope. Record
    the budget and surface receipt, require the requested root literal at
    response start, explicitly require scalar fields that the model previously
    returned as arrays, forbid request-envelope keys, and fail loud when prompt
    plus output cannot fit the actual context window. That refusal is the
    PRE-CALL capacity phase and it is correctly terminal, because the arithmetic
    that produced it is deterministic. Do not generalize it into "every capacity
    failure is terminal": a call that RAN and used its whole output allowance is
    a different phase and must advance the retry ladder (see 12.68).
    For a directly emitted nested score, local maxima are sufficient when they make every global
    scene/shot/beat/line bound finite; do not introduce a second draft/compiler
    representation merely to obtain those bounds. If a live model still
    exhausts a bounded direct score because it must re-emit deterministic graph
    mechanics (IDs, parents, order, anchors, or copied advisory state), a
    compact authoring draft plus compiler is permitted only when Python can
    derive every omitted field uniquely from accepted artifacts, the compiler
    returns the same strict final contract, and no dialogue or story decision
    moves from the model to Python. Disable generic string clamping at authored-
    artifact boundaries so over-limit prose reaches typed repair or fails closed.
  verify: |
    At fixed word steer, increase accepted graph width and assert either the
    reservation rises or the finite schema rejects the over-limit surface. For
    a source-evidence artifact, reject an over-limit row/span/string surface
    before the call. For a nested score, reject over-limit local collections,
    IDs, and prose, then measure a representative maximum base and repair
    prompt against the real tokenizer/context reservation. When a compact
    draft/compiler boundary is necessary, assert compiler rejection of unknown
    references/unused topology, `compile(project(final))` structural fidelity,
    and actual-tokenizer fit for base, restart, semantic repair, rewrite, and
    rewrite repair. Assert authored over-length prose is not silently clamped,
    the repair payload is not a copyable JSON request envelope or a duplicate
    accepted artifact, the effective prompt retains every required schema path
    and scalar-field instruction, envelope-root output is rejected, and an
    insufficient context cap fails before generation rather than silently
    truncating.
    For an exact literal source quote that alone exceeds a finite span cap,
    repair from the raw reply only after proving the complete quote occurs in one
    legal source field under the normal ambiguity rules. Reindex it, replace only
    the quote with that coordinate's exact bounded source prefix, and recompute
    the end. Disable generic string clamping for source-grounded P0 calls; never
    use this exception to shorten a claim, tone, or nonliteral/ambiguous text.
  tags: [llm-output, token-budget, context-window, structured-output, envelope-echo, fail-loud, xref-11.30, llm]
  legacy_id: PBUG-20260711-12

- id: "12.51"
  phase: 12
  area: metadata-provenance
  symptom: |
    A content-owned lane reaches a downstream TTS, credits, or cast stage with
    a missing producer receipt, or a generic receipt is written into a key that
    actually asserts a stronger behavior contract and triggers an invalid
    replay path.
  cause: |
    Shared orchestration assumed legacy producers owned delivery and seed
    metadata. A field whose name looked like a generic receipt also doubled as
    proof that a specific producer had created replayable state.
  fix: |
    Stamp required receipts at the one shared producer boundary after the last
    authoritative content mutation and before finalization. Assign one precise
    semantic purpose to each key: use a generic episode receipt for provenance,
    and reserve replay keys exclusively for the producer that can substantiate
    replayable state. Preserve lane-owned cast values while still running their
    safety invariants.
  verify: |
    Run a content-owned lane through delivery, credits, and cast stages. Assert
    delivery and episode receipts exist before finalization, no replay-only key
    is fabricated, lane-owned voices are not replayed, and duplicate or invalid
    lane-owned voices still fail their safety gate.
  tags: [metadata, producer-boundary, receipts, cast-replay, content-owned, provenance, xref-12.49]
  legacy_id: PBUG-20260711-14

- id: "07.22"
  phase: 7
  area: vram
  symptom: |
    An audio-conditioned video run avoids an OOM but slows from seconds to
    minutes per iteration as sampler activations spill to system memory on a
    desktop-VRAM-tight machine.
  cause: |
    A large VAE graph object was shared by both pre-sampler encode and
    post-sampler decode, so last-consumer lifetime kept it resident through
    denoising. Model loading also had no scoped activation reserve for desktop
    applications already occupying VRAM.
  fix: |
    Split encode-side and decode-side heavy graph resources when their lifetimes
    do not overlap, and apply a scoped minimum VRAM reserve for the model run.
    Restore the prior reserve on both success and exception; never lower an
    existing stricter reserve. Diagnose slow no-OOM behavior from real telemetry
    before changing quantization or offload policy.
  verify: |
    Assert the graph has distinct encode and decode VAE nodes with correct
    wiring. With a fake model manager, assert the scoped reserve rises during
    execution, restores after success and failure, and preserves a larger
    pre-existing reserve. GPU soak telemetry must confirm no sysmem-spill crawl.
  tags: [vram, activation-reserve, video-vae, sysmem-spill, scoped-resource, gpu-soak, xref-07.16]
  legacy_id: BUG-LOCAL-414

- id: "08.08"
  phase: 8
  area: io
  symptom: |
    A final post-composition render publishes successfully but silently loses
    captions, scopes, or rolling-credit tail frames because an optional ffmpeg
    filter branch is malformed or a shortest-input rule truncates the intended
    long-form output.
  cause: |
    The successful-output path was treated as proof of visual completeness.
    A concatenated filter duplicated a pixel-format token without its separator,
    triggering a source-copy fallback, and a separate shortest-input policy
    discarded the deliberately longer credits layer.
  fix: |
    Treat every enabled filter combination and post-roll duration as a concrete
    output contract. Build filter tokens with explicit separators, test each
    optional branch, and preserve the intentional longest timeline rather than
    letting an intermediate stream clamp it. Verify required visual layers in
    the produced command/output, not only process exit success.
  verify: |
    Generate the three-input filter command with each overlay state and assert
    no concatenated format token, exactly the expected format pins, and caption
    burn presence. Exercise a longer credits/scopes layer and assert the command
    does not use a shortest-input clamp that cuts the tail.
  tags: [io, ffmpeg, filter-complex, post-processing, captions, rolling-credits]
  legacy_id: BUG-LOCAL-402

- id: "12.52"
  phase: 12
  area: test-orchestration
  symptom: |
    A crashed or interrupted harness leaves a file-based one-shot environment
    override behind, and a later unrelated headless run silently inherits it,
    executing an auditable profile with the wrong engine or policy.
  cause: |
    A temporary per-leg hook was sourced whenever present but its lifecycle
    depended on a normal post-leg cleanup that does not run after a crash.
  fix: |
    Treat file-based overrides as consume-once capabilities: log their use,
    apply them only to the intended boot, and remove stale hooks before a
    canonical run. Each producer must recreate its hook explicitly for a new
    leg; do not allow an old override to become an invisible process default.
  verify: |
    Seed a stale override hook, start the canonical headless wrapper, and assert
    it removes the hook before boot. Verify the next run's engine/profile receipt
    matches its explicit configuration rather than the orphaned override.
  tags: [test-orchestration, environment-leak, headless-boot, consume-once, stale-hook, provenance, xref-12.47]
  legacy_id: BUG-LOCAL-415

- id: "07.23"
  phase: 7
  area: video-policy
  symptom: |
    A render plan selects only procedural or audio/text-driven video engines
    that do not consume an init image, but an upstream prompt or image-authoring
    stage still calls a costly or fallible image model. The run can spend or
    fail even though no downstream consumer can use the result.
  cause: |
    Still-consumption capability was checked only at the terminal dispatcher.
    Upstream planning treated the presence of an image policy as a request to
    author every role, rather than resolving each role's effective engine
    (including overrides and redirects) and its declared init-image capability.
  fix: |
    Centralize a per-role effective-engine init-image-consumer decision. When a
    complete all-false map proves no role consumes stills, emit an explicit
    empty prompt payload and bypass all upstream visual authoring. In mixed
    policies omit only roles proven procedural and retain unknown roles
    conservatively upstream. Treat an absent, malformed, or unresolvable role
    as unable to prove that role's consumer: the terminal dispatcher must refuse
    generation for that object while still allowing other proven roles to render.
    Re-check the capability at dispatch as defense in depth.
  verify: |
    Cover all-procedural zero writer/model calls, mixed-role filtering,
    force-map and redirect resolution, and fail-safe behavior for
    incomplete/unknown policy. A canonical all-visualizer run emits no image
    objects and completes with its expected ledger and final output.
  tags: [video-policy, image-generation, init-image, capability-gate, all-visualizer, effective-engine, force-map, fail-safe, upstream-bypass, prompt-authoring]
  legacy_id: PBUG-20260712-19

- id: "12.53"
  phase: 12
  area: remote-llm-capability
  symptom: |
    A saved remote LLM works in earlier smoke legs but a later call fails with
    HTTP 400 before generation because a process-wide parameter disables a
    capability that the selected endpoint now marks mandatory.
  cause: |
    The client treats one global reasoning/tool/format preference as valid for
    every model and discards per-model capability metadata from its cached
    catalog. A stale or cold cache then has no way to prevent an incompatible
    request or learn from the provider's precise capability rejection.
  fix: |
    Preserve the provider's per-model capability contract in the explicit
    catalog cache and resolve global preferences against the selected model at
    call time. A mandatory capability overrides only the incompatible value for
    that model, using the least enabled supported setting. For a stale/cold
    cache, recognize only the provider's exact capability-specific 400, retry
    the same model once with a compatible setting, and remember that capability
    for subsequent calls in the process. Do not turn generic 400s into retries,
    substitute another model, or consume the transient retry budget.
  verify: |
    Cache a model with a mandatory capability and assert an incompatible global
    setting is replaced before the first request while ordinary models retain
    it. With an empty/stale cache and zero transient retries, return the exact
    mandatory-capability 400, assert one same-model corrected call succeeds,
    and assert the next call starts compatible. A different 400 must still fail
    immediately. Refresh the live catalog and verify the selected model's
    mandatory flag is retained.
  tags: [remote-llm, capability-negotiation, reasoning, catalog-cache, stale-cache, http-400, same-model-retry, fail-closed]
  legacy_id: PBUG-20260713-01

- id: "11.51"
  phase: 11
  area: llm-output-validation
  symptom: |
    Source-grounded dialogue containing a legitimate acronym is rejected as
    all-caps shouting. A repair can move the same acronym between lines without
    satisfying the validator, exhausting the authored-artifact ladder.
  cause: |
    Lexical hygiene applies a blanket uppercase-token ban without consulting
    the accepted evidence boundary, so grounded acronyms and ungrounded shouted
    words are indistinguishable.
  fix: |
    Derive an exact immutable allowlist of uppercase lexical tokens only from
    already accepted literal source spans and pass it through every script
    validation boundary. Permit only exact grounded tokens; reject any other
    all-caps lexical word. Do not lowercase, clip, or rewrite authored dialogue
    in deterministic code.
  verify: |
    Build accepted evidence containing one acronym, use it successfully in
    dialogue, and reject an ungrounded all-caps word in the same line. Assert
    that base, retake, audit-rewrite, and final validators all receive the same
    evidence-derived allowlist.
  tags: [llm-output, validation, source-grounding, acronyms, spoken-text, repair-ladder, fail-closed]
  legacy_id: PBUG-20260713-07

- id: "11.52"
  phase: 11
  area: llm-output-validation
  symptom: |
    A character-name repair removes a digit or other visible defect but still
    fails because a legitimate short acronym inside the otherwise canonical
    name is rejected by an unstated validator rule.
  cause: |
    The validator equates canonical names with Title-Case tokens only, while the
    repair prompt describes the contract less precisely. Acronym-bearing role
    names, unstructured uppercase labels, and numeric identifiers are therefore
    not distinguished at the authoring boundary.
  fix: |
    Define one bounded shared grammar for validation and repair instructions:
    require at least one normal Title-Case word, permit at most one short 2-3
    letter acronym token, and reject digits, lowercase labels, empty tokens,
    multiple acronyms, and all-uppercase full labels. Keep the name authored;
    deterministic code validates but does not rewrite it.
  verify: |
    Accept an acronym plus Title-Case role name and an ordinary titled personal
    name. Reject digit-bearing, lowercase, and all-uppercase label forms. Drive
    an invalid base artifact through one authored repair and assert the repair
    sees the same exact acronym-aware grammar enforced by the validator.
  tags: [llm-output, validation, cast-name, acronym, title-case, typed-repair, fail-closed]
  legacy_id: PBUG-20260713-09

- id: "11.53"
  phase: 11
  area: llm-output-validation
  symptom: |
    P5 rejects a legitimate short all-caps term that is explicitly part of an
    accepted cast role, even though source-grounded acronyms remain allowed.
  cause: |
    The validator receives only the source-span acronym allowlist at the P5,
    P7, P9, and final direct validation boundaries. Cast role metadata is an
    accepted contract but was not carried into that shared allowlist, and the
    acronym extractor could match uppercase substrings without token bounds.
  fix: |
    Use one helper that unions source-span acronyms with complete 2-3-letter
    acronym tokens from accepted cast.role_in_conflict values. Use it in every
    script validation path, including fact_index=None, and enforce explicit
    alphanumeric lookarounds on both acronym regexes. Do not mine free-form
    prose or rewrite dialogue.
  verify: |
    Build a cast whose role contains CEO and STOP, assert only CEO is admitted,
    reject an unlisted RUN token, and assert the helper is wired through both
    post-validation and final direct calls. Reproduce the dated canonical smoke
    that failed at P5, then require RESULT SUCCESS, obs_publish OK, and a
    canonical episode/OBS asset.
  tags: [llm-output, validation, spoken-text, cast-role, acronyms, boundaries, repair-ladder, fail-closed]
  legacy_id: PBUG-20260713-10

- id: "11.54"
  phase: 11
  area: llm-output-validation
  symptom: |
    A reasoning model repeats an overlong P1 question or consequence during its
    typed repair, exhausting the repair ladder before downstream passes.
  cause: |
    Length instructions alone do not guarantee that a model will rewrite a
    rejected authored field; the schema rejects the repeated value again.
  fix: |
    When question or consequence exceeds its cap, parse the complete object and
    apply a minimal word-boundary shortening deterministically. Preserve the
    existing semantic repair turn for ending-only overflow and fail closed on
    malformed roots.
  verify: |
    Feed an overlong P1 object and assert all three fields validate within caps,
    the shortened text ends on a word boundary, and ending-only overflow still
    reaches the model-facing repair contract. Prove the canonical 120-word smoke
    reaches P5 and publishes its OBS artifact.
  tags: [llm-output, validation, p1, bounded-repair, word-boundary, fail-closed]
  legacy_id: PBUG-20260713-10

- id: "02.16"
  phase: 2
  area: transformers
  symptom: |
    A locally cached model is selectable but fails before loading with an
    unrecognized model_type or architecture error. Alternatively, the loader
    selects the newest snapshot directory and reports missing weights or tries
    the network even though an older local revision contains the complete
    checkpoint. Remapping the checkpoint to an older model class may load but
    emit degenerate text or invalid structured output.
  cause: |
    Catalog admission checked model identity, cache presence, and VRAM fit but
    not whether the installed Transformers release natively supports the
    checkpoint architecture. The cache resolver also assumed the newest local
    revision was complete, while Hugging Face caches may split a complete
    weighted revision from a newer metadata-only revision.
  fix: |
    Declare the minimum Transformers release that natively supports the
    architecture and capability-gate it before cache, download, or model-load
    work. Resolve the newest complete weighted snapshot by requiring a model
    weight file or weight index. Resolve optional local metadata such as
    chat_template.jinja independently when it exists only in another revision,
    but never treat a metadata-only snapshot as the model root. Load tokenizer,
    config, and model with local_files_only=True. Do not remap model_type to a
    predecessor architecture or silently substitute a network, Ollama,
    llama.cpp, or sidecar lane. Admit the catalog row only after a real loader
    smoke proves coherent text and schema-constrained parseable JSON.
  verify: |
    Unit-test that an unsupported Transformers version fails actionably before
    download; a newer metadata-only revision is rejected as the model root; an
    older weighted revision is selected; newer local chat-template metadata is
    composed without HTTP; and a complete cache never calls snapshot_download.
    Then run the actual quantized model on the target GPU and require the
    official model class, coherent prose, expected VRAM, and LM-format-enforced
    JSON that validates against the requested schema, with no external server.
  tags: [transformers, huggingface, model-architecture, catalog-admission, offline, split-revision, weighted-snapshot, local-files-only, structured-json, llm, xphase-11]
  legacy_id: BUG-LOCAL-306

- id: "11.55"
  phase: 11
  area: llm
  symptom: |
    A schema-constrained local LLM begins a valid JSON object but is cut off at
    the same nested-object prefix on every retry. LM Format Enforcer logs an
    internal parser exception such as `AttributeError: 'bool' object has no
    attribute 'anyOf'`; downstream parsing then misleadingly reports a
    character-zero JSONDecodeError because no complete top-level object exists.
  cause: |
    A model field such as `list[dict[str, Any]]` compiled to an open JSON Schema
    object with boolean `additionalProperties: true`. The installed grammar
    compiler accepted the schema initially but treated that boolean wildcard as
    a schema object only when generation reached the first arbitrary key, then
    terminated enforcement mid-object.
  fix: |
    Replace open-ended structured-output dictionaries with explicit, closed,
    typed models that express the real output contract. Inspect every schema
    bound to constrained generation for boolean wildcard subschemas. Do not
    disable the prefix constraint or fall back to unconstrained sampling: make
    the schema grammar-compatible while preserving downstream validation.
  verify: |
    Generate the exact production Pydantic schema and assert the formerly open
    object has named required properties and `additionalProperties: false`.
    Feed a complete representative artifact through the installed
    JsonSchemaParser one character at a time, require every character to be
    allowed, and require `can_end()` at completion. Then run the real local
    workflow through the affected pass and confirm it publishes successfully.
  tags: [llm, structured-json, lm-format-enforcer, json-schema, pydantic, grammar, hard-constraint, local-model, fail-closed]
  legacy_id: PBUG-20260720-02

- id: "11.56"
  phase: 11
  area: llm-output-validation
  symptom: |
    One voiced line repeatedly fails a non-safety craft or delivery-hygiene
    gate. Retry exhaustion terminates the complete artifact or workflow, so no
    frozen ledger or downstream audio/video is produced even though the line
    can be made non-empty and speakable.
  cause: |
    Quality-budget exhaustion is given the same liveness disposition as a
    structurally invalid graph, and validation may inspect authored text instead
    of the exact speech-adapter projection. A bounded LLM retry has no total
    deterministic final rung, so model noncompliance controls workflow liveness.
    A mixed structural/craft post-validator can also send one dirty line through
    a full-artifact typed repair, exposing the complete JSON document to output
    truncation. A raw word-count floor can then manufacture a punctuated fragment
    instead of a grammatical utterance.
  fix: |
    Classify defects before disposition. For craft/quality only, run the
    ordinary authored repair, a lower-temperature gate-specific repair, an
    alternate writer slot, then an idempotent deterministic SFW spoken-surface
    floor. Validate the exact delivery projection, stamp the gate and resolving
    rung, and continue freeze/readiness. If the floor yields empty text, isolate
    only that row. Keep content safety and genuinely ambiguous structural
    contracts fail-closed. Intercept a schema/graph/roster-valid craft rejection
    before any whole-artifact repair and patch only named line IDs. Give action-
    narration detectors the locked speaker name, and shorten long dialogue only
    at complete sentence boundaries (or use a clean deterministic utterance).
  verify: |
    Force every craft detector and whole-line stage cue to survive all model
    rungs, then require a non-empty clean deterministic result, an exact
    gate/rung receipt, and normal freeze/readiness. Cover every runnable
    producer, including content-owned lanes whose delivery normalization changes
    the spoken surface. Assert quality exhaustion is absent from the terminal
    verdict set, a true empty row is isolated locally, and the SFW gate still
    refuses an unsafe episode. Prove a craft-only structured artifact invokes no
    second whole-artifact generation, while a structural-plus-craft artifact
    remains fail-closed. Cover own-name action narration and require one-breath
    floors to retain only complete sentences. Complete a real canonical run
    through publication.
  tags: [llm-output, spoken-text, quality-gate, repair-ladder, deterministic-floor, delivery-projection, observability, workflow-liveness, row-local-failure, sfw, fail-closed, xref-11-54]
  legacy_id: PBUG-20260720-03
- id: "05.11"
  phase: 5
  area: state-sync
  symptom: |
    A repair or reroll writes meaningful text into a previously skipped row,
    but the stale skip flag remains. The deterministic readiness audit then
    rejects the ledger because the row simultaneously says "omit this line"
    and carries authored text.
  cause: |
    The write seam updated only the partner field and derived counts. Paired
    state was treated as independent metadata, so a replacement text mutation
    did not clear the editorial skip state created for the prior empty text.
  fix: |
    The mutator that writes meaningful replacement text must clear the paired
    skip metadata (`skip` and its skip reasons) in the same mutation. Preserve
    skip state when the replacement remains empty or whitespace. Keep the
    deterministic validator fail-closed; do not hide the inconsistent state
    with a tolerance or bypass.
  verify: |
    Unit-test both transitions: meaningful replacement clears skip metadata,
    while empty replacement preserves it. Then run the real canonical repair
    or reroll path and require its deterministic readiness audit to pass,
    RESULT SUCCESS, obs_publish OK, and a non-zero final asset.
  tags: [state-sync, paired-state, mutation-seam, reroll, skip-state, ledger, fail-closed]
  legacy_id: PBUG-20260713-19

- id: "12.54"
  phase: 12
  area: metadata-provenance
  symptom: |
    A dynamically selected source renders successfully, but the final ledger
    has a blank or stale source reference because it records the optional
    request coordinate rather than the item the fetcher actually selected.
  cause: |
    The fetch boundary returns content without a typed provenance sidecar, and
    shared orchestration treats a request parameter as resolved-source truth.
    A blank or ignored request cannot identify a feed item chosen at runtime.
  fix: |
    Let the resolver/fetcher own selected-source identity. Preserve the content
    payload contract, return resolved URL/label/date metadata beside it, and
    derive the canonical ledger reference in owner order: selected sidecar,
    selected payload link, then request only as a last resort. Retain a
    differing request separately and keep unknown rights explicitly unknown;
    never infer a license from successful retrieval.
  verify: |
    Make a dynamic fetcher select an item different from the supplied request.
    Assert every canonical source field names the selected item, the request is
    retained only as request provenance, and no license/commercial claim is
    invented. Keep manifest-resolved and legacy raw-payload paths compatible.
  tags: [metadata, provenance, source-selection, resolved-identity, rss, ledger, rights, xref-12.49]
  legacy_id: PBUG-20260721-01

- id: "12.55"
  phase: 12
  area: asset-identity
  symptom: |
    A frozen master asset exists and downstream work succeeds, but caches and
    the final ledger have no durable full-byte identity. Replacing bytes at the
    same path can therefore reuse stale derived artifacts.
  cause: |
    The authoritative producer records only a partial diagnostic hash or path,
    while consumers expect a full content digest that no owner stamps. A later
    generic ledger save can also drop the producer-owned identity section.
  fix: |
    After the producer closes/finalizes the asset, compute a streaming full-file
    digest and stamp it at the producer boundary. Preserve that owned section
    through every merge, bind derived-cache keys to the digest, and let the
    terminal publisher record the re-resolved final asset path. A digest-receipt
    failure may degrade loudly when the asset remains usable; do not erase the
    good asset or fabricate identity.
  verify: |
    Hash a closed asset over multiple chunks, survive a later generic ledger
    merge, and assert a byte change at the same path changes every derived cache
    key. Require the final pointer to exist. Simulate digest failure and assert
    the usable asset path remains intact while the missing receipt is visible.
  tags: [asset-identity, sha256, cache-invalidation, producer-boundary, ledger-merge, streaming-io, final-path]
  legacy_id: PBUG-20260721-02

- id: "12.56"
  phase: 12
  area: terminal-path-ownership
  symptom: |
    Publication succeeds and the exact final asset exists, but a later ledger
    save replaces one official path surface with a planned shorter filename
    that does not exist. Consumers see conflicting terminal pointers.
  cause: |
    A generic metadata rebuilder treats a pre-publication naming plan as more
    authoritative than the terminal publisher's observed path, or downstream
    code reconstructs identity from an open-ended filename suffix grammar.
  fix: |
    The terminal publisher owns exact final paths. At the shared owner layer,
    accept a published path only when it exists, belongs to the current artifact
    identity, has the expected type, and is inside an authorized output root;
    then synchronize every official alias in one save. Before publication keep
    a plan explicitly nonterminal. Downstream enrichments must consume ledger
    directory authority rather than reverse-engineer identity from suffixes.
  verify: |
    Publish an enriched filename and require all terminal path surfaces to name
    existing assets after repeated saves. Reject missing, wrong-identity,
    wrong-extension, and out-of-root candidates. Add an unknown future suffix
    and prove the artifact remains inside the ledger-owned directory.
  tags: [terminal-path, publication, ledger, path-validation, alias-sync, output-root, artifact-authority]
  legacy_id: PBUG-20260721-03

- id: "12.57"
  phase: 12
  area: cross-boundary-state-sync
  symptom: |
    A producer finalizes and hashes an asset in the durable ledger, but a
    downstream wire consumer receives an older pre-production ledger snapshot.
    Rendering can still succeed while cache identity, gates, or transition
    receipts are silently absent.
  cause: |
    The graph join copies only selected row-local fields, skips the join when
    any early timing hint is already populated, or discovers durable state by
    newest mtime without proving artifact identity. Correct execution ordering
    alone cannot synchronize two independently evolving ledger representations.
  fix: |
    At the first dependency-gated consumer, resolve the active durable owner and
    prove same-run identity with an immutable receipt that survives legitimate
    renames; fall back only to exact non-empty artifact identity for older
    records. Reject mismatches loudly. Copy complete producer-owned sections
    even over stale wire values, while retaining missing-only semantics for
    writer-owned metadata and row fields. Preserve the merged object through
    every later serialization boundary.
  verify: |
    Give the join a pre-production wire snapshot with populated timing and a
    renamed durable record sharing the immutable run receipt. Require the full
    producer hash and owned sections to replace stale wire state and survive the
    next consumer's JSON serialization. Change the receipt to a sibling run and
    require every candidate field to be rejected unchanged with a loud warning.
  tags: [state-sync, ledger, producer-ownership, immutable-identity, rename, cache-key, serialization, fail-loud]
  legacy_id: PBUG-20260721-04

- id: "12.58"
  phase: 12
  area: hierarchical-identity
  symptom: |
    Splitting one authored dialogue unit creates renderable child rows, but the
    final ledger reports that every child references a beat absent from the
    accepted outline. Parent collections may also remain empty or retain stale
    membership after cut, merge, and split operations.
  cause: |
    A structural editor collapses two namespaces: unique mutable line identity
    and stable accepted beat identity. It mints the same synthetic suffix in
    both fields, while the producer never materializes or resynchronizes the
    durable parent-to-child collection.
  fix: |
    Mint a unique line id for each structural child while retaining the exact
    accepted parent beat id. Materialize the accepted beat collection at the
    producer boundary, then rebuild only each retained beat's line membership
    after structural edits. Keep an accepted but fully cut beat with an empty
    child list. Allocate child suffixes against the complete current line-id
    namespace so repeated repair passes cannot collide. Downstream
    render/caching identity must remain keyed by the unique line id so siblings
    sharing a parent never collapse.
  verify: |
    Split one accepted line and cut another. Assert unique child line ids share
    the first accepted beat id, the cut beat remains with an empty line list,
    the outline-to-ledger consistency guard is clean, and line-keyed consumers
    still receive distinct identities. Split the parent again and require a new
    collision-free child id. Initialize from an outline and require parent
    membership to exist before later timing stages.
  tags: [ledger, hierarchy, line-id, beat-id, structural-edit, parent-child, referential-integrity, render-identity]
  legacy_id: PBUG-20260721-05

- id: "12.59"
  phase: 12
  area: budget-authority
  symptom: |
    A short story already inside its requested word band is rewritten toward a
    larger legacy default, or a plan passes because an LLM claims an in-range
    projection even though applying its edits produces an out-of-range result.
    A row-local quality repair may also be blocked by advisory episode drift.
  cause: |
    A downstream editor hard-codes a historical target, counts a different
    surface than the producer receipt, trusts model arithmetic instead of the
    deterministic edit result, and reuses a global length gate for local craft
    repair.
  fix: |
    Treat a valid producer-stamped target and ratio band as the single live
    authority; use a historical fallback only when the receipt is absent, and
    skip mutation loudly when a present receipt is malformed. Count the exact
    receipt-owned surface, but retain safety caps on every spoken row. Validate
    a plan by applying it to a deep copy and recounting the actual result while
    preserving the model projection as forensic evidence. Disable only the
    advisory global band check for scoped local repair.
  verify: |
    Build a requested short episode whose character body is in band while
    announcer overhead raises the all-spoken total, and require normalization
    to skip. Still trigger on an over-cap announcer row. Accept a good simulated
    result despite a false projection, reject a bad result despite a good
    projection, permit scoped repair during advisory drift, and prove a
    malformed present receipt calls no model and mutates nothing.
  tags: [ledger, word-budget, authority, llm-validation, deterministic-simulation, advisory-drift, scoped-repair, fail-soft]
  legacy_id: PBUG-20260721-06

- id: "12.60"
  phase: 12
  area: assembled-surface-validation
  symptom: |
    A generated fragment passes its local spoken-quality gate, but the exact
    row delivered to speech fails after a protected deterministic suffix is
    appended. Failure telemetry may report a count without identifying the
    row or defect.
  cause: |
    The authoring or repair seam validates only the model-owned fragment and
    treats protected factual text as exempt from final-surface validation.
    Character truncation can also turn factual prose into a misleading
    fragment, while a receipt builder derives failures from the successful
    repair list instead of the failure records.
  fix: |
    Protect facts from model rewriting, not from validation. Assemble the exact
    final row, project it through the same deterministic normalization used by
    delivery, and run the authoritative spoken-row scorer on that complete
    surface. Preserve the full source fact in owned metadata; if speech must be
    shortened, select only an exact complete-sentence prefix or use a truthful
    pointer to a durable credits/source surface. Never character-cut factual
    prose. Guard content-owned pipelines inside the shared mutator itself, and
    carry explicit row-local failure records into phase receipts.
  verify: |
    Replay a protected suffix whose fragment is clean but assembled delivery is
    over the breath and anchor caps. Require the final spoken row to pass after
    delivery projection without exposing the fact to an LLM. Test
    multi-sentence, initials/version, and single-sentence facts and assert that
    only whole exact sentences or a truthful deferral are emitted. Prove
    content-owned direct calls are byte-identical and a forced row failure is
    present in the phase receipt.
  tags: [spoken-surface, protected-suffix, factual-integrity, delivery-projection, row-local-failure, credits, content-ownership, ledger]
  legacy_id: PBUG-20260721-07

- id: "12.61"
  phase: 12
  area: identity-classification
  symptom: |
    A generic cast role such as THE TRAVELER is rejected as a forbidden named
    character when an anonymous visual brief truthfully uses the role noun.
    An ordinary article from the cast label may also be anonymized as if it
    were a person. Repair repeats the same legitimate wording, exhausts, and
    leaves downstream brief metadata empty.
  cause: |
    One lexical splitter treats every component of every cast label as both an
    input-substitution alias and a forbidden output name. It does not classify
    generic roles separately from personal identities, and its broad public
    error code gives typed repair no exact offending surface.
  fix: |
    Classify labels once with a bounded shared role grammar, then derive two
    complementary projections. For generic roles, map the full input label and
    meaningful role noun to one stable identity while allowing those forms in
    output. For personal labels, protect the full surface and meaningful name
    components. Never promote articles, ordinals, or honorifics to standalone
    identities. Keep the public reason code stable, carry the exact matched
    surface privately into typed repair, and retain an observable failed
    sentinel plus deterministic non-authoring consumer defaults for genuine
    exhaustion.
  verify: |
    Replay THE TRAVELER with a brief containing traveler and require first-pass
    acceptance. Cover First Witch, article-bearing and multiword roles, plus
    Unicode, hyphenated, apostrophe, honorific-bearing, and representative
    all-bank personal names. Assert that ordinary the survives input
    substitution, role aliases retain one identity, real personal components
    remain forbidden, private repair identifies the exact surface while the
    public code remains stable, and genuine failure still yields a valid
    non-authoring downstream prompt.
  tags: [identity, cast, role-label, anonymization, story-brief, typed-repair, all-bank, ledger, fail-observable]
  legacy_id: PBUG-20260721-08

- id: "12.62"
  phase: 12
  area: quality-context-capacity
  symptom: |
    An advisory quality loop spends repeated long generations on the same
    unchanged valid story, but every requested replacement is guaranteed to
    truncate because prompt plus required output exceeds the model context.
    No ledger rows or assets are produced even though the pre-quality artifact
    was renderable.
  cause: |
    A row-local finding reuses a complete-artifact schema and retry ladder.
    Shared token fitting treats its requested output as a reducible ceiling,
    provider wrappers hide the capacity cause, and the caller restores the
    unchanged prior artifact before immediately rejudging it. Message-list
    normalization or provider output caps can also erase or defeat an ad hoc
    complete-output intention.
  fix: |
    Give bounded artifacts an explicit full-output-capacity marker, capture it
    before message normalization, and enforce it against both the real context
    window and provider output cap before any generation or network I/O.
    Replace whole-script quality retakes with typed line-text patches over a
    closed target set; merge only the owned field and run the full artifact
    validator. Rejudge every successful merge. After the creative and alternate
    writer slots both fail, keep the best already-valid artifact and stop the
    loop without rejudging unchanged input. Build hashes, seals, ledger state,
    and consumer pointers only after that final artifact is chosen.
  verify: |
    Reproduce prompt plus requested-output arithmetic that exceeds an 8K
    context and assert zero local/provider calls for a marked patch while an
    unmarked request still clamps. Cover every local and remote transport plus
    provider caps and pre-normalization marker capture. Assert exact target
    coverage, non-target immutability, full post-merge validation, alternate
    slot rotation, fresh judgment after success, and no repeated judgment after
    two failed patch slots.
  tags: [quality-loop, context-window, output-capacity, typed-patch, no-call-preflight, fail-soft, ledger-liveness, cross-backend]
  legacy_id: PBUG-20260721-09

- id: "12.63"
  phase: 12
  area: constrained-schema-compatibility
  symptom: |
    A compact structured repair fails before generation because the grammar
    enforcer rejects its JSON Schema. A later call through the same cached
    token constraint may fail with an apparently unrelated null allowed-token
    state, so every available model slot floors without authoring a patch.
  cause: |
    A regex-constrained string also declares redundant minimum or maximum
    length keywords even though the regex already fixes its exact shape. The
    grammar library does not support that combination and can cache an
    incomplete token-enforcer state when schema construction raises.
  fix: |
    Express one lexical invariant once. When an anchored regex fully determines
    the accepted string length, omit redundant min/max length keywords instead
    of catching formatter exceptions or rotating models. Audit every sibling
    patch schema that shares the row contract.
  verify: |
    Generate each production patch schema, assert the constrained field carries
    its exact regex without minLength/maxLength, and character-feed a complete
    valid JSON artifact through the real grammar parser to can_end(). Retain
    model validation tests for bad prefixes and wrong lengths.
  tags: [json-schema, grammar, lm-format-enforcer, typed-patch, cache-state, sibling-audit, pre-generation]
  legacy_id: PBUG-20260721-10

- id: "12.64"
  phase: 12
  area: zero-sentinel-semantics
  symptom: |
    A downstream consumer reports timing missing and invokes a heuristic even
    though the producer supplied a valid zero-second or zero-frame onset. The
    heuristic can then fabricate content in a window that does not exist.
  cause: |
    Presence and positivity are collapsed into one truthiness check. Zero is a
    valid boundary value, while None is the actual missing-state sentinel.
  fix: |
    Branch on explicit presence first. Treat every non-None onset as known,
    clamp its derived window to the legal nonnegative range, and reserve the
    missing-data fallback and warning for None. Preserve zero in receipts.
  verify: |
    Exercise positive, zero, and missing onsets. Positive timing creates the
    expected window; zero creates no positive window and no missing-data
    warning; None alone invokes the documented fallback. Include a corrupted
    negative input to prove clamping cannot create a reverse window.
  tags: [sentinel, zero, timing, truthiness, fallback, title-card, media-consumer]
  legacy_id: PBUG-20260721-12

- id: "12.65"
  phase: 12
  area: rendered-manifest-ledger-ownership
  symptom: |
    A media renderer produces valid cue assets and may even mix some into the
    final master, but the durable ledger has no rows, paths, placements,
    timeline positions, or downstream mirrors for them. An inline cue anchored
    to ordinary content may be silently dropped while bookends remain audible
    but invisible to later consumers.
  cause: |
    Producer families use different cue dialects, legacy producers emit only
    sentinel rows, and the rendered manifest is reconciled after the first
    timeline writer or not at all. Consumers key on a particular line role or
    cue ID instead of canonical placement and anchor semantics. The final wire
    join copies ordinary timing but omits the media array and its assembler-owned
    mirrors, so rendered truth dies on disk.
  fix: |
    Translate producer-local IDs at the durable boundary and give every cue a
    canonical placement plus anchor. Reconcile the rendered manifest into the
    ledger before timeline mutation: recompute authored cue identity, update
    only render-owned fields on a match, materialize deterministic legacy rows,
    and fail loudly on mismatch. Resolve insertion by anchor independently of
    line type, preserving ordinary content dispatch. Give one final assembler
    sole ownership of mirrors, and make the post-media wire join same-episode
    and identity-gated for both media rows and their mirrors.
  verify: |
    Exercise every producer dialect and a sentinel-only legacy producer.
    Require reconciliation to be idempotent, to reject a stale cue identity,
    and to materialize output paths before timing. Insert a cue before both a
    sentinel and an ordinary content row while proving the ordinary row still
    consumes its own media/voice input. Require the assembler to place and
    mirror opening, interstitial, and closing cues by placement. At the final
    wire join, append valid legacy rows and matched mirrors, but reject a
    changed cue and every mirror that refers to it.
  tags: [manifest, ledger, music, media, identity, ownership, timing, anchor, mirror, legacy-materialization, downstream-consumer]
  legacy_id: PBUG-20260721-13

- id: "12.66"
  phase: 12
  area: artifact-tree-rename-transaction
  symptom: |
    A pipeline renames a pending artifact directory to its final identity and
    the files move successfully, yet the durable ledger still points into the
    deleted source root. Producer-owned rows written only to disk can disappear
    on the next singleton save, and downstream wires may keep the retired id
    while rescuing assets from an unrelated newest sibling.
  cause: |
    Directory movement is treated as sufficient identity movement. Serialized
    absolute paths are not rebased, a keyed merge visits only rows already in
    memory, the post-rename join does not let same-receipt durable identity
    replace stale wire values, and recovery uses modification time instead of
    the active owner. A one-sided freeze receipt may also be mistaken for a
    legacy name-only match.
  fix: |
    Make rename one ordered, retryable transaction: move the tree, canonicalize
    the ledger name, recursively rebase only absolute string values contained
    by the old root on a path-component boundary, atomically persist durable
    truth, then advance in-memory identity. Keep external paths exact. Preserve
    disk-only producer rows only through a narrow immutable-receipt and parent-
    hash join with producer-specific validation; never copy arbitrary disk
    content. If either side has a freeze receipt, require both values to match.
    Gate post-rename consumers on rename completion, let proven durable id/path
    fields win, and resolve stale inputs through the active ledger with receipt
    or directory identity checks rather than newest-mtime search.
  verify: |
    Parameterize every producer route through a real directory rename containing
    nested cue, clip, master, and path-block values. Require all episode-local
    paths and files under the final root, external paths unchanged, immutable
    seals/hashes/readiness unchanged, and validated producer-only rows preserved
    after a singleton save. Reject one-sided or foreign receipts, changed parent
    hashes, malformed/duplicate producer rows, ordinary disk-only content, and
    consumer ledgers whose episode id disagrees with their directory. Validate
    the explicit post-rename workflow dependency and prove active-owner recovery
    cannot select a newer sibling.
  tags: [rename, transaction, path-rebase, ledger, durable-identity, freeze-receipt, disk-only-row, producer-ownership, active-owner, workflow-gate, cross-route]
  legacy_id: PBUG-20260721-14

- id: "12.67"
  phase: 12
  area: derived-ledger-text-metric-ownership
  symptom: |
    A structurally valid authored row is frozen with a stale-count warning, or
    row, aggregate, and budget receipts disagree even though they describe the
    same canonical text. Punctuation glued for delivery, especially en/em
    dashes and smart apostrophes, makes one stage report a different word total
    from another. A later repair can also change text while leaving one or both
    derived count fields behind.
  cause: |
    Producers, repair passes, readiness normalizers, aggregate writers, and
    freeze auditors each own a local word-count approximation. Some use a
    lexical regex, some use whitespace splitting, and some trust previously
    stored counts. Direct text mutations are not atomic with character and word
    metrics, while durable save rolls stale fields forward instead of deriving
    them from the canonical text it is about to serialize.
  fix: |
    Put the lexical contract in one dependency-free helper and route every
    durable text mutation through an atomic text/character-count/word-count
    setter. Define punctuation semantics explicitly. At durable save, derive
    every row metric from canonical text before rebuilding cast, scene, root,
    and role-specific aggregates, including clearing aggregates with no current
    rows. Preserve the incoming audit for producer diagnosis, then perform one
    count-only refresh after the final permitted text mutation and before the
    final freeze audit. Derived-metric refresh must not alter canonical text,
    delivery projections, authorship hashes, or seals.
  verify: |
    Pin straight and smart apostrophes, ASCII hyphens, and en/em dash boundaries
    including a punctuation-glued production sentence. Corrupt row, cast,
    scene, root, and role-specific totals, save, and require all of them to be
    re-derived consistently. Prove the pre-audit still reports an incoming
    mismatch while the post-audit is clean after the final refresh. Exercise
    every producer route and AST-scan production modules so a direct ledger-text
    assignment cannot bypass the atomic owner.
  tags: [ledger, derived-state, word-count, punctuation, atomic-mutation, aggregate, freeze-audit, all-route, ast-guard]
  legacy_id: PBUG-20260721-15

- id: "12.68"
  phase: 12
  area: bounded-llm-authoring-transport
  symptom: |
    An LLM authors a modest script but cannot complete or repair the requested
    structured artifact inside its real context. A first response truncates at
    the output cap, a later response drifts one mechanical ID, and typed repair
    truncates again because it carries the failed whole artifact beside the
    broad original request. The pass exhausts and kills the episode even though
    the story text itself is small and repairable.
  cause: |
    The authoring boundary is defined by the downstream storage schema instead
    of field ownership. The model repeatedly serializes compiler-derivable IDs,
    parents, speakers, scenes, cues, boundaries, fact mappings, and neutral
    defaults. Repair duplicates those fields, schema authority, and request
    context. Output and prompt costs therefore scale with mechanical metadata,
    while fresh LLM retries repeat the same impossible envelope.
  fix: |
    Define a strict compact wire artifact containing stable IDs and only the
    fields the model owns. Require an exact unique bijection to the accepted
    graph, map by ID rather than position or fuzzy matching, and compile every
    mechanical field from accepted authority before running the complete
    downstream validator. Typed repair carries only a parsed compact draft and
    the smallest trusted context needed to correct it; omit malformed prefixes
    and raw schema/request echoes. Require the complete prompt and full dynamic
    output reservation to fit. Keep liveness finite and truthful: one bounded
    lane, at most one fresh independent lane, then only an explicit deterministic
    floor for advisory craft defects.
    A capacity failure must carry a PHASE, and the phase decides whether the
    ladder may spend another attempt. A pre-call refusal (the measured prompt
    leaves no room for the artifact) is deterministic: re-rolling re-derives the
    identical refusal, so it stays terminal. A call that RAN and consumed its
    whole output allowance without reaching a stop condition is stochastic, and
    it must advance the ladder rather than escape as an unhandled error on
    attempt one of N -- a ladder that advertises a budget and spends one call is
    lying about its own liveness. Being CATCHABLE is not being RETRYABLE: catch
    both phases at the attempt boundary, then re-raise the deterministic one
    untouched. Own the phase in the module that owns capacity arithmetic and let
    the ladder ask it, so the transport and the retry policy cannot hold two
    different opinions about the same failure. The truncated partial artifact is
    never fed to a prose repair, and any message that claimed no retry was
    possible must be corrected when the retry becomes possible.
  verify: |
    Exercise the maximum supported word and row surface with the exact production
    tokenizer. Require both base and semantic-repair prompts plus the complete
    output reservation to fit the real context. Assert authored text is preserved
    while compiler-owned graph fields are rebuilt, and reject missing, unknown,
    or duplicate IDs. Prove typed repair omits whole-request/schema echo and
    malformed raw prefixes. Record a creative-to-technical restart exactly once
    and truthful exhaustion after exactly two flat ladders.
    Drive the real ladder with a transport that raises each capacity phase.
    Prove the run-and-overflow phase reaches the NEXT rung and that a good next
    attempt returns a result; prove an unlucky pass spends its whole advertised
    budget and then dies as the ladder's own typed exhaustion carrying the
    capacity error, not as a bare transport error on attempt one. Prove the
    pre-call phase still propagates after exactly ONE call. Distinguish the rungs
    by an observable the fake transport can see, and assert that observable is
    not equal to any constant another rung uses -- a fixture value that collides
    with the constant under test hides a reverted gate.
  tags: [llm-output, structured-transport, compiler-ownership, context-window, output-budget, typed-repair, line-id, finite-liveness, fail-closed, capacity-phase, retry-policy]
  legacy_id: PBUG-20260721-16

- id: "12.69"
  phase: 12
  area: positioned-media-timeline-ownership
  symptom: |
    A complete media render reaches its terminal mux with a video body longer
    than the authoritative master audio even though every individual shot and
    credits declaration is valid. The excess can equal the sum of intentional
    cue/dialogue crossfades.
  cause: |
    Full per-shot render requests are summed as final output duration after the
    audio ledger has positioned overlapping rows. The positioned assembler then
    emits each request in full instead of giving the later row ownership at its
    start boundary. A master-duration cross-check may grow the result but is
    forbidden to shrink the duplicated overlap.
  fix: |
    Separate render-work frames from final timeline frames. For a completely
    positioned manifest, derive the final CFR boundary from the accepted
    post-audio ledger duration and quantize upward to cover the final fractional
    frame. Sort rows stably by position and end each visible slot at the earliest
    of its requested end, the next row's start, or the timeline boundary; fill
    genuine gaps separately. Let the actual master cross-check shrink or grow a
    positioned result, while preserving historical grow-only behavior for an
    unpositioned sequential manifest. Compare engine output with planned visible
    frames and report intentional overlap trimming separately. Keep terminal mux
    tolerance and credits ownership strict.
  verify: |
    Create full shot requests whose sum exceeds a positioned timeline by two
    crossfades. Require stable next-start ownership, no duplicated frames, no
    stretched gaps, an exact authoritative final boundary, and distinct
    requested/rendered/visible/trimmed telemetry with a green visibility gate.
    With real media, require an oversized positioned manifest to reconcile down
    to ceil(master_seconds * fps). Retain a no-position legacy case that keeps
    its full sequential request sum.
  tags: [video, timeline, crossfade, positioned-manifest, frame-budget, ledger-authority, mux, qa-telemetry, legacy-compatibility, all-route]
  legacy_id: PBUG-20260721-17

- id: "12.70"
  phase: 12
  area: explicit-word-delivery-ownership
  symptom: |
    A source bank completes story passes and advances toward media outside the
    operator's explicit character-word band, or a finite model-repair ladder
    correctly detects the miss but fails the whole episode when only its current
    authored candidate is exhausted.
  cause: |
    Producer families implement incompatible counting and length policies, and
    candidate liveness is conflated with episode liveness. A repair ladder may
    stop after one failed model pair, retain an out-of-band closest draft, count
    a different token surface than the ledger, preserve stale row-failure state,
    treat finite candidate exhaustion as final delivery impossibility, or call a
    reroll fresh while replaying the same fixed prompt and seed through two logical
    slots that resolve to one backend.
  fix: |
    Define one dependency-light integer delivery law and persist target, inclusive
    bounds, producer owner, canonical character count, and exact text hash. Repair
    one owned row, try the alternate writer slot, and retain only strict distance
    progress. Four consecutive stalls retire Candidate N, never the episode.
    Then one producer authors a fresh complete candidate; alternate producer
    priority on successive rerolls. Make that freshness model-observable with a
    monotonically unique producer prompt nonce or another validated generation
    input whenever logical slots share a seeded backend. Keep candidates bounded but
    retain fresh rerolls as the normal recovery. BUG-12.71 later adds a fixed,
    fail-closed outer campaign ceiling after production proved unbounded retries
    can hold the queue forever. A temporary provider failure may consume a
    candidate but must never publish partial state. Reject padding, repetition, fake advertising
    or products, invented numeric/visual/canon claims, markup, stage directions,
    and program-authored story prose. Content-owned lanes rebuild proofs and
    hashes; inline lanes stage a complete reroll before committing. Subjective
    quality is fail-open. Only the final deterministic in-band ledger stamp may
    accept a candidate, and every media/readiness consumer stays downstream.
    Freeze retains a read-only hash-bound recount as the last backstop.
  verify: |
    Pin 180 to 163..200 and 320 to 289..356. Prove unlimited strict-progress
    cycles, four consecutive stalls per candidate, alternate-slot escalation,
    whole-candidate retirement, distinct model-visible reroll inputs when logical
    slots share one backend, and successful continuation beyond five outer
    generation failures. Require canonical counting, current line-id hygiene
    state, non-target immutability, proof/hash resealing, no fake-commercial or
    new-claim patch, final reflections from accepted rows, and a hard assembled
    stamp before readiness or media. A declared freeze miss must stop before
    video without mutating content text or hashes.
  tags: [word-budget, delivery-contract, producer-ownership, row-local-repair, candidate-liveness, bounded-outer-retry, hash-receipt, readiness, freeze, all-route]
  legacy_id: PBUG-20260721-18

- id: "12.71"
  phase: 12
  area: bounded-word-fit-campaign-liveness
  symptom: |
    A production source-bank sweep can remain pending forever after story
    generation succeeds. Logs repeat producer-cache reuse while no episode,
    readiness stamp, media artifact, or terminal error appears, blocking every
    later leg behind the first non-converging word-fit campaign.
  cause: |
    Row-local repair and each authored candidate are finite, but producer
    families wrap them in an outer while-true campaign that accepts only an
    in-band ledger or deterministic capacity impossibility. When capacity is
    sufficient and model output repeatedly misses the band, candidate retirement
    has no episode-wide terminal condition.
  fix: |
    Put one shared, fail-closed outer candidate ceiling in the common retirement
    owner used by every producer family. Default to twelve retired candidates and
    accept only positive integer overrides from OTR_MAX_WORD_FIT_CANDIDATES.
    After the ceiling-th retirement has been recorded and stale readiness state
    cleared, raise a distinct WordFitCeilingExceeded subclass of the existing
    WordDeliveryError so current node boundaries remain fail-closed. Preserve the
    exact in-band ledger stamp as the only acceptance path; never publish a
    partial or closest candidate.
  verify: |
    Exercise the default ceiling, a smaller environment override, and acceptance
    on candidate k below the ceiling. Require every producer loop to retire
    through the shared owner. In a production multi-bank sweep, each leg must
    either reach RESULT SUCCESS plus obs_publish and canonical assets, or
    terminate promptly with exact WordFitCeilingExceeded. No pending leg may
    spin indefinitely.
  tags: [word-budget, delivery-contract, candidate-liveness, bounded-outer-retry, fail-closed, typed-error, environment-override, queue-liveness, all-route]
  legacy_id: PBUG-20260722-01

- id: "12.72"
  phase: 12
  area: pack-seam-accessor-ownership
  symptom: |
    A runnable source-bank lane fails before model inference with a missing
    prompt-seam error even though the selected story pack contains the seam.
    A valid pack can therefore be rejected at the first structured pass.
  cause: |
    Prompt seams are owned by the StoryPack.prompt_stages mapping, but a lane
    resolves a seam as though it were a dataclass attribute. getattr(pack,
    seam, None) returns None for every valid mapped seam and masks a registry
    wiring defect as a missing-pack contract failure.
  fix: |
    Resolve every declared seam through the canonical prompt_stages mapping and
    fail closed only when the mapped value is absent or empty. Keep the seam
    name and exact prompt text observable at the structured-call boundary.
  verify: |
    Build a valid StoryPack with a declared prompt_stages seam, invoke the
    shared structured-pass boundary, and require the exact mapped text in the
    system message. Also exercise every runnable bank's declared seams through
    its selected runner and require the live bank leg to reach RESULT SUCCESS,
    obs_publish, and canonical assets.
  tags: [story-pack, prompt-seam, mapping, dataclass, registry, structured-call, fail-closed, all-route]
  legacy_id: PBUG-20260722-02

- id: "12.73"
  phase: 12
  area: capability-declaration-vs-runtime
  symptom: |
    A component declares a range of legal values, a planner commits real work
    against that declaration, and only the execution step discovers the
    component cannot produce most of that range. The failure is LATE and
    expensive: everything upstream of the executing step has already been paid
    for. It reads as a regression in the executing component, because the
    declaration has usually been wrong for a long time without anyone asking
    for a value outside the narrow band that happened to work.
  cause: |
    The declaration was hand-written and never checked against the runtime that
    must honour it. Three independent channels can each break the promise:
    (1) the declaration itself overstates the component; (2) an environment
    override read at execution time moves a bound the declaration froze, so the
    planner and the executor disagree even though the declaration is correct;
    (3) the bound silently depends on a SECOND dimension (canvas, resolution,
    device, precision) that is itself unpinned, so the declaration is true only
    under conditions nothing enforces. Closing one channel leaves the others
    open and produces a fix that appears to work.
  fix: |
    Make the declaration describe what the runtime DOES, not what the component
    is believed capable of, and use literals rather than deriving from a mutable
    constant -- a static declaration must never track a value that can move
    underneath it, because drift should fail a test visibly rather than be
    absorbed silently. Refuse, do not silently win: when an environment value
    disagrees with a declaration, raise a typed conflict naming the variable and
    the legal value, because quietly overriding an operator's explicit setting
    is its own defect. Pin every secondary dimension the bound depends on, and
    say in the declaration which measurement it came from.
  verify: |
    Feed each component's own declared minimum and maximum through the same
    resolver the execution path uses, and require the values to come back
    unchanged; for discrete menus test every member, not the endpoints, since
    inherited min/max are not menu members. Assert the typed refusal fires for
    a disagreeing environment value, passes for an agreeing one, and is not
    pedantic when the variable is unset. Prove the secondary dimension is
    pinned by setting it hostilely and requiring the declaration to win.
  tags: [capability-declaration, contract-vs-runtime, environment-override, static-contract, fail-closed, typed-error, late-failure, planner-executor-agreement, all-route]
  legacy_id: PBUG-20260802-01

- id: "12.74"
  phase: 12
  area: fix-applied-to-an-unreachable-function
  symptom: |
    A defect is diagnosed correctly, a fix is written, reviewed and merged, the
    suite is green -- and production keeps emitting the identical defect,
    unchanged, for weeks. Every artifact of diligence exists except the one that
    matters: the shipped path never executed the new code. Because the evidence
    trail says the fix landed, the next investigation starts by doubting the
    diagnosis rather than the wiring, and re-fixes the same dead function.
  cause: |
    The edited function has no callers on the production path. Two shapes
    dominate. (1) The real logic lives INLINE inside a large orchestrator, and
    the well-named helper beside it is a leftover from an earlier refactor that
    was never deleted -- the good name attracts the fix. (2) A second,
    near-identical helper exists and the caller reaches the other one. Tests
    authored with the fix call the fixed function DIRECTLY, so they prove it is
    now correct while proving nothing about reachability; a green suite cannot
    distinguish "correct and connected" from "correct and orphaned". Coverage
    tools do not help, because the test does execute the line.
  fix: |
    Establish reachability BEFORE editing: find the callers, and if the
    production path is inline code, EXTRACT it into a named helper in the same
    change, so the thing under test and the thing that runs are one object.
    Extract the whole decision -- a helper narrowed to the easy part leaves the
    branches that actually failed still inline and still untestable. Every value
    the block reads from outside becomes an explicit parameter rather than
    migrating with it, and any name the CALLER still needs stays in the caller.
    Then treat the CALL as a separate deliverable from the behaviour: wiring and
    correctness are different claims and need different assertions. Delete the
    orphan rather than leaving it to attract the next fix.
  verify: |
    Assert reachability STATICALLY, over the shipped source rather than a booted
    object, so no stub can satisfy it: the production entry point calls the
    helper exactly once, passes the complete argument contract, and assigns its
    return value. Then exercise every ROUTE through the helper and assert the
    output is PRESENT -- a test that only asserts the bad value is absent is
    also satisfied by an empty result, which is how a silent failure passes as a
    pass. Include a control lane that does NOT reach the block, and confirm it
    genuinely does not, so the matrix cannot be quietly proving nothing. Finally,
    mutate the shipped code once per claim and require the suite to go red for
    each; a fix whose test stays green when the fix is removed is not covered.
  tags: [dead-code, zero-reader, reachability, extract-to-test, false-green, wiring-vs-behaviour, static-assertion, mutation-check, all-route]
  legacy_id: PBUG-20260805-04
- id: "03.05"
  phase: 3
  area: loading
  symptom: |
    ComfyUI boots green and the node registers, but the same module raises
    ImportError -- attempted relative import with no known parent package, or
    beyond top-level package -- the moment anything outside the ComfyUI runtime
    touches it. Every pytest run, every CLI entry point, every offline repro
    dies at the import line. Because the pack works in the UI, the failure gets
    read as a broken test harness rather than a broken module, and the helper
    behind that import quietly stops being exercised by anything at all.
  cause: |
    A module has exactly one load identity at a time, and relative imports work
    only under one of them. A pack whose modules are reached by prepending the
    nodes directory to sys.path and importing ABSOLUTELY is loaded as a
    TOP-LEVEL module -- __package__ is empty, so there is no parent for a
    leading dot to resolve against. The import STYLE is therefore part of the
    module's load contract, not a matter of taste, and the contract lives in a
    docstring that the next edit does not read. Editors and refactor tools
    default to the relative form, so a single line added months later plants a
    latent break in a file that is otherwise pure absolute imports. It stays
    invisible under ComfyUI for either of two reasons -- the runtime may import
    the pack as a PACKAGE, giving the leading dot a parent to resolve against,
    or the ComfyUI path may simply never reach that branch -- and the defect is
    per-SITE rather than per-file, so a fix that repairs the two lines someone
    happened to notice leaves the sibling sites live.
  fix: |
    Pick ONE load identity per module, state it at the top of the file, and
    make every import in that file obey it -- absolute under sys.path-prepend,
    relative only in a module that is genuinely always a package member. Then
    stop fixing it by hand. The defect class is repo-wide the instant it
    appears once, so sweep every module under the contract in the same change,
    not just the file whose test went red, and delete the temptation by adding
    a gate that rejects the wrong form mechanically. Treat the untested helper
    as part of the bug: an import that only ever fails outside the runtime has
    been shielding its own function from every test you own, so restore the
    import and then cover what it imports.
  verify: |
    AST-parse every module in the pack and assert that no ImportFrom node has
    level greater than zero in any file declaring the sys.path-prepend
    contract; the assertion must name the file and the line so the next
    occurrence is a one-line diagnosis. Prove the gate can fail by planting a
    single relative import and requiring it to go red. Then import each module
    standalone in a fresh interpreter with only the nodes directory on
    sys.path -- runtime-shaped green is not proof -- and require at least one
    test to CALL the function behind the repaired import, because the import
    line was reachable all along; it was the caller that never existed.
  tags: [relative-import, absolute-import, load-contract, sys-path-prepend, top-level-module, latent-break, repo-wide-sweep, static-assertion]
  legacy_id: BUG-LOCAL-252
- id: "03.06"
  phase: 3
  area: loading
  symptom: |
    The boot log stutters. The pack's prestartup banner prints twice, the
    all-nodes-loaded line prints twice, the HTTP route lines print twice, and
    the import-times section names two different absolute paths ending in the
    same pack directory -- all inside ONE process, under one ComfyUI revision
    banner. The node menu looks perfectly normal, one entry per node, so the
    operator dismisses the duplicate lines as noise. Later symptoms do not name
    the cause: an edit to the pack has no effect, a cache or counter behaves as
    if something else is writing to it, a background job runs twice.
  cause: |
    ComfyUI scans more than one custom_nodes root -- the base install tree and
    the user directory are separate roots, and extra path config can add more.
    Each root is scanned independently and a pack present in two of them is
    loaded TWICE, as two distinct module objects with two distinct __file__
    values, because nothing dedupes by pack name. Prestartup scripts run once
    per copy as well, before any node code exists to notice. Every module-scope
    side effect therefore happens twice: environment mutation, sys.modules
    monkeypatching, aiohttp route registration against the one shared server
    singleton, thread spawns, log handlers. NODE_CLASS_MAPPINGS is a plain
    dict, so the second copy's classes silently overwrite the first's -- the UI
    is correct and the code that actually executes belongs to whichever copy
    was scanned last, which need not be the one being edited. The usual setup
    that produces this is the recommended one: keep a source repo and a synced
    deployed copy, then let both land under scanned roots. It is the mirror
    image of a key collision between two packs, and namespacing cannot touch
    it, because the colliding names are correct and identical by construction.
  fix: |
    Make the second load impossible to miss and harmless when it happens. Have
    the pack record a process-global sentinel carrying the __file__ of the
    first load; on a second load, log BOTH paths at error level and return
    before re-running any side effect, rather than proceeding quietly. Make
    every module-scope side effect idempotent on its own terms anyway --
    setdefault rather than assignment for environment variables, a
    router-contains check before registering a route, a named-thread lookup
    before spawning -- because idempotence is what keeps a duplicate scan from
    becoming a duplicate server. Then fix the deployment rather than living
    with the guard: exactly one scanned root may contain the pack, and a source
    repo kept beside a deployed copy belongs OUTSIDE every root ComfyUI scans.
  verify: |
    Query the roots ComfyUI actually scanned, not the ones you believe it
    scanned, and assert that exactly one of them contains the pack directory;
    on failure raise a typed error naming both absolute paths, since two paths
    in the message is the entire diagnosis. Prove it fires by copying the pack
    into the second root, booting, and requiring the error -- then remove the
    copy and require a clean boot whose registration banner appears exactly
    once. Separately assert the count of the pack's registered HTTP routes
    equals the count it declares, because doubled registration is the side
    effect most likely to be swallowed by a defensive try/except and reported
    as success.
  tags: [double-load, duplicate-registration, custom-nodes-roots, module-identity, prestartup, side-effects, idempotence, http-routes, deployment]
  legacy_id: LOG-20260723-double-load
- id: "04.14"
  phase: 4
  area: validation
  symptom: |
    A socket is right there on the node -- correct type, connectable, with a
    tooltip describing exactly what it does. The pack loads clean, the graph
    validates, the queue accepts it. The instant anything is wired to that
    socket, execution dies with TypeError -- got an unexpected keyword argument
    -- naming an input the node itself advertises. Worse than the crash is the
    quiet period before it: anyone planning new work reads that socket as
    evidence the node owns a feature it does not own, and builds on a promise
    the code never made.
  cause: |
    ComfyUI hands every resolved input to the class's FUNCTION method as a
    KEYWORD argument named by its INPUT_TYPES key. Nothing compares those keys
    against the method signature at registration -- INPUT_TYPES is just a dict
    returned by a classmethod, and the mismatch is discovered only when the
    executor actually calls. Declaration and signature drift independently, and
    two histories dominate: an input block copy-pasted from a sibling node
    whose method was never updated, and a migration that stopped after the
    declaration. Both leave a socket that is visible and unreachable. It stays
    latent for exactly as long as the canonical workflow declines to wire it,
    so a green production graph proves nothing about the sockets it does not
    use. The variant with **kwargs is quieter and worse: no TypeError, the
    value is simply swallowed, and the node reports success while ignoring an
    input the operator connected on purpose.
  fix: |
    Treat INPUT_TYPES as a contract the FUNCTION must satisfy, and enforce it
    once at the registry level rather than per node, because a defect that can
    exist on any node needs a check that visits every node. Walk the node
    mappings, collect every key in required, optional and hidden, and require
    each to be a named parameter of the class's FUNCTION method or absorbed by
    a declared **kwargs; check the reverse direction too, since a parameter
    with no default and no declaration is the same drift facing the other way.
    When the audit names a drifted socket, resolve it from history before
    touching it -- deleting the declaration and implementing the parameter are
    opposite changes with opposite blast radii, and picking one because it is
    smaller is a guess wearing a patch's clothes. Where **kwargs is genuinely
    wanted, read the declared keys out of it explicitly and reject unknown
    ones, so absorption never becomes silence.
  verify: |
    Run the parity sweep over the SHIPPED registry by introspection, and
    require the set of declared input names minus the set of signature
    parameters to be empty for every registered class unless that signature
    takes VAR_KEYWORD; the failure message must name the node and the offending
    key. Prove the sweep can fail by adding one bogus key to a single node's
    INPUT_TYPES and requiring red. Then take the specific socket all the way to
    execution -- wire it in a minimal graph, run it, and require a real result
    rather than an absence of error -- because a socket nothing wires is a
    socket nothing tests, and the whole defect lived in that gap.
  tags: [input_types, function-signature, signature-parity, declared-vs-accepted, latent-socket, kwargs-swallow, registry-wide-audit, static-assertion, late-failure]
  legacy_id: NEWBUG-20260731-scene-sequencer-music-sockets
- id: "05.12"
  phase: 5
  area: python-scoping
  symptom: |
    A feature that is Off by default has been dead for weeks. Every run with it
    enabled dies at execution with TypeError -- run() got an unexpected keyword
    argument 'os' -- naming a module the signature never mentions. Default runs
    are clean, the suite is green, and the commit that broke the feature touched
    a different part of the function entirely, so the blame lands on the feature
    rather than on the edit that killed it.
  cause: |
    A re-entrant call built its argument bundle from a bare locals() snapshot,
    filtered by a hand-written exclusion list of the names that existed on the
    day the gate was authored. locals() is not the parameter list -- it is every
    name bound in the frame so far, including function-body imports, temporaries
    and loop variables. Any later edit that binds a new local ABOVE the capture
    point silently adds a key to the bundle. Here a story-scaffold block landed
    one day after the gate and introduced a function-body import of os plus a
    scaffold temporary above it; both were forwarded as keyword arguments into a
    run() that has no **kwargs. The exclusion list is a denylist over an open
    set: it can only name what already existed, so it is guaranteed to go stale.
    Because the path was default-Off, nothing in the suite drove the gate, and
    the defect shipped latent behind a green board.
  fix: |
    Never build a kwargs bundle from a bare locals() snapshot. Derive the
    bundle's membership from the CALLEE, not the caller's frame: filter locals()
    against inspect.signature(type(self).run).parameters, an allowlist that a
    new local cannot poison no matter where it is bound. Keep the explicit
    exclusions only for names that ARE real parameters but must not be
    re-forwarded, such as the keyword-only internals that drive the loop.
    When the forwarded set is small, name the arguments explicitly and delete
    the reflection entirely. The general rule: an argument bundle assembled by
    introspecting the caller's scope is a time bomb armed by the next unrelated
    edit; assemble it from the target's declared interface instead.
  verify: |
    Drive the re-entry path with the option ON and the inner loop stubbed, then
    assert two things separately -- that the captured bundle contains no key
    outside the callee's signature, and that a value the caller set survives the
    round trip. The second assertion matters because a filter that throws the
    payload out with the noise also passes the first. Then bind a junk local
    immediately above the capture point and require both assertions to still
    hold; that is the mutation which reproduces the original defect. Finally,
    inventory the default-Off toggles and drive each one end to end at least
    once: a branch no test enters is a branch where an unrelated edit can be
    fatal without turning anything red.
  tags: [locals-capture, kwargs, signature-filter, denylist-vs-allowlist, re-entry, latent-defect, default-off-path, typeerror, python-scoping]
  legacy_id: BUG-LOCAL-416
- id: "05.13"
  phase: 5
  area: migration
  symptom: |
    After a ComfyUI upgrade, a custom node that invokes core nodes directly
    crashes partway down a loader chain, on exactly one link: node
    'AudioEncoderLoader' returned a comfy_api NodeOutput object, expected a
    non-empty tuple. Four earlier links in the same chain loaded cleanly. No
    workflow JSON changed, and the pack's own check is unremarkable -- it
    asserts that a node returned a tuple -- so the failure reads as a defect in
    that one node instead of what it is: an upstream API migration arriving one
    node at a time.
  cause: |
    ComfyUI is migrating core nodes to the V3 node API incrementally. A V3
    node's FUNCTION returns a comfy_api NodeOutput wrapper -- positional results
    stored on .args and exposed through the .result property, which is that
    tuple when non-empty and None otherwise -- rather than a bare tuple; an
    async V3 execute returns a coroutine of one. Because the migration is
    partial, V1 and V3 nodes coexist inside a single invocation chain, so a
    consumer that validates isinstance(out, (tuple, list)) keeps working for
    every unmigrated neighbour and breaks only for the node that moved. The
    underlying error is older than the upgrade: the custom node treated another
    node's return SHAPE as a stable contract. Reaching past your own declared
    sockets into a core node's FUNCTION means owning that node's return contract
    across every host version you claim to support.
  fix: |
    Normalize at the boundary. Put one narrow adapter between the invocation and
    the rest of the pack: run the coroutine if the return is one, unwrap a
    NodeOutput to its positional tuple, pass a plain tuple through unchanged,
    and let everything else -- including an EMPTY NodeOutput -- fall through to
    the loud typed error that names the node and the shape received. Duck-type
    on attribute shape rather than importing comfy_api, so the pack still
    imports outside ComfyUI and is not pinned to one internal module path.
    Record in a comment the host version the shape was confirmed against, and
    keep the adapter internal -- no INPUT_TYPES, socket, widget or output
    change, so saved workflows need no rewire and the fix carries no widget
    regression risk.
  verify: |
    Pin BOTH shapes, not only the one that broke. Four cases: a V1 plain tuple
    passes through identically, a V3 NodeOutput unwraps to its positional tuple,
    an empty NodeOutput still raises the loud error, and an unregistered node
    still raises. Build the doubles from attribute shape alone so the tests run
    with no ComfyUI import. Then re-run the real episode and workflow that
    crashed and require the chain to load past the migrated node into the next
    phase. Re-run that same matrix after every host upgrade and pin the version
    it last passed under: with a partial migration the set of core nodes
    returning wrappers grows silently, and the next one to move will be a node
    your chain already depends on.
  tags: [comfyui-core-api, v3-node-api, nodeoutput, return-contract, partial-migration, node-invocation, duck-typing, version-drift, boundary-normalization]
  legacy_id: BUG-LOCAL-266
- id: "05.14"
  phase: 5
  area: execution
  symptom: |
    A diagnostic the operator reads -- a generated-token count, a size, a
    duration -- comes back None on a run that plainly produced output, and every
    branch keyed on it stays silent. Nothing is logged, because the swallow was
    written to be quiet. In this incident three brand-new tests failed on that
    None while the shipped code was innocent: the value that could not survive
    the defensive fallback was the test double, not anything production ever
    passes.
  cause: |
    Three mistakes stacked in one line, getattr(ids, "shape", [len(ids)]) inside
    a bare except Exception. First, Python evaluates every argument BEFORE the
    call, so the third argument is built EAGERLY -- len(ids) runs even when
    .shape exists, and it raises on any object without __len__. A fallback
    written as an argument is not lazy; it is unconditional work that can fail.
    Second, the bare except cannot distinguish a genuinely exotic backend value
    from a TypeError manufactured by the fallback itself, so a programming error
    is laundered into a plausible None that every downstream reader accepts as
    data. Third, the double was LESS capable than the real object: a real tensor
    carries both .shape and __len__, the stand-in carried only .shape, so the
    tests invented a failure mode production does not have and sent the
    investigation into the wrong file.
  fix: |
    Make the fallback lazy by making it a branch. Read the primary first, then
    compute the alternative only on the path that needs it -- shape =
    getattr(ids, "shape", None), then int(shape[-1]) if shape is not None else
    len(ids) -- or pass a callable and call it in the miss case. Put no work
    that can raise into a default argument, a dict.get default, or the
    right-hand side of an or-expression you believe is unreachable. Narrow the
    swallow to the exception the exotic case actually throws, and when you do
    swallow, log the exception text and the value's type so a None always
    carries a receipt. Build test doubles to the real object's FULL touched
    surface -- every attribute and dunder the production line reads -- and when
    a failure appears only under a double, repair the double rather than
    hardening production against a shape it will never see.
  verify: |
    Exercise the line with an object that HAS the primary attribute and assert
    the alternative never runs: put a counter or a raising sentinel in the
    fallback position and require it untouched. That assertion is the one that
    fails on the eager form and passes on the branch form, so it is the proof.
    Exercise it again with an object that lacks the attribute and assert the
    fallback returns the correct value. Assert that a genuinely uncomputable
    diagnostic emits a log line naming the exception and the type, so no None is
    silent. Grep the tree for eager defaults of the same family -- a getattr or
    a dict.get whose default position holds a CALL -- and require each to be
    branch-shaped. Drive the whole check through the real object at least once,
    because a suite that only ever meets the double can only ever verify the
    double.
  tags: [eager-default-argument, getattr, lazy-fallback, bare-except, silent-none, diagnostic-field, test-double-fidelity, false-failure, python-semantics]
  legacy_id: HANDOFF-L1589
- id: "06.07"
  phase: 6
  area: caching
  symptom: |
    A QA plan promises a replay leg -- queue the same workflow twice with
    nothing changed and get the same episode back -- and the leg can never be
    made to pass. Every requeue authors a fresh story with fresh seeds and
    different output bytes. Nothing errors, no cache hit is ever logged, and
    nodes built specifically to FREEZE a decision re-take it on every run. The
    investigation goes hunting for hidden nondeterminism in the model or the
    RNG, when the graph has simply been told to discard its cache on purpose.
  cause: |
    The node's IS_CHANGED returns time.time(), which can never equal the
    previous run's value, so ComfyUI's cache always misses. As local advice
    that is fine, and this guide prescribes it for a live data fetch (see
    06.01). But a cache signature is not a local property: invalidation
    propagates to dependents, so one always-refresh node at the head of a
    subgraph forces its whole downstream cone to re-execute. When that head
    node is also nondeterministic -- an LLM writer that authors new content on
    each call -- the subgraph has no stable identity for anything downstream to
    replay, and a freeze or lock node that returns a wall clock as well pins
    nothing, because what it froze is re-taken before it is ever read.
    Replayability is forfeited by the wiring, not lost to chance, so no amount
    of seed discipline downstream can recover it, and a plan that promises a
    replay leg over such a subgraph is promising what its own graph forbids.
  fix: |
    Derive the signature from what the output actually DEPENDS on, never from a
    wish to run again. Return a digest of the resolved inputs plus the external
    state the node reads -- file mtime and size, the environment variables it
    consults, a version constant you bump when behaviour changes -- so
    identical conditions produce an identical string and a genuine cache hit
    becomes possible at all. Where a run truly must be forced, make the forcing
    an INPUT: a nonce or seed widget the operator bumps, which the graph
    records and a later run can restate, rather than a clock nobody can
    reproduce. Reserve time.time() for edge nodes whose output cannot be
    described by their inputs, and keep those off the deterministic spine,
    because every node downstream of one inherits its unrepeatability. If a
    promised replay leg sits under an always-refresh node, either change the
    signature or move the replay off the live queue onto a captured frozen
    artifact -- do not ship the promise unchanged.
  verify: |
    Call IS_CHANGED twice with identical kwargs and require the two values to
    be EQUAL, then change one field and require them to differ; failing the
    first half is a cache defeat, failing the second is a stale-output bug.
    Statically scan every IS_CHANGED body in the pack for a wall-clock call and
    assert none appears on any node the deterministic spine is declared to
    cover. Prove propagation in both directions: perturb one upstream signature
    and require the dependents to re-execute, leave it untouched and require
    they do not. Then run the claim end to end -- queue the unchanged workflow
    twice and require the second run's output digest to equal the first's.
  tags: [is_changed, cache-signature, determinism, replay, invalidation-propagation, freeze-node, wall-clock, content-derived-signature, xref-06.01]
  legacy_id: KIBITZ-2026-07-12-replay-leg
- id: "07.24"
  phase: 7
  area: audio
  symptom: |
    The default output of a generative slot collapses in quality after a
    release, and the operator can only describe it subjectively -- the music
    bed no longer sounds like music. The prompt builder's history is clean back
    past the last known-good render, the model loads, the node runs, clip
    lengths and sample counts are exactly right, and the suite is green.
    Nothing is red because nothing a machine was asked to check moved.
  cause: |
    The engine behind the slot was swapped and its prompt was not. A prompt is
    not a neutral instruction; it is an asset tuned to one model's training
    distribution and conditioning contract, and it does not migrate. Text that
    steered the old engine reads as noise to the new one, while the new
    engine's own required inputs go unfilled -- the old contract had no concept
    of them, so they take empty defaults: an empty negative prompt where a real
    one is expected, a structural context window left at a stock value instead
    of sized to the cue being rendered. Nothing dangles, so every grep, AST
    parse and import check stays green. The decision that produced the swap is
    the deeper defect: the new engine became the default because it was the
    only candidate that introduced no dependency conflict. Conflict-free is a
    reason a candidate is AVAILABLE, not a reason it should lead -- and the one
    automated gate that could have bracketed the regression, a byte-identical
    golden over the rendered audio, fights the repair by design, because any
    genuine improvement changes the bytes.
  fix: |
    Bind the prompt and conditioning bundle to the ENGINE rather than to the
    slot, so a swap must carry a re-tuned bundle or decline to be the default.
    Before promoting any default, state the evidence that the new engine is
    better on THIS content, and name convenience separately from quality; an
    availability argument must never be allowed to stand in for a comparison
    nobody ran. Having kept the new engine, fill its whole input contract
    rather than only the fields the old one had, deriving each new field from
    the real cue instead of a constant. Expose the settings it is sensitive to
    as overridable constants and trace the resolved engine, settings and prompt
    hash into the run log, because an A/B needs two labelled artifacts. Confirm
    which engine the failing lane ACTUALLY resolved before tuning anything -- a
    theme path and a bed path can produce similar-sounding output while only
    one of them moved. When a byte-identical golden guards the output, schedule
    its operator-gated re-baseline as part of the change instead of meeting it
    as a surprise red.
  verify: |
    Assert that each generative slot's default engine and the prompt bundle
    feeding it come from one declared pairing, so a swap that leaves the bundle
    behind fails at import rather than at listen time. Statically check every
    engine's required conditioning fields against what the shared builder
    supplies and fail on any field falling through to an empty default. The
    quality claim itself is not machine-checkable, so gate it honestly: keep a
    reference render from the last known-good engine, require an operator A/B
    against it, and re-baseline the golden only after that approval -- stamping
    the approval date, engine, settings and prompt hash beside the new golden,
    so the next investigation can tell an intentional byte change from a
    regression.
  tags: [audio, engine-swap, default-selection, prompt-model-mismatch, conditioning-contract, silent-quality-regression, golden-rebaseline, operator-ab, provenance]
  legacy_id: BUG-LOCAL-408
- id: "07.25"
  phase: 7
  area: video
  symptom: |
    An animated reveal -- a decode/scramble title card, a typewriter line, a
    wipe, a counter -- plays for the entire span it was given, and the resolved
    thing it exists to show is on screen for only the last frame or two before
    the next transition takes it away. Scrubbing into the middle of the card
    finds the text still mid-scramble where it should long since have settled.
    Frame counts are right, durations match the plan, every test passes: the
    card is simply never READ.
  cause: |
    Progress was written as p = (frame - start) / (end - start) across the
    whole allotted window, so p reaches 1.0 only on the final frame. The
    animation's span was silently equated with the slot's span, and dwell --
    the interval in which the payload is legible -- was never a quantity in the
    code, so it came out as whatever was left over, which is nothing. Every
    element driven by that same p inherits the defect at once: the characters
    revealed, a secondary carrier line, a cursor suppressed only once p is 1.0.
    The exit transition then fires in those same last frames, leaving the
    resolved state no hold at all. The WINDOW may be perfectly sized; this is
    pacing INSIDE the window, an independent defect easily confused with, and
    easily masked by, whatever earlier fix established the window's bounds.
  fix: |
    Separate the reveal span from the window span. Compute the reveal over a
    bounded FRACTION of the window -- the window length times a reveal
    fraction, floored at one frame, with a tunable default near 0.4 and an
    environment override -- then clamp p to 1.0 and HOLD the resolved state
    until the exit. Dwell is a design parameter and must exist in the code as
    one, with the exit still driven off the window end rather than off the
    reveal end. Extract the progress term into a pure helper the draw path
    calls, so pacing can be asserted without rendering a frame, and apply that
    one helper to every element sharing the animation and to the sibling cards
    on the same draw path, since a closing bookend usually carries the
    identical stretch. Confirm the layers around it keep non-overlapping frame
    ranges, so a longer hold cannot run into what follows.
  verify: |
    Assert BOTH ends of the hold in a pure unit test over the helper, with no
    rendering: fully resolved at start plus the reveal span, and still fully
    resolved two frames before the window ends. Either end alone is a false
    green -- the first admits a card that re-scrambles, the second admits one
    that resolves too late to read. Assert p is monotonic, never exceeds 1.0,
    and that cursor or blink suppression keys off resolution rather than off
    the window. Sweep the reveal fraction across its legal range and require
    the held frame count to stay at or above a stated minimum dwell at the
    shortest legal window, so a later retune cannot quietly reintroduce the
    bug. Then look at a real render at the fraction boundary and confirm the
    title is already solid there.
  tags: [video, animation-pacing, reveal-span, dwell-time, progress-fraction, title-card, procgen, pure-helper-test, look-qa, xref-07.13]
  legacy_id: BUG-LOCAL-409
- id: "07.26"
  phase: 7
  area: video
  symptom: |
    A generated clip starts sharp and ends as mush. Frame 0 is crisp, every
    later frame drifts further into blur, and it happens inside a single clip
    on every clip. Nothing errors -- no warning, no fallback, no workflow JSON
    change to point at -- and the sibling still-image family from the same run
    looks correct or even better than before. Because the first frame an
    operator inspects is the one the conditioning image pins, the defect reads
    as "the model got worse" and the hunt goes off after a lost sampler, a lost
    seed, or a lost LoRA.
  cause: |
    The model is being driven above its native resolution envelope. A small
    video model is trained at one canvas -- 480p for a 2B-class LTX -- and
    above it cannot reconstruct detail out of noise, so each freely denoised
    step drifts a little further than the last. The image-to-video conditioning
    anchors frame 0 to the supplied still, which is exactly why the degradation
    is progressive rather than uniform and exactly why the anchor hides the
    defect at the frame most likely to be checked. The canvas moved because ONE
    render canvas was shared across asset families -- a landscape change made
    correctly for the still-image family dragged the video engine along with
    it, so the regression has no commit of its own. The tuned
    image-conditioning strength then compounds it. At native resolution that
    setting anchored frame 0 while leaving room for motion; at the larger
    canvas the same setting re-noises far more signal than the model can
    restore, so the value that was right is now the thing producing artifacts.
    A constant tuned at one canvas is only valid at that canvas.
  fix: |
    Treat native resolution as a per-engine contract, not a property of the
    deliverable. Resolve the render canvas per engine family so each model
    renders at its own documented native size, then let the composite scale the
    result up to the deliverable -- upscaling a clean render beats sampling a
    dirty one. Never let a single shared canvas value serve families with
    different envelopes; a change made for one family must be structurally
    unable to move another. When the canvas does move, re-derive every quality
    constant whose meaning depends on resolution, and record beside each
    constant the canvas it was measured at, so the next reader can see the
    dependency instead of inheriting it.
  verify: |
    From one shared canvas input, assert the video engine's built request comes
    back at its native size while the still family comes back at the
    deliverable size -- one assertion covering both families, so a future
    global canvas change cannot silently move the video lane again. Assert the
    composite scales the clip up to the deliverable rather than rendering
    there. For a live clip, read the render resolution back out of the engine's
    own log or ledger and require it to equal the native canvas, because the
    request is a claim and the log line is the evidence. Judge the look on the
    LAST frame of a clip, never the first -- an image-to-video anchor makes
    frame 0 sharp whether or not the render is sound.
  tags: [video, native-resolution, quality-envelope, i2v, render-canvas, progressive-degradation, upscale-to-deliverable, per-engine-canvas, shared-default, tuned-constant]
  legacy_id: BUG-LOCAL-412
- id: "07.27"
  phase: 7
  area: vram
  symptom: |
    A quantized checkpoint loads at roughly double its on-disk footprint and
    the sampler falls from seconds per step to minutes per step with no OOM.
    GPU memory sits pinned at the card ceiling while shared system memory
    climbs, and the run blows its wall-clock budget several times over. The
    only direct evidence is one loader line reporting the weight dtype as
    float16 with no manual cast, against a checkpoint whose own filename says
    fp8. With no error to anchor on, the crawl gets read as "the weights are
    too big for this card" and the effort goes into offload policy, reserves,
    and smaller checkpoints.
  cause: |
    A global precision-forcing launch argument overrides the checkpoint's
    native dtype at load and casts every weight up. A natively fp8 checkpoint
    that loads at about 11 GiB becomes about 22 GiB; on a 16 GB card that
    cannot hold the upcast weights plus the text encoder plus the sampler
    working set, so the dynamic offloader pages weights to system memory once
    per step and the per-step cost rises by two orders of magnitude. The flag
    is a GLOBAL -- it knows nothing about which file is being loaded, so it
    silently defeats the entire point of a quantized checkpoint. It survives
    because it was inherited verbatim from a pre-quantization launcher recipe
    and never re-audited when the fp8 checkpoint was adopted, and because that
    recipe had been copied to several launcher sites, so a diagnosis names the
    one site a human remembers while the site that actually boots the server
    keeps the flag.
  fix: |
    Read the loader's own dtype line before changing anything about
    quantization, reserves, or offload policy. It states what precision the
    weights actually landed at and what the file asked for, and it is cheaper
    than any experiment. Then remove the precision-forcing argument from EVERY
    launcher site, enumerated by searching the flag string across the repo, the
    launcher scripts, the install tree, and any config or environment side-file
    that can inject arguments -- not by memory, because a partial removal
    reproduces the symptom and discredits the correct diagnosis. Leave a
    comment at each site saying why the flag is absent, so the next operator
    copying the recipe does not restore it. Re-audit precision globals whenever
    a quantized checkpoint is adopted; precision is a per-checkpoint property
    and a global cannot express one.
  verify: |
    Boot, then assert no process in the launched chain carries the precision
    flag in its command line -- walk the parent chain rather than trusting the
    script you edited, since a stale server can still own the port. Assert the
    loader logs the checkpoint's NATIVE dtype with its expected manual cast,
    and that the measured allocation delta matches the file's on-disk footprint
    within a small margin instead of doubling it. Require zero hits for the
    flag string across the whole tree. Keep the load-time axis and the
    runtime-pace axis separate and close them separately -- proving the weights
    now load native is an architectural result, and a per-step time that
    improved but is still far off target means a second independent defect is
    live. Do not mark the entry fixed on the first axis alone.
  tags: [vram, dtype-upcast, launch-args, quantized-checkpoint, fp8, offloader-thrash, no-oom-crawl, inherited-recipe, multi-site-fix, load-time-evidence, xref-07.16]
  legacy_id: BUG-LOCAL-230
- id: "07.28"
  phase: 7
  area: video
  symptom: |
    An image-to-video clip renders clean and error-free but barely moves -- a
    near-still frame with a trace of drift -- long after the conditioning graph
    has been proven correct. There is no warning, no truncation notice, and no
    log line about the prompt at all, and the composed text sits comfortably
    inside the encoder's nominal token limit. Because a motionless clip looks
    exactly like a conditioning failure, the wiring gets rebuilt again and
    again while the lever that actually moved is never touched.
  cause: |
    A small model's EFFECTIVE attention window for conditioning text is far
    shorter than its nominal capacity. On a 2B-class video model the motion
    signal starts washing out somewhere past roughly 188 characters, and the
    prompt is composed scene-description core first with motion clauses
    appended, so the verbs that carry the motion sit at the tail and are the
    first thing diluted. Nothing is dropped and nothing is truncated; the
    motion tokens are simply outvoted by scene description. Every length
    defense in the stack guards a HARD ceiling -- token limits, context
    windows, output caps -- and not one of them fires, because this is a
    quality limit rather than a capacity limit and it has no failure surface to
    fire on. The over-long budget itself was inherited from a shared
    composition helper whose other callers author still images, where a long
    descriptive prompt is an asset rather than a dilutant.
  fix: |
    Measure the model's effective conditioning length empirically and encode it
    as a named per-model constant at the composition site, rather than sharing
    one prompt budget across artifact families whose models have different
    windows. Cap the composed prompt at that constant. Because the cap now cuts
    text, make the composition order match what matters -- name the clause that
    carries the load-bearing axis, protect it explicitly through the cap, and
    let scene description absorb the loss, since a cap that trims the tail is
    itself a regression when the tail is the signal. Carry the remaining budget
    alongside the prompt so a later style prefix or model-side rewrite cannot
    quietly spend past it.
  verify: |
    Compose the prompt for the affected engine and assert its length is at or
    below the measured constant, then assert the protected motion clause is
    still present in the final string -- both for a composition that fits and
    for one that overflows, since only the overflow case exercises the trim.
    Assert any style prefix or downstream rewrite is charged against the same
    budget rather than appended after it. Render an A/B at the cap and well
    above it and confirm the motion difference is visible to the eye; an
    empirical limit nobody can reproduce decays into superstition, so record
    the measurement, the model, and the canvas it was taken at in the
    constant's own comment.
  tags: [video, prompt-authoring, conditioning, attention-window, motion-signal, silent-degradation, per-model-constant, empirical-limit, protected-clause, char-budget]
  legacy_id: BUG-LOCAL-112
- id: "07.29"
  phase: 7
  area: prompt-composition
  symptom: |
    Generated stills carry a colour cast that tracks the EPISODE rather than
    the subject. Character portraits come out blue on science-fiction episodes;
    the same radio-set still comes out red on period-drama episodes. Framing,
    subject and composition are all correct, audio is unaffected, and no
    workflow JSON changed -- only the colour is wrong, and it is wrong for a
    whole class of image at once.
  cause: |
    Two channels, both living inside prompt-building code rather than in any
    widget. (1) A shared prompt-composition helper was invoked with the scope
    profile meant for establishing shots, which appends the episode's ambient
    colour palette -- terms like neon blue or amber glow -- onto a per-SUBJECT
    face prompt. A text-conditioned image model has no way to know those tokens
    describe the world and not the face, so it tints the only subject in frame.
    (2) A style phrase naming a colour temperature was hardcoded into the
    string builder for one subject class, so every render of that class
    inherited the same skew. Neither looks like a defect while reading: the
    palette is real episode metadata and the lighting phrase is defensible
    prose. The defect is SCOPE. The same token is correct at one artifact class
    and wrong at another, and a hardcoded style term is a permanent bias with
    no control surface to turn it off.
  fix: |
    Give the shared builder one named scope profile per artifact class and make
    every call site state which class it is authoring. A per-subject prompt --
    portrait, face, object -- receives mood and lighting terms only and never
    the episode-wide colour palette; only whole-frame establishing prompts may
    carry the palette. Delete colour-temperature and lighting literals from
    string builders: a style term that cannot vary per episode is a bias rather
    than a default, and if a class genuinely needs lighting language it belongs
    in that class's profile where it is visible and testable. Keep the
    profile-to-class mapping in ONE table, so a reader learns which class gets
    which terms by reading the table instead of by opening every call site.
  verify: |
    Assert the mapping, not the picture. Build metadata carrying a loud
    saturated palette term, compose a prompt for every artifact class, and
    require the palette token to be ABSENT from each per-subject prompt AND
    PRESENT in the establishing prompt -- a presence-only test is equally
    satisfied by a profile that injects everywhere. Grep the shipped builders
    for colour-temperature vocabulary and require zero literal hits. Finally
    render one subject under two episodes at opposite ends of the era range and
    require the subject's colour not to move between them.
  tags: [prompt-composition, colour-cast, scope-profile, hardcoded-style, text-conditioning, shared-helper, per-subject-prompt, image-generation]
  legacy_id: BUG-LOCAL-113
- id: "07.30"
  phase: 7
  area: render-planning
  symptom: |
    A planner returns a legal plan that is plainly worse than one an operator
    can build by hand -- four clips where two would do, so four model loads,
    four renders and four visible seams for a single beat. Nothing errors and
    no log line complains. The same planner refuses other targets that are
    demonstrably coverable, and on one shape it stops answering at all: 18
    seconds at one segment count, still running past 20 at a slightly larger
    one, so the render node hangs instead of failing.
  cause: |
    The search ran TWO full walks over the segment count. The first looked for
    an exact cover at every count from two up to the ceiling; only when that
    entire walk failed did a second walk restart at two looking for a cover
    with a trimmed tail. That ranks candidates by PHASE -- exact before trimmed
    -- when the stated objective is COST, fewest segments. So an exact cover at
    a HIGH count always beat a trimmed cover at a LOW one. A 184-frame beat on
    a min-33 step-4 ladder planned four segments because totals at count c are
    congruent to c modulo 4, making the first exact cover count four, while two
    segments with two frames trimmed had been legal the whole time. Three
    siblings share the shape. The tail-trim window was ASSUMED to be one
    quantum instead of derived from the ladder, which refused 832 beats that
    were coverable. The discrete-menu cover was a bare recursive descent whose
    node count is the menu size raised to the segment count, with no memo, so
    an unsatisfiable target consumed the thread rather than refusing. And the
    join-mode verdict declared a single render from a ceiling comparison
    without checking that a legal length at or above the target exists.
  fix: |
    Collapse the phases into ONE walk over the real objective. At each count,
    give every strategy the contract already permits its chance before the walk
    advances -- a tail trim the adapter itself declared legal is part of what
    that count can do, not a last resort reached after the ladder is exhausted.
    DERIVE every search window from the contract's own arithmetic; a guessed
    window silently refuses work that is legal, and the silence is the
    expensive part. Memoize or bound any recursive cover search before it
    ships, because a search that hangs is worse than one that refuses -- a
    caller can handle a refusal. Make any verdict function prove the plan it
    names exists rather than inferring it from a bound; see 12.73 for the
    general case of a declaration the runtime cannot keep.
  verify: |
    Do not read the search -- sweep it. Run a differential over the whole grid
    of contract and target pairs, old plan against new, and require every
    change to move in the intended direction and only that direction: here
    46,949 plans changed, every one a count REDUCTION, with zero refusals
    introduced and zero increases. Assert the invariant rather than the
    headline number -- a property test comparing segment COUNT alone is passed
    by a reversed fill order, so assert that assembled visible length equals
    the target and that every segment length is legal. Set the sweep floor from
    the real population size, not a round number. Bound the runtime explicitly:
    require a refusal to come back inside a fixed wall clock at the worst count
    the ceiling allows. Mutate each fix once and require the suite to go red
    for each.
  tags: [render-planning, combinatorial-search, objective-ordering, two-phase-search, memoization, unbounded-recursion, derived-search-window, differential-sweep, mutation-check, xref-12.73]
  legacy_id: HANDOFF-L2271, HANDOFF-L4173
- id: "07.31"
  phase: 7
  area: video
  symptom: |
    A scrolling text panel -- credits, a transcript roll, any pre-rendered
    canvas moved past a viewport -- reads as ABSENT to a viewer even though the
    renderer drew it and every unit test passes. Measured by counting lit pixels
    in the column across the finished video, the content is blank for the first
    seconds and blank again for the last, full only in the middle, and the
    fade-out lands on the empty end. The defect is invisible on long content and
    obvious on short content, so it survives every full-length episode and
    appears the first time a SHORT one is rendered.
  cause: |
    The scroll interpolated between CANVAS edges -- offset zero to
    canvas_height minus viewport_height -- while the canvas deliberately
    overstates the content at BOTH ends. The builder starts drawing a fraction
    of a screen down for breathing room, pads below the last line, and sizes the
    bitmap to a generous floor (at least three screens) because it cannot know
    the final height before it lays the text out. Canvas height is therefore an
    ALLOCATION, not a measurement, and using it as the travel span puts blank
    panel on screen at the start and end of every roll. Duration derived from
    the same canvas span inherits the error, so raising the scroll speed
    lengthens the dead tail rather than removing it.
  fix: |
    Have the builder report the real ink span -- the top of the first drawn
    glyph and the bottom of the last -- alongside the bitmap, and anchor both
    the scroll offset AND the duration estimate to that span instead of the
    canvas. Open on the first line and rest the last line on the viewport's
    bottom edge. When the content is SHORTER than the viewport the span clamps
    to zero and the panel HOLDS fully visible rather than drifting through
    emptiness; that clamp is part of the fix, not an edge case. Do not "fix"
    this by trimming the padding -- the breathing room and the generous
    allocation are both wanted; what is wrong is treating an allocation as a
    measurement.
  verify: |
    Assert the content span, not the pixels: build the panel from a fixture and
    require ink to be on screen at the FIRST rendered frame and at the LAST, for
    a transcript longer than the viewport and for one shorter than it. Guard the
    fixture itself with a companion assertion that a longer script produces a
    TALLER span -- a fixture whose items lack the key the renderer draws on
    produces an empty panel of constant height, and "nothing moved" then looks
    like a code defect while a test that renders nothing and asserts nothing
    moved passes forever.
  tags: [video, credits, scroll, canvas-vs-content, allocation-not-measurement, short-input-exposes, pil]
  legacy_id: "OTR-f70df546"
- id: "07.32"
  phase: 7
  area: video
  symptom: |
    Text burned into a layer that is composited with a LIGHTEN-ONLY blend is
    legible over dark scene content and effectively invisible over bright
    content -- measured 8.96:1 over a dark ceiling and 1.13:1 over a lit
    monitor in the same episode. Adding a black outline, a drop shadow or a
    scrim to the text layer changes NOTHING on the finished video, so the
    obvious fix appears to have silently failed to apply.
  cause: |
    The blend is `screen` (out = A + B - A*B), often narrowed further to a
    single channel. `screen(A, 0) = A`: a black pixel in the overlay is the
    blend's IDENTITY, so every darkening element -- outline, shadow, matte --
    is a mathematical no-op no matter how wide it is drawn. Contrast for the
    glyph is then bounded by the source pixel underneath it, and over a bright
    source there is no headroom left to separate from. Recolouring the glyph
    does not rescue it either: white screens to full white, which is still under
    2:1 against a bright source. The blend is also a single global operation
    over the whole frame with no per-region and no time gating, so a targeted
    scrim is unreachable without changing the blend node itself.
  fix: |
    Move the text to a layer composited AFTER the lighten-only blend, where
    normal alpha compositing applies and an outline is real -- typically a
    subtitle/caption burn that already carries OutlineColour, BorderStyle,
    Outline and Shadow. Do not attempt adaptive glyph colour or per-region
    dimming: both damage picture content to fix an overlay and neither delivers
    a true outline. Note the transport constraint before choosing an RGBA
    overlay between stages: yuv420p carries no alpha, so an intermediate
    encode destroys it. When the text becomes the RESPONSIBILITY of a
    downstream node, audit that node's passthrough exits FIRST -- a burn stage
    that returns the input untouched when it is disabled, finds no timed source,
    or catches its own error will now ship a title-less master with a clean log.
  verify: |
    Measure on the FINAL ENCODED artifact, never from blend arithmetic --
    chroma subsampling, range conversion and compression all move edge
    contrast. Name WHICH pixels: report the original scene, the outline/matte,
    and the final adjacent background as three distinct surfaces, because an
    outline can separate the glyph edge while the fill still measures its
    original ratio. Select the BRIGHTEST underlying-source frame from a
    title-free control render of the SAME upstream output, so a stochastic
    scene difference cannot be mistaken for a contrast change, then require the
    core glyph against its adjacent outline to clear 4.5:1 on every text
    interval.
  tags: [video, compositing, blend-mode, screen, legibility, contrast, outline-noop, yuv420p, caption-burn]
  legacy_id: "OTR-83eb759e"
- id: "09.07"
  phase: 9
  area: subprocess
  symptom: |
    A supervisor launches a server; the server comes up, binds its port and
    answers requests -- and the launcher refuses it anyway, reporting a PID
    mismatch on every healthy launch. Then the between-iteration cleanup
    sweep, instructed to kill everything except itself, kills the supervisor.
    The run dies at the iteration boundary with no traceback and no crash
    artifact, so the next investigation starts by suspecting the server.
  cause: |
    The venv's python.exe is a uv launcher STUB. It fork-execs the real
    interpreter out of the uv-managed cpython directory and then stops being
    the process that does the work. Three numbers a naive reading treats as
    one are in fact three distinct values: os.getpid() inside the child
    returns the real interpreter's PID, subprocess.Popen(venv_python).pid
    returns the STUB's PID, and the OS socket table names the real interpreter
    as the TCP port owner. Both processes report the same image name and both
    carry the supervisor's argv, so neither a name-based nor a
    command-line-based enumeration can separate them. A port-owner check that
    compares the handle Popen returned against the socket owner therefore
    mismatches on a perfectly healthy launch, and a keep-list built from
    os.getpid() alone omits the stub -- so an image-name sweep kills half of
    the supervisor's own identity.
  fix: |
    Stop treating a PID handle as a process identity. Resolve liveness and
    ownership from the RESOURCE -- the socket's owning PID, or the process
    tree walked by parent id -- never from the number Popen handed back. For
    self-identification capture the whole chain, os.getpid() AND os.getppid(),
    and pass all of it to any sweep as a variadic keep-list so a launcher stub
    cannot be stranded outside it. Make the keep-list comparison type-exact on
    both sides; a string PID never equals an integer PID and the miss is
    silent. Prefer a direct port preflight -- try to bind it -- over inferring
    readiness from a process handle. Note that the usual wrapper advice
    inverts here: 01.04 says kill the outermost wrapper and never target the
    interpreter, but a stub that fork-execs and stops owning anything is not a
    wrapper you can target, and following that advice here kills the wrong
    process or none at all.
  verify: |
    Print all three numbers on a real launch and require the check to COMPARE
    them rather than assume equality -- os.getpid(), the Popen handle's pid,
    and the socket table's owner for the bound port. Assert that the health
    check passes when the socket owner is a DESCENDANT of the launched handle
    rather than equal to it. Then run the destructive test on purpose: start
    the supervisor, run the sweep, and require the supervisor to be alive
    afterwards, because a keep-list is only proven by a sweep that would
    otherwise have killed it. Force-kill the worker tree and require no
    orphans and a recorded death -- but do not assert the worker's own exit
    hook wrote that record. A forced kill on Windows is SIGKILL-equivalent and
    atexit cannot fire, so the supervisor must synthesize the crash row from
    the MISSING artifact instead.
  tags: [subprocess, pid-identity, uv-launcher-stub, venv, port-ownership, process-tree, self-kill, keep-list, type-coercion, windows, forced-kill, xref-01.04]
  legacy_id: BUG-LOCAL-229
- id: "09.08"
  phase: 9
  area: platform-portability
  symptom: |
    A capability probe reports a graphics backend unavailable on a machine
    whose GPU is healthy, so an acceleration path stays gated off for a reason
    that is not true. Separately, an encode smoke meant to measure pipe
    overhead dies at process start complaining about its output path, on a
    machine where the equivalent command typed by hand works fine. Both read
    as environment problems, and neither shows up as a failing test.
  cause: |
    The tooling carries Linux defaults into a Windows-only target. The
    headless-context helper is asked for an EGL backend because EGL is the
    documented headless path on Linux; on Windows the platform path is WGL and
    the EGL library is usually absent, so context creation fails and the probe
    reports a MISSING capability when the real fault is a WRONG REQUEST. The
    encode sink is handed the POSIX null device as an output path, but ffmpeg
    needs the null MUXER plus the platform's own null device name, and a Unix
    path is neither. One defect wearing two faces: a platform-specific
    constant written literally into code whose target platform is fixed and is
    not the platform the constant came from. Both stay invisible to a green
    suite, because a probe that answers not-available and a smoke that is
    skipped both look exactly like passing.
  fix: |
    Branch on the platform at the point the constant is chosen, and name the
    branch that was taken in the log. Ask for the platform's native context
    path first -- default/WGL on Windows -- and attempt a foreign backend only
    where it is actually relevant. Build a null sink from the null muxer plus
    the platform's device name taken from the standard library, never a
    hardcoded POSIX path. Then make the probe REFUSE with a distinguishable
    verdict instead of falling back quietly: backend absent and backend
    requested wrongly must not produce the same answer, or the wrong one gets
    believed and a working path stays switched off. Define what passing means
    before shipping the gate -- context creation, shader compile, framebuffer
    draw, non-zero readback, clean exit -- and run it in the same detached
    process shape the server uses, because a context that succeeds in an
    interactive session can fail in a detached one.
  verify: |
    Grep the shipped tree for platform-locked literals -- POSIX device paths,
    backend name strings -- and require zero hits outside one platform
    selection helper. Assert that helper directly on both branches by FAKING
    the platform rather than by skipping: on Windows it returns the native
    context path and the Windows null device, on POSIX the other pair. Run the
    probe detached on the target machine and require a non-zero readback, then
    force the foreign backend and require a DIFFERENT, named verdict rather
    than the same not-available. Run the null-sink smoke as a marked live test
    on the target OS, because a portability defect that only a skipped test
    would have caught is not covered at all.
  tags: [platform-portability, windows, gpu-context, egl-vs-wgl, null-sink, ffmpeg, hardcoded-constant, capability-probe, silent-fallback, skipped-test]
  legacy_id: KIBITZ-20260708-scope-accel
- id: "10.08"
  phase: 10
  area: procedural
  symptom: |
    A generated character is internally incoherent: a male-coded name on a
    female slot and a female-coded name on a male slot (MALIK HIBBERT voiced
    female, PHYLLIS OKAFOR voiced male). Nothing is red. No pool-exhaustion
    warning fires, the gender quota is exactly the requested split, and the
    VOICE follows the gender correctly every time -- only the NAME is wrong,
    and only on some seeds. Because the voice table is the last thing that
    touched gender, the investigation starts there and finds it innocent.
  cause: |
    Two correlated attributes of ONE entity are produced by two independent
    generators that never reconcile. The gender plan is bound to slots
    POSITIONALLY -- a quota computed, then shuffled across slots -- while the
    name is drawn from a flat, gender-blind pool. Each generator is correct in
    isolation and each is individually testable, so every per-generator test
    passes. Consumers that read the gender attribute (voice preset, age band)
    stay coherent; the consumer that reads the NAME is a human listener, who
    has no assertion. The pool-sizing audit that covers the neighbouring defect
    passes trivially here because supply was never the problem. Generalize:
    when attribute A and attribute B of the same entity come from separate
    draws, correctness of each does not imply coherence of the pair, and no
    test scoped to one generator can see the gap.
  fix: |
    Make one attribute authoritative and reconcile the other against it after
    both generators have run and BEFORE the entity is frozen. Partition the
    existing pool by the correlated attribute rather than authoring a second
    pool -- partition the SAME names so the flat pool stays byte-identical --
    add an explicit classifier for the attribute, and guard the partition
    against drift at import time so the two views cannot diverge later. Draw
    the repair from a per-entity ISOLATED rng seeded on the run seed plus the
    entity id, never from the main sequence: a repair that consumes from the
    shared rng reshuffles every downstream draw and takes any byte-identity
    contract with it. Exempt source-owned entities -- an adaptation's Sir Toby
    Belch is not a coherence defect, and renaming him to satisfy the rule loses
    the character the lane exists to perform. Finally, sync every parallel
    table that restates the same attribute; a stale descriptor table is a
    third, silent generator of the same fact.
  verify: |
    Sweep many seeds and require zero binary-gender slots carrying a name the
    classifier tags as the other binary gender. Pin a KNOWN-INCOHERENT seed and
    require the reconciliation to repair it, and pin a KNOWN-COHERENT golden
    baseline and require the entire cast byte-identical -- that pair is what
    proves the repair fires when needed and is a true no-op when not, so it
    cannot have perturbed the rng. Assert the repaired value is still unique
    within the ensemble, and that an explicitly named or source-owned entity is
    NOT renamed. Then disable the reconciliation and require the seed sweep to
    go red; a coherence test that stays green without the reconciler is
    measuring the generators, not the pair.
  tags: [cast, coherence, correlated-attributes, independent-generators, reconciliation, positional-binding, isolated-rng, byte-identity, golden-seed, xref-10.06]
  legacy_id: BUGLOG-L11-cast-coherence
- id: "10.09"
  phase: 10
  area: rng
  symptom: |
    A text normalizer is deleted as cosmetic dead code -- nothing consumes its
    output except a hash -- and every derived image in the pipeline changes.
    Not a cache miss to be re-warmed: different pictures. A re-render of an old
    episode no longer reproduces its artwork, and one character's face drifts
    across every scene that character appears in. Nothing errors, nothing logs,
    and the diff is a single deleted string cleanup, so the change under
    suspicion is never the one that moved the output.
  cause: |
    The cache key IS the RNG seed. The dedup key and the generator seed are
    both derived from the same prompt hash, so editing the key derivation does
    not merely miss the cache -- it MOVES the artifact. Worse, derived hashes
    CHAIN: a portrait's prompt hash is folded into every scene-character seed
    derived from that portrait, so one upstream prompt containing one stray
    character shifts every still downstream of it. The blast radius is not the
    row that changed. The general shape: any function whose output reaches both
    an identity and a generator input is a member of the determinism contract,
    however cosmetic its body looks, and "no reader" is false when the reader
    is a hash.
  fix: |
    Trace a normalizer's output FORWARD to every hash before editing or
    deleting it, and where that hash reaches a seed, say so at the definition
    so the next reader does not mistake determinism for formatting. If the two
    roles must move independently, separate them: derive the dedup key from the
    full prompt digest and the seed from a stable identity a prompt edit is
    allowed to leave alone. Do NOT launder the input back into its old shape to
    hold the seed still -- that restores the defect the normalizer removal was
    fixing. When the coupling is intended, and it usually is because a changed
    prompt deserves a new picture, the correct action is to DOCUMENT rather
    than to fix: write down, where an operator will look, that a prompt edit is
    a re-render and that pre-edit episodes are no longer reproducible.
  verify: |
    Pin the SEED, not merely the key: feed a fixed prompt through the shipped
    resolver and assert the exact integer, then change the normalizer and
    require the test to go red -- a determinism contract with no pinned value
    is not a contract. Assert the CHAIN explicitly: move one upstream prompt
    and require every seed derived from it to move while every unrelated
    object's seed stays put, so the blast radius is measured rather than
    assumed. Keep a fixed-seed lane as a control and require it not to move for
    any prompt. Finally, enumerate every function whose return value reaches a
    hash on a seed path and require each to carry the contract annotation, so
    the next reader inherits the tracing instead of repeating it.
  tags: [determinism, seed-derivation, prompt-hash, cache-key, derived-identity, hash-chain, blast-radius, apparent-dead-code, reproducibility, xref-12.55]
  legacy_id: KIBITZ-20260805-prompt-hash-seed
- id: "11.57"
  phase: 11
  area: llm-output-validation
  symptom: |
    A verbatim-grounding gate kills lane after lane at the first structured
    pass -- most of a campaign's P0 deaths -- and every reading of the evidence
    blames the model: it paraphrased, it quoted the wrong region, it invented a
    span. The prompt is rewritten, the validator is loosened, the retry ladder
    gains a rung, and the death rate does not move. The corpus looks clean when
    a human opens it, because the viewer renders the markup the ingest already
    discarded.
  cause: |
    The source payload was built by stripping HTML tags with ONE substitution
    to the empty string. Inline tags must vanish with no separator so that
    H<sub>2</sub>O and anti-<em>microbial</em> keep their literal spelling --
    but BLOCK tags carry the only sentence boundary those documents have, so
    the last word of one block welds to the first word of the next:
    Polygons</p><p>NASA/JPL- becomes PolygonsNASA/JPL-, of</li><li>Engine
    becomes ofEngine, .</p><p>Let's becomes .Let's. No model can quote a token
    that exists in no language, so a CORRECT verbatim quote is rejected as
    non-literal and the lane dies with the model blamed. The standard remedy
    for this family -- whitespace-normalize both sides of the comparison -- is
    inert here: there is no whitespace to collapse, the words are genuinely
    fused, and a pipeline in full compliance with the wrap-tolerant fix still
    dies exactly this way.
  fix: |
    Audit the payload BUILDER's block-boundary join before touching the model,
    the prompt, or the validator. Tag removal is two rules and never one: an
    explicit allowlist of block and break tags substitutes a SEPARATOR, and
    every remaining tag is removed without one. Then treat the change as what
    it is -- a coordinate migration. The normalized text is the sole coordinate
    system the source digest pins and that every accepted span offset is
    measured in, so widening what the stripper touches silently re-indexes
    already-accepted artifacts; keep the allowlist narrow, apply it upstream of
    the digest, and scope the migration to future payloads rather than
    rewriting frozen ones. Leave entity spellings to the downstream normalizer
    so exactly one component owns what a space is. Cross-reference the
    wrap-tolerant normalization entry in both directions: whitespace where
    there should be none and none where there should be whitespace are one
    subject, and a reader who has met only one polarity will re-derive the
    other the expensive way.
  verify: |
    Build the regression from the REAL payloads that killed the campaign, not
    from synthetic markup. Require every block boundary in them to survive as a
    separator AND require the inline counterfactuals to survive without one --
    H<sub>2</sub>O must come out H2O, never H 2 O. Assert the old catch-all
    substitution as an explicit counterfactual so the test names the defect it
    prevents. Prove the production call site reaches the new helper, then
    mutate that call site back to the old strip and require the wiring test to
    go red. Pin digest stability last: normalization must run BEFORE the
    digest, and two payloads differing only in what you now normalize must hash
    exactly as the migration intends.
  tags: [llm-output, text-ingest, html-stripping, block-boundary, separator, verbatim-grounding, source-payload, coordinate-system, digest-stability, counterfactual, xref-11.26]
  legacy_id: HANDOFF-L1580
- id: "11.58"
  phase: 11
  area: llm-output
  symptom: |
    Composed text comes back with a term doubled or compounded -- "hand
    grenade" arrives as "banana banana bomb" -- from a substitution table whose
    every row is correct when read alone and correct when tested alone. The
    table is already ordered longest-first and every pattern is word-boundary
    anchored, so the two defenses everyone reaches for are both in place and
    neither one is the defense this needs. Because the corruption only appears
    for inputs that contain one particular seeding term, a sample corpus can
    pass indefinitely while the table is broken by construction.
  cause: |
    The applier walks the rows IN ORDER and reassigns the working string on
    every row, so each row after the first reads text that earlier rows already
    rewrote. That makes the table a rewrite SYSTEM, not a lookup -- its input
    alphabet includes its own output alphabet -- and any row whose REPLACEMENT
    contains a later row's SOURCE will fire on the table's own product. In the
    incident, ("hand grenade", "banana bomb") sat above ("bomb", "banana
    bomb"), and the later row matched the earlier row's output. Longest-first
    ordering does not help, because it defends source-against-source overlap
    and says nothing about a source appearing inside a replacement.
    Word-boundary anchoring does not help either, because the replacement
    introduces a boundary-complete occurrence of the term. The whole cascade
    completes inside ONE application, so reasoning that starts from "we only
    call this once" concludes wrongly that it is safe.
  fix: |
    Stop feeding the table its own output. Preferably apply it as a SINGLE
    non-overlapping sweep over the ORIGINAL text -- build one alternation of
    every source, longest-first, and pass one replacer function to a single
    substitution call, so the scan advances past each replacement and no output
    is ever re-read. That converts the table from a rewrite system back into a
    lookup, and ordering then resolves ambiguity only, never cascade. If
    sequential application must stay, make CLOSURE an explicit written contract
    of the table -- no replacement string may match any row's source under the
    applier's own matcher -- and enforce it as a standing test, because closure
    is an obligation every future row has to re-earn while a single sweep is
    structural and earns it once. Either way, state the invariant next to the
    table so the next author adding a row knows what they are promising.
  verify: |
    Test the TABLE, not a corpus. For every ordered pair of rows, run row j's
    exact production matcher -- same escaping, same boundaries, same case
    folding, built by the same code path the applier uses -- against row i's
    replacement string and require no match, so the test can never pass on a
    stricter matcher than the one that ships. Then assert single-application
    correctness on the known cascade seeds by exact equality, not containment:
    "hand grenade" must yield exactly "banana bomb". Assert the fixed point is
    reached in one pass by feeding every source AND every replacement back
    through and requiring apply(apply(x)) to equal apply(x). Finally add a row
    that deliberately violates closure and require the table test to go red;
    a closure test that stays green when closure is broken is not a test.
  tags: [llm-output, rewrite-table, ordered-substitution, closure-under-own-output, single-pass-sweep, idempotence, word-boundary, table-contract, property-test, mutation-check]
  legacy_id: KIBITZ-20260806-banana-route
- id: "11.59"
  phase: 11
  area: llm-output-validation
  symptom: |
    One beat silently produces no image. Nothing raised, nothing crashed, the
    episode completed -- there is simply a hole where a still should be. The
    log shows a path-detection guard fired and skip evidence was recorded, and
    the prompt named in that evidence is ordinary prose: a character wearing "a
    black/white striped scarf", a scene at "the corner of 5th/Main". The same
    prompt is clean on a POSIX box, so the defect is invisible to anyone not
    running the shipping platform.
  cause: |
    The "is this a path?" test was assembled out of characters that are LEGAL
    INSIDE CONTENT -- os.sep in the string, or os.altsep in the string, or an
    image extension at the end. On Windows os.altsep IS the forward slash, so
    that predicate rejects any prose containing a slash: a costume description,
    an intersection, a fraction, an "and/or". The guard's actual job is a
    socket-crossing check, and a crossed socket delivers a value that IS a
    path, never prose that merely CONTAINS one, so substring containment was
    the wrong shape of question from the start -- it asks whether the text
    mentions a separator when the claim under test is whether the whole value
    is a path. The cost was total rather than cosmetic because the guard's
    disposition was skip-and-continue: a false positive spent a render and left
    a missing artifact as its only symptom. Producers then grew local
    sanitizers to launder slashes out of prose, which is the worse repair --
    laundering a REAL path converts the guard's one true positive from a loud
    refusal into a quiet garbled render.
  fix: |
    Never build a content-versus-path discriminator from characters that are
    legal inside content. Discriminate on the SHAPE OF THE WHOLE VALUE:
    anchored, ordered most specific first -- drive root, UNC root, POSIX root,
    file URI, explicit relative, and a whitespace-free string ending in an
    image extension -- and rule that prose containing a separator is CLEAN.
    Note the same rule settles the extension case: "host.png" is a filename,
    "a portrait of the radio host.png" is a sentence, and whitespace is what
    tells them apart. Delete the producer-side sanitizers in the same change
    rather than adding another; laundering the input to satisfy a bad guard
    destroys the only true positive the guard exists for. Make the rejection
    observable: a guard that fires must raise, or record a named structured
    verdict carrying the arm, the offending token, its index, an excerpt and
    the canonical content hash that joins the ledger row -- never a bare
    continue. And treat platform constants that are None on one OS and
    meaningful on another as platform FACTS to be read and pinned, not as
    harmless spellings.
  verify: |
    Pin the platform fact first -- assert that on this OS os.altsep is the
    forward slash -- so the test says out loud why it exists. Then feed the
    incident prose through and require BOTH that the guard returns clean and
    that the dispatcher actually mints the still; asserting only that the
    predicate returned None proves nothing about the artifact. Sweep every arm
    with a genuine path and require the exact arm name back, so widening for
    prose did not also reopen the socket-crossing hole: a drive-rooted path, a
    UNC root, a POSIX root, a file URI, an explicit relative, and a bare
    filename must each classify, while a sentence ending in an image extension
    must not. Force one true positive and require the recorded evidence to
    carry the arm and the joining hash, and require the render count to drop by
    exactly one with a named reason rather than silently. Then restore the
    substring predicate and require the prose case to go red.
  tags: [llm-output, path-guard, os-altsep, windows, whole-string-classification, discriminator, false-positive, silent-skip, missing-artifact, observable-refusal, socket-crossing, mutation-check]
  legacy_id: KIBITZ-20260805-bug-sprint-path-guard
- id: "11.60"
  phase: 11
  area: source-selection
  symptom: |
    Sibling outputs derived from a single call disagree with each other. An
    adapted scene quoted one identical mid-passage on every beat, so no beat
    ever saw the opening or the ending; in a neighbouring size band some beats
    kept their own region while their siblings collapsed to the whole body, so
    starts were unsorted and duplicated and the arc could run BACKWARDS -- beat
    6 of 7 quoting the opening while beat 3 quoted later material. Every window
    is legal read alone, so no per-item assertion can see it; only the family
    is wrong. The band is narrow and perfectly deterministic -- roughly 741
    (length, beat-count) pairs in ordinary short-story territory -- so it
    reproduces every time and no test happened to land inside it.
  cause: |
    The degradation decision -- "this work is too short to slice, fall back to
    the whole body" -- was evaluated PER KEY, inside the loop, against that
    key's own bucket. Integer division makes bucket sizes differ by one
    character, so when total divided by key count sits near the floor some
    buckets clear it and their siblings do not, and the threshold flips item by
    item instead of once for the family. The invariants that matter here --
    disjointness, sorted starts, monotonic progression -- are properties of the
    SET, and no member can hold them; nothing in the loop was computing the set
    at all. A second failure hid inside the same fallback: it offered only two
    cases, slice or show-everything, so a work too short for floor-sized
    disjoint regions but too long to show whole fell through to a single shared
    window for every key. A sibling module already decided this once up front;
    this one had diverged from that pattern and reintroduced the bug it avoids.
  fix: |
    Decide a degradation ONCE, before the loop, from family-level inputs --
    total length, key count, floor -- and pass the decision in. The loop may
    only apply it, never re-derive it. Then fill the case the two-way fallback
    left open: a work too short to slice but too long to show whole gets
    SLIDING overlapping windows, offset across the room the budget leaves, so
    progression survives even where disjointness cannot. Name the collective
    invariants explicitly and assert them on the RETURNED FAMILY rather than on
    its members. Do not mistake sharing for the defect: when the whole work
    genuinely fits one window, every key seeing all of it is correct -- a
    single short scene is the material for every beat in it. The defect is
    siblings DISAGREEING. When a neighbouring module already makes the same
    call once up front, adopt its shape instead of writing a second one.
  verify: |
    Sweep the integer-division band exhaustively instead of sampling it: for
    every (total length, key count) pair straddling the floor -- the incident's
    band was about 741 of them -- build the family and assert the collective
    invariants every time, that starts are strictly increasing, that no two
    keys share a start, that every window lies inside the body, and that either
    all keys collapsed or none did. Assert STATICALLY that the decision is
    computed once above the loop and appears exactly once in the shipped
    source, so a later edit cannot quietly move it back inside. Regress the
    sliding case on the real incident shape -- 14 beats over an 1,116-character
    scene must yield 14 DISTINCT windows, the first touching the opening and
    the last touching the ending -- and require the distinct-window count to
    equal the key count. Then move the decision back inside the loop and
    require the band sweep to go red.
  tags: [derived-slices, per-item-vs-collective, degradation-threshold, integer-division, off-by-one, boundary-band, collective-invariant, monotonic-progression, sibling-divergence, source-window, exhaustive-sweep, static-assertion, mutation-check]
  legacy_id: GITFIX-cdf8bffb
- id: "12.75"
  phase: 12
  area: rewrite-dropped-quality-input
  symptom: |
    A generation subsystem is rewritten rather than edited. Renders still
    succeed, the suite stays green, no reference dangles, no import breaks --
    and the operator says the output looks flatter than a build from weeks ago,
    naming a specific saved artifact as the reference. The obvious knobs are
    checked first and they all match: same checkpoint, same steps, same cfg,
    same sampler. Because every parameter that LOOKS like a parameter agrees,
    the investigation concludes nothing changed and starts blaming the model,
    the prompt text, or the operator's memory.
  cause: |
    A rewrite is an insertion plus a deletion, not an edit, so there is no
    line-level diff between the old behaviour and the new one to read. The
    inputs that survive a rewrite are the ones that look like inputs -- a
    widget, a named argument, a config key. The quality-BEARING inputs do not
    look like inputs, so they are the ones that vanish: a graph node that was
    never a workflow widget and existed only as a wire inside the internally
    built graph (here a guidance node at 3.5 between the positive encode and
    the sampler; grep for guidance in the new engine returns nothing at all);
    prompt suffixes that lived as module-level string constants appended to
    every prompt; and a fixed seed pinning one deterministic asset. Nothing
    references them any more, so every dead-reference scan, cross-import check
    and AST parse stays green -- the absence is invisible precisely BECAUSE it
    is complete. The pipeline keeps producing output, so nothing goes red.
  fix: |
    Before deleting the old implementation, enumerate its EFFECTIVE inputs
    rather than its declared parameters. Walk the graph it constructs node by
    node and record every node that carries a value; record every module-level
    string constant that is appended or prepended to a prompt; record every
    literal seed. Put that inventory in the change itself and tick each item
    against the replacement. Treat an input with no widget as HIGHER risk than
    one with a widget, because nothing in the UI or the JSON will ever remind
    you it existed. Port each recovered value as a named constant with an env
    override rather than inlining it, so a future disappearance is greppable.
    Keep the old implementation's last commit reachable: the saved
    widgets_values in a HISTORICAL commit of the workflow JSON may be the only
    surviving record of values that never lived in code at all.
  verify: |
    Diff INVENTORIES, not files. Assert statically over the graph the new
    engine builds that each recovered lever is present and positioned -- the
    guidance node exists, sits between the positive conditioning and the
    sampler, and the sampler reads the GUIDED conditioning rather than the raw
    encode. Assert each restored prompt suffix appears in the composed prompt,
    in the correct layer order, and ONLY on the paths meant to carry it;
    scoping is part of the contract, and a tail appended everywhere is a
    different regression wearing the same fix. Pin the deterministic seed by
    value and prove its env override. Then A/B against a PRESERVED reference
    artifact from the good build, because this class has no red test to offer:
    when the pipeline strips its own output metadata, the archived reference
    plus the source is the entire ground truth. Archive that reference BEFORE
    the rewrite, not after you need it.
  tags: [subsystem-rewrite, silent-input-loss, no-dangling-reference, graph-node-not-widget, prompt-suffix-constant, deterministic-seed, look-regression, reference-artifact-ab, historical-widgets-values]
  legacy_id: BUG-LOCAL-411
- id: "12.76"
  phase: 12
  area: cleanbreak-default-parity
  symptom: |
    A cleanbreak removes a legacy path and a newer engine for the same model
    family takes over. Everything still runs, the suite is green, and the
    workflow JSON is byte-identical before and after. Weeks later the operator
    says the output was better in an earlier era and names two reference clips
    from that era. There is no diff to point at: the JSON did not change and
    the deleted module is gone from the tree, so the natural first move --
    diff the workflow -- returns nothing, and the investigation stalls on the
    belief that no configuration changed.
  cause: |
    The tuning did not live where tuning is normally looked for. The saved
    workflow widgets carried only the mundane values (a seed, an encode
    method, a duration cap) while the sampler, the step count, the CFG, the
    conditioning strength, the render dimensions and the loop treatment were
    all CODE defaults inside the deleted module. The replacement is a
    different implementation of the same model family, so it ships its own
    defaults -- each individually defensible, all of them different. A
    cleanbreak therefore rewrites BEHAVIOUR without rewriting CONFIGURATION,
    and every habitual diff target (workflow JSON, requirements, node
    registrations) stays clean. The drift compounds quietly: one replacement
    default was left at a placeholder with a code comment admitting the
    correct value and promising a sweep that never ran.
  fix: |
    Capture the doomed component's effective defaults as a golden recipe
    BEFORE deleting it -- read them out of the source at the last commit that
    still has it, and write them into the change as data, one named constant
    per value, not as prose in a commit message. Make parity against that
    recipe an explicit acceptance criterion of the cleanbreak, and where a
    value must legitimately differ, say in the code WHY and against what
    measurement. Never land a default as a placeholder with a comment
    promising to fix it later; a comment is not a task and outlives the person
    who wrote it. Record the CONDITIONS a value was measured under alongside
    the value, because a conditioning strength tuned at one canvas is a
    different strength at another, and a recipe copied without its conditions
    reproduces the number while losing the result.
  verify: |
    Assert each recipe value in the replacement by name against the captured
    golden constant, in a test that names the deleted implementation and the
    commit the value was read from, so provenance travels with the assertion.
    Make every knob env-overridable and exercise the override path, so an
    operator can A/B a candidate without a code change. Then require the human
    comparison the numbers cannot substitute for: re-render the same asset and
    put it beside a preserved artifact from the good era. Finally, mutate one
    recipe value and require the parity test to go red -- a parity test that
    merely reads the new engine's own defaults and compares them to themselves
    is asserting nothing, and will stay green through the next regression.
  tags: [cleanbreak, recipe-in-code, default-parity, deleted-implementation, golden-recipe, unchanged-json-unchanged-behaviour-fallacy, placeholder-default, measurement-conditions, look-regression]
  legacy_id: BUG-LOCAL-412
- id: "12.77"
  phase: 12
  area: environment
  symptom: |
    A tooling or test step that writes a scratch file works for months, then
    starts failing on one machine only. The traceback is OSError Errno 22,
    Invalid argument, raised by open() itself -- before a single byte is
    written, and with mode wb. Cleanup fails too: unlink raises
    PermissionError saying the file is in use by another process. Re-running
    sometimes succeeds, so the failure reads as flakiness and invites a retry
    loop or a skip marker instead of a diagnosis.
  cause: |
    The scratch file was written inside a cloud-synced tree (OneDrive,
    Dropbox, Google Drive) or another externally watched directory -- a backup
    agent, a search indexer, an antivirus scanner. Size is the trigger: a
    multi-megabyte file takes long enough to upload that the sync client still
    holds a handle when the next run re-opens the path. On Windows, opening an
    existing file for truncating write must first shrink it, and that
    operation is refused while another process holds the file -- so the error
    surfaces at OPEN, which is why write-time error handling never sees it and
    why switching to wb changes nothing. The errno is misleading: the argument
    is fine, the file is busy. Because the outcome depends on sync timing, the
    failure is intermittent, machine-specific, and absent from CI.
  fix: |
    Move the scratch file out of the observed tree. Write large or frequently
    rewritten temporaries to the OS temp directory, and expose the location as
    an env-overridable setting so the convenient in-repo default survives for
    manual use while automation points somewhere unsynced. Where a file
    genuinely must live in a synced tree, never truncate in place -- write a
    fresh sibling and rename it over the target, because rename is atomic and
    does not require shrinking a held file. Wrap open and unlink on such paths
    in a bounded retry with backoff and treat OSError and PermissionError as
    one transient class. Do not call a sync-client exclusion the fix: an
    exclusion is host configuration that no clone and no new machine inherits.
  verify: |
    Assert the PATH, not the outcome. Take the temp location the tooling
    actually resolves and require it to lie under the OS temp directory and
    outside every synced or watched root, and prove the env override is
    honoured rather than trusting the default to be read. Prove the
    write-then-rename path by holding an open handle on the target and
    requiring the write to still succeed. Prove the retry by making the first
    open fail and requiring a second attempt, and require it to give up loudly
    with the real path in the message rather than spinning. Then run the tool
    twice back to back with a payload large enough to still be syncing on the
    second pass -- a small-file test passes cleanly against a broken
    implementation, which is how this shipped in the first place.
  tags: [cloud-sync, onedrive, windows, file-lock, truncating-open, errno-22, permission-error, temp-file-placement, write-then-rename, bounded-retry, machine-specific-flake]
  legacy_id: BUG-LOCAL-293
- id: "12.78"
  phase: 12
  area: testing
  symptom: |
    A cluster of tests fails in the full suite and every one of them passes
    when its own file is run alone. The error names a missing attribute on a
    host module that none of the failing tests mentions -- module folder_paths
    has no attribute get_filename_list -- raised from a node the failing file
    never imports. Run the failing file first and the failures move somewhere
    else. The suite looks nondeterministic, so the reflex is to mark the tests
    flaky, pin an order, or rerun until green, and the real defect survives
    every one of those remedies.
  cause: |
    sys.modules is one process-global namespace shared by every test in the
    run. Several test modules each install their own stand-in for a host
    module at IMPORT time, each guarded by an if-not-already-present check, so
    whichever file pytest collects first wins and the rest become no-ops. Each
    stub carries only the attributes its own author needed, so the winner is
    PARTIAL -- and a partial stub is worse than no stub. With nothing
    installed, the module under test fails to import, the code that enumerates
    it silently drops it from the set under test, and nothing runs and nothing
    fails. With a partial stub the import SUCCEEDS, execution reaches the
    attribute nobody supplied, and the failure lands in an unrelated test that
    merely happened to be collected later. Collection order is a function of
    file names and selection, which is why the symptom moves whenever the
    suite changes shape.
  fix: |
    Give the process-global namespace exactly one owner. Install a single stub
    in conftest, before any test module is collected, and make it carry the
    COMPLETE surface the code under test touches -- not the subset the first
    author happened to need. Leave the per-module guards in place as harmless
    no-ops so a file can still be run standalone, but stop treating them as
    the installation point; when the stub must grow, grow the canonical one.
    The same single-owner rule governs every other process-global a test can
    mutate: environment variables, working directory, warning filters,
    logging configuration, and any registry or mapping dictionary the host
    exposes. One owner, installed once, torn down deterministically.
  verify: |
    Prove ownership, not luck. Assert that the canonical stub exposes every
    attribute the production import path calls, enumerated FROM THE SOURCE
    rather than from memory, so a new call site fails one focused test instead
    of nine scattered ones. Assert that the module under test imports
    successfully under that stub, and that the enumerator actually lists it,
    because a silently dropped module is the exact state this defect hides
    behind. Then attack the order: run the suite with collection reversed and
    with a shuffled seed and require the same result, since green in isolation
    is not green. Finally, remove one attribute from the canonical stub and
    require the suite to go red; if everything stays green, the stub you are
    maintaining is not the stub the tests are using.
  tags: [sys-modules-pollution, process-global-state, partial-stub, conftest-ownership, order-dependent, green-in-isolation, silent-skip, collection-order, test-infra]
  legacy_id: BUG-LOCAL-251
- id: "12.79"
  phase: 12
  area: gate-input-population
  symptom: |
    An operator adds a new module or test file, runs the pre-commit gate --
    forbidden-identifier sweep, lint, license scan -- and gets green. The
    commit then turns HEAD red, naming a violation in a file that had been on
    disk and passing for days, on a commit that changed nothing about the gate
    or its rules. Because the failure surfaces at commit time, the
    investigation blames the commit's other content or the CI runner rather
    than the gate, and the same file will pass green again the moment it is
    untracked. This one cost two separate red HEADs, the second diagnosed from
    scratch by someone who then found it already written down.
  cause: |
    The gate builds its input from a version-control delta -- git diff against
    a baseline -- and a diff covers TRACKED files only. An untracked file has
    no index entry, emits no hunks, and contributes zero lines to the sweep,
    so the gate is green for exactly as long as the offending code stays
    untracked. Git add is what makes the file visible, which is why the first
    commit both admits the file and trips the gate, pointing the investigation
    at the wrong change. The general defect is that the gate's input
    population is narrower than the population the commit will carry. Any
    selector derived from VCS state -- diff, index, changed-files list,
    files-touched-in-this-PR -- is a different set from the shipped source
    tree, and the gap is silent: a gate that swept nothing reports the same
    green as a gate that swept everything and found nothing.
  fix: |
    Make the gate walk the set the commit will carry -- tracked plus
    untracked-and-not-ignored -- rather than a VCS delta. Where the checker's
    parser genuinely needs diff shape, synthesize it: enumerate untracked
    files with git ls-files --others --exclude-standard and render each as an
    added-file hunk. Emit the COMPLETE hunk shape, header included; a plus
    line outside any hunk header is silently dropped by the diff parser, which
    yields input that looks perfectly correct and sweeps nothing. The
    --exclude-standard flag honours .gitignore, so scratch trees stay out
    without a second exclusion list. Scope the addition repo-wide rather than
    to a couple of directories: an untracked listing never returns the
    untouched tracked tree, so narrowing it buys no speed and leaves runtime
    code under config, scripts and the repo root blind. Fail loud -- a git,
    read or decode error inside the input builder must raise, never return an
    empty string, because silently sweeping nothing is the exact failure being
    closed.
  verify: |
    Plant a file containing a known-forbidden identifier, leave it UNTRACKED,
    and require the gate to go red; remove it and require green. That single
    test is what distinguishes a gate that sees the working tree from one that
    sees only the index, and a suite exercising tracked files alone cannot
    make the distinction at all. Assert the collected input is non-empty and
    carries a well-formed hunk header for every synthesized file, then assert
    the exact hit count for the planted file rather than merely that it is
    non-zero, so a parser that never enters a hunk fails instead of passing
    quietly. Assert an ignored path is absent from the collected set, and that
    a failing git invocation raises rather than yielding an empty sweep.
  tags: [false-green, gate-scope, untracked-files, git-diff, input-population, pre-commit, fail-loud, static-analysis, all-route]
  legacy_id: HANDOFF-L2291
- id: "12.80"
  phase: 12
  area: concurrency
  symptom: |
    Two agent windows work the same checkout at the same time. One commits a
    documentation change; the push reports success in that window, and origin
    is left broken -- carrying deletions the OTHER window had staged but not
    finished, or an untracked scratch file the neighbour had not decided to
    keep. Here the swept deletions removed an adapter module while the
    registry it fed kept declaring five engines, so the remote roster audit
    read missing equals four against a floor of thirty, and origin stayed red
    about ninety minutes. The committing window's own diff review looked
    clean, because it reviewed its own edits rather than the index.
  cause: |
    The git index is process-global state belonging to the working tree, not
    to a session. Anything one window stages -- git rm, git add -A on a
    directory, any early git add -- sits in the same index every other window
    commits from, and a commit is defined by the index, so the first window to
    commit carries away whoever else's staged work is sitting there. An -A add
    additionally sweeps the neighbour's UNTRACKED files under that path.
    Neither window sees an error: staging takes no lock and raises no
    advisory. The result is an internally inconsistent commit -- half of a
    two-file change, a deletion without its registry edit -- which is
    syntactically valid, passes local review, and lands on the REMOTE past the
    point where the author would look. The window that caused it has already
    reported success and moved on.
  fix: |
    On a shared tree, treat staging as part of the commit rather than a
    preparatory step: stage NOTHING until your own commit moment, and stage by
    explicit pathspec -- name the files -- never git add -A or git add dot,
    and never an early git rm held across other work. If deletions must be
    planned ahead, record the paths in a note and run the removal inside the
    same minute as the commit. Read git status --short as a whole immediately
    before committing and treat any staged entry you did not just create as
    another actor's work: stop and reconcile instead of committing over it.
    Where two agents genuinely must write at once, give each its own worktree
    so the indexes are physically separate and the shared-state question
    disappears.
  verify: |
    Assert the commit's file list equals the pathspec you intended, read from
    the commit itself rather than from memory of the edit: git show --stat
    HEAD must contain exactly your files and nothing else, and in particular
    no deletions you did not author. Then verify the PUSHED state rather than
    the local one -- fetch, confirm origin HEAD matches local HEAD, and run
    the repo's own cross-file consistency checks against the fetched tree:
    registry roster count, import resolution, AST parse. A mixed commit is
    valid Python and only a cross-file invariant will name it. Keep those
    floors as real numbers, so a registry that quietly loses members fails an
    assertion instead of degrading into a smaller but still plausible roster.
  tags: [concurrency, shared-index, multi-window, git-add-all, pathspec, staged-state, cross-file-invariant, remote-verification, all-route]
  legacy_id: HANDOFF-L206
- id: "12.81"
  phase: 12
  area: module-reload-class-identity
  symptom: |
    A test passes eleven of eleven alone and fails when it runs right after a
    sibling test file. Same code, same machine, same seed -- the verdict depends
    on collection order. The failure looks impossible: an exception escapes a
    handler that plainly names its class, or an isinstance check returns False
    against an object whose repr matches exactly. Because a targeted rerun of
    the failing file is green, the red line gets re-diagnosed as a flake by
    every person who meets it, and full-suite ordering can hide it for weeks
    between rediscoveries.
  cause: |
    An earlier test called importlib.reload on a shared module. Reload
    re-executes the module body and REBINDS its names to NEW objects, so the
    reloaded class is a different object from the same-named class imported
    before it. Every symbol captured earlier still points at the old object:
    except clauses the sibling file bound at COLLECTION time, isinstance checks,
    registry keys, sentinel classes, cached type maps. After the reload the
    module raises instances of the new class and the old handler no longer
    matches, so the exception sails straight past a correct-looking except.
    Nothing is logged, and no fixture can undo it -- teardown cannot un-rebind a
    class object that other modules already hold. The general shape is
    in-process module surgery that mutates state outliving the test which
    performed it, where the damage is visible under one file ordering only.
  fix: |
    Do not reload modules in-process. When the property under test genuinely
    requires a fresh import -- proving an import is lazy, proving no file is
    read at import time -- run it in a SUBPROCESS, so whatever it does to class
    objects cannot reach the parent interpreter. Pass the repo root as argv
    rather than interpolating it into a -c source string, because a Windows path
    is full of backslashes and every one of them would need escaping. Install
    the probe's guard inside the child: pytest monkeypatch is in-process and
    does not cross the boundary. Scope that guard to the repo under test -- a
    blanket ban on Path.read_text trips third-party import machinery reading its
    own packaging metadata, which tests the interpreter rather than your module,
    and only shows up in a fresh child because the parent had already
    initialised it. If a reload is truly unavoidable, re-import every captured
    symbol afterwards and accept that symbols other modules already bound are
    beyond your reach.
  verify: |
    Assert class identity across the test itself: capture the class before, and
    afterwards assert the module attribute IS that same object. That is the real
    invariant, and it fails on the reload directly instead of waiting for a
    sibling file to trip over it. Then run the suite in BOTH file orders and
    require both green -- one order passing is precisely the evidence that
    misled the previous investigation; here one order was a failure and the
    other was eleven of eleven, and both orders became twenty-eight of
    twenty-eight once the reload left the process. Assert the subprocess
    contract explicitly: exit code zero AND a marker string in its stdout, so an
    early exit cannot pass as success, under a timeout whose failure message
    carries the child's stdout and stderr. Treat any test that passes alone and
    fails adjacent to a sibling as module-state contamination and go find the
    writer, never as a flake to retry.
  tags: [test-isolation, importlib-reload, class-identity, order-dependent, module-state, subprocess-isolation, except-clause-mismatch, false-flake, all-route]
  legacy_id: HANDOFF-L1070
- id: "12.82"
  phase: 12
  area: hygiene
  symptom: |
    Every git status reports thousands of untracked files -- 6,308 files and 272
    MB here -- so nobody reads it any more. Genuine untracked work hides in the
    noise, the post-push lockstep verification that depends on a clean status
    becomes useless, and an agent reading status output either truncates it or
    reasons over a sample. The .gitignore that was supposed to cover the scratch
    directory contains a rule that LOOKS like it covers it, and reviewers have
    read past that rule repeatedly without seeing anything wrong.
  cause: |
    The ignore pattern is a near-miss on the real path. A rule of the form
    /tmp_* anchors at the repo root and matches the PREFIX tmp_, so it caught
    the 93 MB tmp_audit_results.json at the root and never matched the tmp/
    DIRECTORY sitting beside it, which has no underscore. Git reports nothing:
    a pattern with zero effect and a pattern doing its job are indistinguishable
    from the file, and the author's evidence that it works is usually the single
    path they happened to test. The general class is that an exclusion rule is a
    silent contract whose correctness cannot be inferred by reading it -- a
    leading slash anchors to the repo root, a TRAILING slash is what restricts a
    rule to directories, a star does not cross a path separator, and a prefix
    pattern is not a directory pattern. The same file carried two earlier
    near-misses of this same class, so it recurs rather than being a one-off.
  fix: |
    Prove every exclusion rule fires against a real path instead of trusting the
    glob. Add the directory form explicitly -- /tmp/ alongside /tmp_* -- and
    leave a comment naming which path the old rule missed and why, so the next
    author does not have to re-derive it. Prefer one rule per intent over a
    clever pattern meant to cover both a file family and a directory at once;
    the clever pattern is what fails silently. Remember that an ignore rule does
    not affect TRACKED files: anything already committed under the newly ignored
    directory keeps reporting its modifications exactly as before, which is
    correct behaviour and must not be "repaired" by removing those files from
    the index in the same change.
  verify: |
    Run git check-ignore -v on a concrete path inside the directory and require
    it to print the rule and the line number that matched. A rule matching
    nothing prints nothing and exits non-zero, which is the falsifiable signal;
    do this once per directory the rule claims to cover. Then measure the
    population before and after: count entries from git status --porcelain and
    require the untracked count to fall to a small reviewable number -- 6,308
    down to ten here -- while requiring the count of TRACKED modifications to be
    unchanged, which proves the rule removed noise rather than history. Keep the
    untracked-count check in the hygiene suite with a real ceiling, so the next
    scratch directory is caught by a number instead of by somebody's patience.
  tags: [hygiene, gitignore, exclusion-pattern, silent-no-match, git-check-ignore, untracked-noise, tracked-vs-ignored, near-miss-glob, all-route]
  legacy_id: KIBITZ-20260805-gitignore-tmp-directory-miss
- id: "12.83"
  phase: 12
  area: unescaped-content-in-the-evidence-stream
  symptom: |
    The log reads as well-formed and tells a lie. A record nobody wrote appears
    in it -- a plausible WARNING or SKIP line, correctly shaped, at column zero
    -- or a guard's evidence line arrives split across several records, so the
    field a reader greps for lands alone with no context and the surrounding
    detail looks like it belongs to a different event. Line counts drift, a
    log-scraping regression asserts against a record the writer never emitted,
    and the operator reconstructs a sequence of events that did not happen.
    Nothing raises. The stream is syntactically perfect.
  cause: |
    A free-form value -- an LLM-authored prompt, an episode title, an exception
    message, a filename -- is interpolated into a line-delimited record without
    escaping. The stream's record separator is the newline, and the content is
    permitted to contain newlines, so the CONTENT CAN EMIT THE SEPARATOR.
    Everything after an embedded newline becomes, to every reader of that
    stream -- grep, the harness, the operator's eye -- a record of equal
    standing to the ones the program wrote. Carriage returns, ANSI escapes and
    the format's own field delimiter do the same one level down, forging FIELDS
    instead of records. The bug is invisible in normal operation because
    well-behaved content carries no separator; it surfaces exactly when content
    is hostile or merely unlucky, which for model-authored text is routine.
    Truncation is not a mitigation -- an excerpt like prompt[:200] changes WHICH
    forged text lands in the log, not whether it can, and it hides a late match
    entirely.
  fix: |
    Escape on the WRITER side, at the instant the value enters the stream, never
    on the reader side -- a reader cannot un-forge a record it has already been
    handed as fact. In Python that is repr: interpolate value!r so newlines,
    carriage returns, tabs and control characters become two-character sequences
    that cannot terminate a record, and keep the quotes it emits, because they
    also mark where the untrusted span begins and ends. Escape EVERY free-form
    field, including the ones that cannot contain a newline -- exception text,
    paths, model ids -- since the value that surprises you is the one nobody
    audited. When a reader needs the whole value, do not widen the excerpt:
    write it to a side file and log the path plus a hash. Center any excerpt on
    the index that matters rather than on offset zero, and name which arm
    matched, so the line is diagnostic as well as safe.
  verify: |
    Push a value carrying a newline, a CRLF, a tab and a convincing fake record
    prefix through the real logging call, then COUNT RECORDS in the emitted
    stream and require exactly one -- counting characters proves nothing here.
    Assert the fake prefix appears inside the escaped span, not at column zero
    of a new line. Feed the same stream to the parser or grep the harness
    actually uses and require it to find one record with the injected text in
    the field it belongs to. Keep a control case of ordinary content and assert
    escaping left it readable, so the remedy cannot pass by making every line
    useless.
  tags: [logging, log-record-forgery, untrusted-content, repr-escape, record-separator, writer-side-escaping, evidence-stream, llm-authored-text, telemetry]
  legacy_id: KIBITZ-20260804-log-record-forgery
- id: "12.84"
  phase: 12
  area: powershell
  symptom: |
    A CLI run launched from PowerShell dies before it does any work, with
    "error: unrecognized arguments:" followed by a fragment the operator
    recognizes -- the tail of an episode title and the whole prompt behind it.
    The identical command with a different title runs fine, so the failure looks
    like a flake. Then the sibling invocation that DID start is found carrying
    the wreckage as canonical state -- episode_title='SPAN_TE_PI;LLA28' on the
    ledger writer's start line, and the same mangled fragment slugged into the
    run's own artifact filenames. A quoting accident has become permanent data
    that no later run will question.
  cause: |
    A free-text value was placed on a command line. PowerShell and cmd parse the
    line BEFORE the process exists: a semicolon ends a statement, ampersand and
    pipe chain, dollar expands, backtick escapes, and unquoted whitespace splits
    one intended argument into several. By the time argparse sees argv the
    damage is done and is not recoverable -- argparse can only report the tail
    it did not recognize, which is why the error names the Python script and
    sends the investigation to the parser instead of the launcher. Two harms
    compound. The split kills one run loudly; where a sibling invocation happens
    to survive it, the truncated or metacharacter-bearing fragment is accepted
    as the real value and written into filenames, ledger keys and telemetry, so
    a transient shell event turns into durable corruption. Title, premise and
    prompt are the three fields most likely to carry a separator, because they
    are the three authored by a human or a model rather than by the program.
  fix: |
    Stop putting free text on a command line. Pass variable-length,
    human-or-model-authored values through a file, stdin, or an environment
    variable and keep only fixed program-authored tokens in the argument vector
    -- --brief-json C:\runs\brief.json cannot be split by anything. Where an
    argument genuinely must be passed, BUILD THE INVOCATION AS AN ARRAY and hand
    it to the process without a shell (subprocess with a list and shell=False;
    from PowerShell the call operator with an array, or --% to stop parsing), so
    no parser gets a second look at the string. Never assemble a command by
    string concatenation, and never rely on the caller to have quoted correctly.
    Then close the second harm separately from the first: validate the value at
    the receiving boundary and refuse or normalize shell metacharacters in any
    field destined for a filename, a ledger key or a persisted title, so a
    mangled value fails loudly on arrival instead of being adopted as truth.
  verify: |
    Launch through the real launcher with a value containing a space, a
    semicolon, an ampersand, a dollar sign and a backtick, and assert the
    program receives that value in ONE argv element, byte-identical to what was
    handed in -- have the entry point echo what it received and diff it against
    the source, rather than accepting "it started" as proof. Then assert
    PERSISTENCE, not just startup: read the value back out of the ledger, the
    log line and the output filename and require all three to match the
    original. Keep the hostile string as a fixture so a future rewrite of the
    launcher cannot quietly reintroduce concatenation.
  tags: [powershell, shell-tokenization, argument-quoting, argparse, free-text-argument, metacharacter, launcher, durable-corruption, stop-parsing, all-route]
  legacy_id: RUNLOG-20260723-span-lla28
- id: "12.85"
  phase: 12
  area: zero-consumer-declaration-integrity
  symptom: |
    A scripted repo-wide refactor lands and everything agrees it is fine: the
    suite is green across thousands of tests, imports resolve, the pack boots,
    the banner reports all N nodes loaded with zero skips, and no log line is
    out of place. Weeks later a human opens one module and finds its export list
    naming things that do not exist -- entries like self.recipe_id, literal
    strings naming nothing, sitting in the module's own public contract. No tool
    ever reported it, because no tool ever read it.
  cause: |
    A mechanical string replacement -- sed, a regex codemod, a scripted
    attribute rename -- rewrote text inside a declaration that has ZERO
    consumers on any executed path. __all__ only takes effect on a star-import;
    if nothing star-imports the module, the list is never resolved, never
    dereferenced, never compared to anything. What the script produced is
    syntactically valid Python: it AST-parses, it imports, it is a list of
    strings. So every guard the project owns passes honestly -- the compiler is
    satisfied, the import succeeds, coverage marks the line executed because it
    IS a module-level assignment, and the boot signal that catches ghost
    registrations is silent because nothing failed to load. The script itself
    cannot tell an identifier in an expression from the same identifier inside a
    quoted string, so the self. prefix it correctly added to attribute accesses
    was applied to the string literals beside them. The class generalizes past
    __all__: any declaration whose elements are STRINGS NAMING CODE -- export
    lists, registry key tables, plugin manifests, doc automodule lists, test
    collection lists -- is a place a scripted edit can leave garbage that
    nothing will ever dereference.
  fix: |
    Give every zero-consumer declaration a reader. A parametrized static test
    that walks each module and resolves every name its __all__ lists against
    that module closes the whole class in a few lines, and parametrizing over
    discovered modules rather than a hand-kept list means a new module is
    covered the day it is added rather than the day it breaks. Treat a scripted
    replacement as an untrusted transformation in its own right: constrain it so
    it cannot match inside string literals -- operate on the AST, not on the
    text -- and READ THE FULL DIFF of a mechanical edit before committing,
    because the entire premise of a codemod is that nobody reads it, which is
    precisely why the one place it can hide is the place nobody reads. Delete
    declarations that have no consumer instead of maintaining them dead; an
    export list nothing imports is a liability with no reader to notice when it
    rots.
  verify: |
    Assert statically over the shipped source rather than a booted object: for
    every module, each string in __all__ resolves to a real attribute of that
    module, and no entry is duplicated. Prove the assertion can fail by
    injecting one bogus name and requiring the suite to go red -- a test over a
    construct nothing reads is itself easy to write in a form that reads
    nothing. Then sweep the tree for the codemod's own fingerprint in places it
    should never appear -- a self. prefix inside a string literal, a
    substitution token inside a docstring or a comment -- and require zero hits,
    because a scripted edit that reached one quoted region reached others.
  tags: [dead-declaration, zero-reader, star-import, codemod, scripted-refactor, false-green, static-assertion, export-list, ast-over-text, mutation-check]
  legacy_id: GITFIX-80935627

- id: "12.86"
  phase: 12
  area: receipt-keyed-on-a-string-the-producer-never-emits
  symptom: |
    A telemetry field, receipt, or prompt-context slot is permanently empty or
    permanently False, and nothing ever complains. Reports read clean while the
    condition they describe is happening constantly. Because the wrong value is
    the SAFE-looking one -- False, "", absent -- no alarm fires, no test fails,
    and the surface can stay dead for weeks or months. It is usually found by
    accident while chasing something else, and the giveaway is a field nobody
    can remember seeing set to anything.
  cause: |
    The consumer reads a NAME the producer never emits. Three shapes dominate.
    (1) An attribute read with a default -- `getattr(obj, "hook", "")` -- where
    the dataclass has never defined `hook`; the default silently supplies the
    empty value forever. (2) A membership test against a flag string the emitter
    does not produce: `"open_safe_fallback" in flags` where the composer emits
    `announcer_intro_structural_fallback`. (3) A dict/key lookup for a key that
    was renamed or never existed on that row shape. In every shape the two sides
    were written at different times, or one was refactored and the other was
    not, and the language offers no error because a default or a False is a
    perfectly legal answer. Refactors that RENAME an emitted flag are the most
    common origin, since nothing links the emitter to its readers.
  fix: |
    Make the mismatch LOUD instead of empty. Read required fields by DIRECT
    attribute access, not `getattr` with a default, so a rename raises
    AttributeError at the read instead of silently emptying the value; reserve
    defaults for fields that are genuinely optional. Where a string must be
    matched, define it ONCE as a shared constant that both the emitter and the
    reader import, so a rename cannot desynchronise them. Where the producer's
    vocabulary is closed, validate against that closed set at write time. Then
    delete the orphaned reader rather than leaving it -- a field nobody sets is
    a trap for the next person, who will assume it means something.
  verify: |
    Assert every stamped flag string against its ACTUAL producer, not against
    itself: for each `X in flags` test, prove some code path emits X. Assert the
    label BINDS the value -- a prompt-context test must check that the field's
    CONTENT reached the prompt, not merely that the label appears. Cover the
    negative and the positive separately, because a permanently-False receipt
    passes any test that only ever asserts False; include at least one case
    where the field MUST be True and one where it must be False. Finally, mutate
    each receipt predicate once and require the suite to go red -- a receipt
    whose test stays green when its predicate is reverted was never covered.
  tags: [telemetry, dead-receipt, silent-failure, getattr-default, flag-string-drift, refactor-desync, fails-safe-so-nobody-notices, prompt-context, mutation-check, all-route]
  legacy_id: PBUG-20260807-01

- id: "12.87"
  phase: 12
  area: gate-reports-success-from-its-own-error-path
  symptom: |
    A validation step prints a clean result and exits 0 while its headline
    check never executed. The reassuring line is real -- the script did run,
    the JSON did parse, the secondary audits did pass -- so the receipt is
    quoted in commit messages and acceptance sections as proof of the ONE thing
    it did not do. Nothing looks broken: there is no traceback, no red, no
    missing artifact. The only trace is a note on stderr saying the check was
    skipped, which is invisible to anyone reading an exit code, a CI status, or
    a pasted "OK" line. The failure can persist for weeks because every symptom
    of it looks like success.
  cause: |
    An error path returns the SAME sentinel the success path returns. A
    problem-collecting function that answers with an empty list means "nothing
    wrong", so `except: return []` converts "I could not check" into "I
    checked and it was fine". The caller sums problem counts, finds zero, and
    reports OK.
    Two things make it durable. First, the skip is usually DELIBERATE and
    documented as a convenience -- "skip rather than fail when the package is
    not importable" -- so a reader who finds it assumes it is a rare
    degradation rather than the normal path. Second, the condition that
    triggers it may be PERMANENT rather than occasional: an import keyed on a
    name that can never resolve (a directory with a hyphen imported as an
    identifier, a package the host loads BY PATH), an environment variable that
    is never set in the context the gate runs in, a service that is never
    reachable from CI. When the trigger is permanent the check has run ZERO
    times in its entire life, while its output has been cited as evidence
    throughout.
    The strongest tell that this has already happened: somewhere in the tree
    another component has quietly reimplemented the same check for itself,
    with a comment explaining that the shared one cannot be trusted. Someone
    hit the hole, solved it locally, and left the shared gate lying.
  fix: |
    Make "could not check" a FAILURE, never a silent pass. The error path must
    return a problem, raise, or exit non-zero -- and its message must say the
    check did not run, not merely that something went wrong, because those
    prompt different responses from the reader.
    Fix the resolution itself rather than only the reporting: if the check
    cannot find what it needs, find out WHY before making the skip loud, or the
    change simply converts a silent false green into a permanent red. Load
    resources the way the host actually loads them -- by path when the host
    loads by path -- instead of by a name that cannot resolve.
    Take a `--strict` flag only if every call site can be updated in the same
    change; a flag that defaults to the old behaviour leaves the lie in place
    behind a new option. Prefer making the honest behaviour the default.
    When a gate reports partial results, say which parts ran. A summary that
    cannot distinguish "all checks passed" from "the checks that ran passed"
    is not a gate. And when you route AROUND a broken gate to get a real
    answer, fix the gate in the same change -- the workaround is proof the gate
    is broken, and shipping only the workaround guarantees the next person
    inherits the false green.
  verify: |
    Force the failure and assert the EXIT CODE, not the log text: make the
    resource unresolvable -- point the root at an empty directory, unset the
    variable, break the import -- and require a non-zero exit. Pair it with a
    control on the real target that must still pass, so fail-closed does not
    silently become fail-always.
    Then prove the check RUNS in the normal case, which is the assertion the
    original gate never made: assert on a positive artifact only the real check
    can produce -- a count of validated items, a resolved path, a named
    contract result -- rather than on the absence of problems. Absence of
    problems is exactly what the broken version reported.
    Grep the repo for reimplementations of the same check before closing:
    another module carrying its own copy is evidence the shared gate has been
    failing open, and tells you how long for.
  tags: [gate, false-green, fail-open, exit-code, skipped-check, empty-sentinel, permanent-trigger, import-by-path, ci, acceptance-evidence, workaround-shipped-gate-left-broken, xref-12.86]
  legacy_id: OTR-2026-08-09-validate-canonical-workflow-false-green

- id: "12.88"
  phase: 12
  area: weight-probe-knows-one-root-while-the-box-uses-another
  symptom: |
    An installed model reads as MISSING to everything that asks without a
    running ComfyUI -- a CPU test suite, a preflight matrix, a doctor script,
    an "is this lane installed?" check. The weight is plainly on disk and the
    node loads it fine at render time, so the failure looks like a broken
    probe rather than a wrong one, and the usual response is to pin an env var
    on the one box that noticed. That fixes the box and leaves the lane broken
    everywhere else.
  cause: |
    Two different questions were sharing one probe. "Where would the LOADER
    find this?" is answered by folder_paths, which honours
    extra_model_paths.yaml and is only importable INSIDE a ComfyUI process.
    "Is this weight on this box?" has to be answerable outside one -- and the
    fallback for that case was a bare join against <comfy_root>/models/<cat>,
    which is correct only for installs that keep their models under the comfy
    tree. A box whose extra_model_paths.yaml points somewhere else gets a
    confident wrong NO from every off-runtime caller.
  fix: |
    Give the fallback the SAME override chain the rest of the project already
    uses for model roots (an OTR_*_MODELS_ROOT / COMFYUI_MODELS_ROOT env plus
    the install's documented default), and probe it LAST -- after folder_paths
    and after the comfy-root join. Probing last makes the change additive by
    construction: it cannot alter an answer that was already a hit, only turn a
    false negative into the truth. Put the root resolution in ONE named helper
    so a second copy of the chain cannot drift from the first.
  verify: |
    Unset every model-path env var for the engine and assert the installed
    weight still resolves. Then point the models-root env at an EMPTY temp
    directory and assert it reads as absent, so the probe is proved to be
    probing rather than always answering yes.
  tags: [models, paths, folder_paths, preflight, headless, false-negative]

- id: "12.89"
  phase: 12
  area: receipt-asserts-a-fact-the-render-disproves
  symptom: |
    A telemetry field is confidently WRONG rather than missing, and the wrong
    value is the assertive one -- True, a feature name, a version. Nothing looks
    empty, so the checks that hunt for null fields walk straight past it, and the
    value propagates: a rollup groups on it, a summary reports it, and eventually
    a PUBLISHED artifact states it to an end user. The work itself is correct
    throughout; only the description of the work is false. This is the inverse
    polarity of the permanently-empty receipt and needs its own hunt, because it
    cannot be found by looking for fields nobody ever sets.
  cause: |
    The runtime and the receipt read the same underlying value through DIFFERENT
    rules. Code that decides behaviour uses a named predicate -- "is this
    component switched off?" -- while code that writes the receipt uses raw
    truthiness on the same token. They agree for every value except the one that
    means "off", and a config that switches a component off BY NAME ("none",
    "off", "disabled", "0") is a non-empty string, which is truthy. So the branch
    that skips the component and the field that reports it running are reading
    one variable and reaching opposite answers.
    What makes it durable is that the nearest test asserts the field's SHAPE --
    isinstance(value, bool) -- and a wrong bool is still a bool. That test passes
    forever while the value is inverted for a whole tier.
  fix: |
    Give the fact ONE authority and make every consumer read it. Where a
    predicate already exists because the runtime needed it, the receipt calls
    that same predicate rather than re-deriving the answer from the raw token.
    Never let a receipt compute a fact the runtime already decided.
    Then push the check up to the GATE rather than the one component: a preflight
    assertion comparing each receipt field against what the code actually does
    makes every later component inherit it, because this recurs wherever a
    skip-token idiom is adopted.
  verify: |
    For every tier, assert the receipt field EQUALS what the runtime does with
    the same token -- not that it is the right type, and not against a literal.
    Add a second assertion at the CONSUMER that publishes it, so the fix is
    pinned where the falsehood actually surfaced and not only at its source.
  tags: [receipts, telemetry, truthiness, sentinel, published-artifact, gate-hole]

- id: "12.90"
  phase: 12
  area: a-test-that-pins-the-bug-it-should-have-caught
  symptom: |
    Fixing a real defect turns the suite RED, and the failing tests are the ones
    whose names describe the invariant just restored. The suite argues for the
    broken behaviour, confidently and in numbers, so the fix reads as the
    regression. This is the most expensive shape a stale test takes: it does not
    merely fail to catch the bug, it actively defends it, and an engineer who
    trusts the suite will revert a correct fix.
  cause: |
    Two ways in, both of which look like diligence at the time. Either the test
    was written from the CODE rather than from the requirement -- someone
    captured what the function currently returned and froze it -- or the body
    drifted from its own name while the name kept stating the rule. The second is
    worse, because the name is what a reviewer reads: a test called "unknowable
    is not the same as satisfied" whose body asserts the unknowable case returns
    satisfied passes review by everyone who does not open it.
    A related instance: a test that pins a DERIVED value (a half-size, a computed
    offset) instead of the rule producing it. When the input changes legally, the
    pinned derivation is wrong and the test calls the new correct value an error.
  fix: |
    When a fix turns tests red, read each failing test's NAME against its BODY
    before touching either. If the name states the rule just implemented, the
    body is the bug -- rewrite the body to assert the name. If the test was using
    the fixed function as a PROXY for a different subject, give it what the
    stricter code now needs (a fixture, an injected state) rather than weakening
    the code back to make it pass.
    Assert rules and invariants, not captured outputs. Where a value is derived,
    assert the derivation against its source so a legal change to the input moves
    the expectation with it.
  verify: |
    After rewriting, confirm each test FAILS against the old behaviour -- a
    rewritten test that passes both ways is pinning nothing. Grep the suite for
    literals duplicating a value the code declares, and replace each with a read
    of the declaration.
  tags: [tests, regression, stale-assertions, invariants, review, false-red]

- id: "12.91"
  phase: 12
  area: defect-filed-against-one-component-lives-in-every-component-sharing-the-mechanism
  symptom: |
    A defect is found, fixed, written up and closed against ONE component -- and
    an identical instance is still live one file away. Worse than an ordinary
    miss: the ledger now says this class was dealt with, so the second instance
    is protected by the record of the first being fixed. It resurfaces later
    looking novel, in a component whose own tests are green.
  cause: |
    The defect was attributed to where it was NOTICED rather than to what CAUSED
    it. When the cause is a shared mechanism -- a common helper, a third-party
    node several graphs call, an idiom copied between siblings -- the blast
    radius is every consumer of that mechanism, not the one that failed first.
    A second effect hides it: the same code can be LEGAL in one configuration and
    illegal in another, so a sibling that has not moved yet looks fine and
    genuinely is. The defect arrives there later, with no change to that file,
    when its configuration moves to a value the mechanism cannot accept. A
    component can break because something it depends on was reconfigured
    elsewhere, and no diff on that component will ever show it.
  fix: |
    Before closing a defect, name the MECHANISM that caused it and enumerate
    every consumer. Fix or explicitly clear each one, and record the defect
    against the mechanism rather than the component.
    Then encode the rule as a check over the whole registry rather than the one
    component: derive the constraint the mechanism imposes and assert it for
    every consumer carrying the mechanism's fingerprint, so a component adopting
    the idiom later is covered on arrival instead of when someone remembers.
  verify: |
    Grep for the mechanism's signature -- the helper call, the node class, the
    idiom -- and assert the derived constraint for every hit, driven off the live
    registry rather than a hand-written list. Prove the check by pointing one
    consumer at an illegal configuration and confirming it fails.
  tags: [shared-code, blast-radius, registry-wide, attribution, configuration, gate-hole]

- id: "12.92"
  phase: 12
  area: a-config-pin-that-becomes-a-bug-by-remote-action
  symptom: |
    A configuration value that was correct when written starts causing damage
    without anyone touching it, its file, or its component. There is no diff to
    blame and no commit that introduced the failure -- the change happened in a
    DIFFERENT module and the pin's meaning changed underneath it. Symptoms are
    downstream and diffuse: work chopped into fragments, a ceiling refusing what
    it used to allow, a budget applying at the wrong stage.
  cause: |
    The pin constrained one mechanism, and a later change moved the value into a
    second mechanism's path -- typically by adding the component to a list that
    gives an existing knob new authority (a planning cap, an admission gate, a
    scheduling tier). Compensation elsewhere that made the pin harmless is often
    ripped in the same change, so the protection disappears at the exact moment
    the pin gains reach.
    Comments make it durable: the component's own documentation still describes
    the protection that was deleted, so a reader who checks concludes the pin is
    safe. And the tests pinning the value are numerous and confident, because it
    WAS correct when they were written.
  fix: |
    When adding a component to any list that gives an existing knob new
    authority, enumerate every config setting that knob for the component and
    re-derive whether each is still correct under the new meaning. Treat list
    membership as the breaking change it is.
    Assert tunable numbers against the source of truth they come from rather than
    against copied literals, so the value can move without the tests lying in
    either direction. Audit any comment describing a protection: a comment
    describing deleted protection is how the next reader is talked out of the
    correct diagnosis.
  verify: |
    For each component in a capability list, assert its configs are legal under
    the semantics that list confers, and that the emitted work matches what was
    requested rather than the pin. Prove the value reaches the stage you think:
    set it, run, and check the produced segmentation, not the config file.
  tags: [config, profiles, planning, stale-comment, remote-change, tests-defend-bug]

- id: "12.93"
  phase: 12
  area: a-fix-lands-on-the-path-the-tests-run-not-the-path-the-install-selects
  symptom: |
    A capability is added, reviewed, tested and shipped, and the running system
    still behaves as if it were never added. The test suite is green and
    exercises the new code honestly. Nothing appears in any log, because the
    code that was fixed is genuinely correct -- it simply never executes on this
    machine.
  cause: |
    The component has two or more render/execution paths and selects between
    them IMPLICITLY at runtime, from installed assets rather than from
    configuration a reader can see: a variant detected from a weight filename, a
    family probe, a capability sniff, a default that differs per install. The
    fix was applied to the path the author had open, which is usually the one
    the CPU test fixtures instantiate; the installed assets select the other.
    A test suite cannot catch this, because with fakes BOTH paths are equally
    reachable and equally green. The selection is a property of the machine, not
    of the code, so only a live run on that machine disagrees.
  fix: |
    For any component with more than one execution path, resolve WHICH PATH THE
    INSTALLED CONFIGURATION SELECTS before deciding where a fix belongs, and
    apply it to every path that can produce the artifact -- or make the paths
    share one seam so there is only one place to fix. Treat "which branch does
    this box take" as a fact to look up, never to assume from the code order.
    When a change claims to enable a downstream capability ("X cannot measure
    without this"), prove the capability on the path a live run actually takes
    before believing the claim.
  verify: |
    Enumerate the component's execution paths and, for each, assert the new
    field/guard/receipt is present. Then run ONE live job and read the produced
    artifact -- not the test output -- for the thing the change was supposed to
    add. A green suite is not evidence that the shipped path changed.
  tags: [multi-path, implicit-dispatch, install-dependent, receipts, live-proof]

- id: "12.94"
  phase: 12
  area: a-missing-measurement-silently-replaced-by-a-weaker-one
  symptom: |
    A metric is present, plausible, and wrong -- consistently too low or too
    smooth. Nothing is null, nothing warns, and the number is used to calibrate
    a budget or a limit. Later that limit admits work that then fails at
    runtime, and the calibration data cannot be told apart from good data
    because both are plain numbers in the same field.
  cause: |
    A consumer reads the strong measurement with a fallback to a weaker one in a
    single expression -- `value = precise() or approximate()` or an equivalent
    default-on-missing. The fallback exists for genuine reasons (an older
    producer, an off-hardware path) but it converts ABSENCE into a DIFFERENT
    KIND OF NUMBER rather than into a missing value. A sampled instantaneous
    reading substituted for a windowed maximum is a LOWER BOUND, and a budget
    derived from a lower bound under-predicts demand, which is precisely the
    direction that admits work that then exhausts the resource.
  fix: |
    Never let a fallback change the KIND of a measurement. If the precise source
    is absent, propagate absence -- null, not a substitute -- and let the
    consumer refuse or skip explicitly. Where both kinds are genuinely useful,
    record them in separate fields with the source named, plus a boolean saying
    whether the row may seed a calibration; a weaker reading stays readable
    without becoming usable.
  verify: |
    Assert that a result carrying no precise measurement canonicalizes to null
    rather than to any number. Separately, assert a calibration refuses to be
    seeded from a row whose provenance flag is unset. Diff the two sources on
    one live job: if they differ by a large factor, the fallback was never
    interchangeable and any historical row built on it is suspect.
  tags: [measurement, provenance, fallback, calibration, silent-substitution]

- id: "12.95"
  phase: 12
  area: a-constant-measured-under-one-configuration-is-not-a-property-of-the-component
  symptom: |
    A component enforces a magic number that looks conservative and costs far
    more than it should -- work rounded up to a floor, a minimum batch, a forced
    size -- with no failure to justify it. Removing it feels reckless because
    nobody remembers what it protects, so it survives every review as prudence.
  cause: |
    The number was MEASURED, correctly, against a configuration the component no
    longer uses: a different canvas, resolution, precision, batch shape or
    backend. Constants do not carry their provenance, so a measured constraint
    and an arbitrary guess are indistinguishable once the author has moved on --
    and the conservative-looking one is never challenged. When the configuration
    changed, nothing re-derived the constraint, because the constraint lived in
    a different file from the thing that moved.
  fix: |
    Record the configuration each enforced constant was measured under, in the
    constant's own comment, and state that it is UNKNOWN at any other
    configuration. When the configuration moves, re-measure rather than
    inheriting; treat a configuration change as invalidating every constant
    derived from the old one, in both directions. Where a declaration and a
    runtime constant must agree, assert one against the other so the pair cannot
    drift silently.
  verify: |
    Sweep the constrained dimension at the CURRENT configuration and record
    which values actually fail -- including the values that failed under the old
    configuration, which are the informative ones. Assert the enforced constant
    equals the measured boundary, and that a declaration derived from it matches
    the runtime value rather than a copied literal.
  tags: [constants, provenance, configuration-drift, measurement, over-conservatism]

- id: "12.96"
  phase: 12
  area: staging-a-file-that-already-lives-in-the-staging-destination
  symptom: |
    A job dies at a file-staging step, before any real work, with a Windows
    sharing violation -- "The process cannot access the file because it is being
    used by another process" (WinError 32) -- naming a path but nothing about
    what was being staged. No other process holds the file. On POSIX the same
    code silently truncates the file to zero bytes instead of raising, which is
    worse.
  cause: |
    A helper copies an input into a tool's working/input directory and returns
    its basename. When the caller supplies a path that is ALREADY inside that
    destination, source and destination resolve to the same file and the copy is
    a self-copy. It is easy to hit precisely because the destination is a
    natural place for such files to live -- a previous run staged one there, or
    an operator picked an example from it.
  fix: |
    Compare source and destination by RESOLVED identity before copying
    (os.path.samefile, or realpath equality when the destination may not exist
    yet) and skip the copy when they are the same file -- the input is already
    staged and its basename is the correct answer. Do not wrap the copy in a
    broad try/except: that hides genuine permission and disk failures, which is
    the same class of defect one level up.
  verify: |
    Stage a file that already lives in the destination directory and assert the
    helper returns its name without raising and without changing its bytes
    (compare a hash before and after). Assert a real permission failure still
    propagates.
  tags: [windows, file-staging, self-copy, winerror32, fail-loud]
- id: "12.97"
  phase: 12
  area: a-model-field-name-that-collides-with-its-base-class
  symptom: |
    A pydantic field is declared required, yet instances validate WITHOUT it and
    the missing value comes back as a bound method. The next json.dumps dies
    with "Object of type method is not JSON serializable", naming neither the
    model nor the field. The quieter half is worse: the JSON schema generated
    from that model stops listing the field in `required`, so an LLM prompted
    against it is never asked for a documented value, and the method repr
    reaches the prompt as text.
  cause: |
    The field name also resolves on the base class or its METACLASS. Pydantic's
    ModelMetaclass inherits ABCMeta, so a name like `register` resolves on
    BaseModel without appearing in vars(BaseModel). Pydantic does not reject the
    collision -- it adopts the inherited attribute as the field's DEFAULT, which
    silently turns a required field optional. `copy`, `json`, `schema`, `dict`,
    `validate` and `construct` are the same trap. A warnings filter that
    silences the shadowing warning hides the only signal.
  fix: |
    Declare the field explicitly with `Field(...)` so the class body shadows the
    inherited attribute and restores required-ness. The wire name is unchanged,
    so a contract term that cannot be renamed stays put. Do NOT "fix" it with a
    default: that stops the crash while leaving the field optional and the model
    never asked for it. Renaming is correct only when the name is not part of an
    external contract.
  verify: |
    Assert `Model.model_fields[name].is_required()` is True and that the name
    appears in `model_json_schema()["required"]`. Then sweep EVERY pydantic
    model in the package: for each field default, `json.dumps(default)` must not
    raise. Guard the sweep with a companion assertion that it actually found the
    models, so a broken import cannot make it vacuously green.
  tags: [pydantic, schema, serialization, structured-output, silent-default]
  legacy_id: "PBUG-20260812-02"
- id: "12.98"
  phase: 12
  area: a-constant-its-own-documentation-disqualifies-is-still-live
  symptom: |
    A guard refuses real, previously-shipping work. The refusal message is
    specific and confident -- it names a budget, a measured input and a
    computed ceiling -- so it reads as a resource problem, and the reported
    resource figure is usually low enough to make that story plausible.
    Investigation chases the resource. Meanwhile the comment block DIRECTLY
    BENEATH the offending table already says the table is wrong, names the
    production leg it previously killed, and states what the correct value is.
    Nobody reads it, because the refusal points somewhere else.
  cause: |
    A tuned constant was measured once, found wrong, and documented as
    disqualified IN PLACE -- but the row was never deleted, and one consumer
    still reads it. A sibling consumer was already fixed ("X stopped consulting
    it for exactly this reason"), which is what makes the survivor invisible:
    the codebase looks like it handled the problem. The doc block is the
    author's own analysis, written at the moment of discovery, and it degrades
    into decoration the instant it is not accompanied by the deletion it
    argues for.
  fix: |
    CHECK THE FALLBACK BEFORE YOU DELETE ANYTHING. This entry originally
    prescribed deletion outright; that was proven a no-op the day it was
    written. The lookup was `TABLE.get(key, DEFAULT)` and DEFAULT was the
    byte-identical tuple, so removing both rows changed no verdict, no
    computed ceiling and no exception -- the guard refused exactly as before,
    and the "fix" would have shipped as a green diff that fixed nothing. A
    disqualified row and a disqualified default are the same constant wearing
    two names. Establish the delete-vs-gate question by running the real call
    with the row removed, not by reading the table.
    So: if the value survives its own deletion, deletion is not the fix. GATE
    THE ENFORCEMENT INSTEAD. Route every refusal through one explicit
    predicate -- "may this row REFUSE?", never "does a row exist?" -- and make
    the disqualified value predict, log and return while refusing nothing.
    Grep for EVERY consumer first and gate them all: the failure that produced
    this entry was one authority wired to one of its two call sites, so the
    same constant was inert on the reviewed path and live one call away.
    Gate the WHOLE row, not the term you find least defensible. A row with a
    disqualified slope and a plausible-looking fixed overhead invites keeping
    half of it; resist that unless the evidence separates the terms, because
    "one row, one question" is what stops a second, unevidenced authority from
    appearing. Here the overhead looked unimpeached and was not -- it was
    derived from an ABSOLUTE peak while the comparison ran against FREE bytes,
    double-charging a baseline on every prediction.
    If a replacement is proposed from an existing bench or lab fit, check the
    project's own admission rule first: a standing "no bench may substitute for
    the real lifecycle" ruling forbids adopting those numbers however much
    closer to truth they look. Deletion remains right when the value has NO
    fallback behind it and the documentation says empty is correct.
  verify: |
    Compute the guard's verdict at the EXTREMES of its input, not at the
    observed value. Here the row priced a 125-frame request at 30,125 MB on a
    16 GB card -- it refused on an empty device, which proves the resource was
    never the variable. A guard that refuses at every input it can ever see is
    not a guard. Assert that: for each row, at maximum plausible resource, the
    largest request the planner can emit must still be affordable, or the row
    must not refuse. Grep for consumers before trusting that a fixed sibling
    means the value is dead.
    PIN THE NO-OP ITSELF, or the deletion gets proposed again. Assert that each
    row equals the fallback constant, with a message telling the next reader
    that the no-op argument must be re-derived if it ever stops being true.
    Then assert the disqualified value's behaviour from BOTH sides: the exact
    production inputs that were refused now return their full request, and a
    row that IS qualified still refuses them -- otherwise the test proves the
    guard is broken rather than gated. Keep validation OUT of the gate: a
    malformed or negative coefficient is a configuration error and must stay
    fatal for every engine, qualified or not. Finally, require that
    qualification names a row that actually exists, or a typo silently promotes
    the shared fallback into an enforcing guard.
  tags: [guards, tuned-constants, stale-config, dead-row, refusal-path, doc-vs-code-drift, cost-model, xref-12.73]
  legacy_id: "OTR-2026-08-13-frame-cost-model"
- id: "12.99"
  phase: 12
  area: a-generator-gone-stale-destroys-the-artifact-it-is-named-for
  symptom: |
    A file carries a header naming the script that generates it, so a
    maintainer edits the script and re-runs it. The run reports success and
    prints a plausible summary. The artifact silently loses most of its
    content, because contributors had been appending to the OUTPUT directly for
    weeks and the generator never learned about any of it.
  cause: |
    An append-only artifact acquires two write paths: the declared generator,
    and hand edits by whoever needed a row landed today. Hand edits are faster
    and always win in the moment, so the generator's own data drifts into a
    strict subset of what ships. Nothing detects this, because a generator is
    trusted precisely by being the declared source of truth -- the header
    saying "GENERATOR for X" is read as a guarantee rather than as an intention
    that stopped being true. A version field that the artifact bumps and the
    generator does not is the fingerprint, and nobody compares them because
    running the generator is supposed to be the safe operation.
  fix: |
    Make the generator FAIL CLOSED against its own output: read the shipped
    artifact's version before writing, and refuse when it is newer than the
    version this code produces. Say what would have been lost, and name the
    reconciliation as the work -- rows missing from the generator must be
    re-derived from their sources, never copied back out of the artifact, or
    the generator is laundering hand edits it cannot reproduce.
    Do NOT "fix" it by bumping the generator's version to match. That silences
    the guard and re-arms the trap. Do NOT delete the generator either while
    anything still cites it; an unrunnable generator with a loud refusal is
    strictly better than a runnable one that destroys evidence.
  verify: |
    Run the generator against the shipped artifact in CI and assert it either
    reproduces the file BYTE-FOR-BYTE or exits non-zero. Those are the only two
    honest outcomes; a generator that runs clean and produces something smaller
    is the bug. Diff the row/key COUNT, not just the bytes, so a reader sees
    scale ("123 lines, 9 lanes") rather than "file changed".
    Assert the refusal itself: stamp the artifact one version ahead and require
    a non-zero exit whose message names the version gap.
  tags: [generators, codegen, evidence, append-only, silent-data-loss, doc-vs-code-drift, fail-closed, xref-12.98]
  legacy_id: "OTR-2026-08-13-evidence-manifest-generator"

- id: "12.100"
  phase: 12
  area: a-length-ceiling-is-not-a-liveness-guard-and-can-hide-the-runaway-it-replaces
  symptom: |
    A schema-constrained local decode falls into a verbatim repetition loop
    inside ONE string field and never exits. It generates until the context
    ceiling -- measured: 13,912 tokens over 22 minutes, the same ~384-token
    paragraph about 36 times -- and every token is discarded. Nothing looks
    wrong while it happens: the GPU is busy, tokens flow at full rate, and
    every liveness signal is healthy.
    THEN the repair makes it quieter. After a max_length is added, the same
    runaway comes back as valid JSON that passes schema validation and ships a
    sentence cut off mid-word. And a detector built on "how long has this
    string been open" cannot tell a legitimately long field from a loop, so it
    is a second length cap wearing a liveness costume.
  cause: |
    Three separate mistakes that look like one:
    (a) Under grammar-constrained decoding the EOS token is masked until the
        document is complete, so the only exit from a string is its closing
        quote. Once a repetition loop locks, nucleus/min-p sampling prunes that
        quote to probability ZERO -- the model is not refusing to stop, it is
        never offered the option. A repetition penalty cannot help because the
        HF penalty is not frequency-aware: a token emitted 60 times is
        penalised exactly as much as one emitted once.
    (b) A grammar enforcer stops a string AT its max_length by admitting only
        progressively shorter tokens as the limit nears, so a forced closure
        lands anywhere within one MAX-TOKEN-LENGTH below the ceiling. An
        exact-hit detector therefore misses most real forced closures, and the
        truncated string sails through.
    (c) The ceiling only terminates a decode where a grammar ENFORCES it at
        token selection. On a post-validated lane -- schema described in the
        prompt, parsed after the call -- a max_length stops nothing: the
        runaway still burns the window, and the artifact is discarded
        afterwards. That is strictly worse than no ceiling.
  fix: |
    TWO SIGNALS ARE REQUIRED, AND NEITHER SUBSUMES THE OTHER. This entry
    originally prescribed cycle detection alone; that was written from two
    captured specimens and a third existed. Corrected the same day.

    SIGNAL 1 -- DETECT REPETITION, NOT LENGTH, for the looping runaways. The
    signal is a run of tokens repeating back to back, which is independent of
    how long the output is allowed to be. Read TOKEN IDS, never decoded text --
    then the guard is tokenizer-independent (no isolated-token decoding, no
    byte-fallback or escape handling) and format-independent (it covers JSON,
    markup and free prose identically).

    SIGNAL 2 -- AN OPEN-STRUCTURE COUNTER, for the ELABORATION SPIRAL: a
    runaway that NEVER repeats. Measured: 15,355 tokens, 83k chars, every
    sentence new, every sentence well-formed, none of it ever arriving at an
    end. Repetition detection is structurally blind to it -- there is no cycle
    to find -- so the only cheap observable is that ONE structural unit (a JSON
    string, a section, a field) has stayed OPEN without closing. That is not a
    length cap: it does not measure the output, it measures one unit's failure
    to terminate, so an artifact of many complete units never approaches it.
    SCOPE IT to passes where the delimiter is STRUCTURE. A quote lexer on free
    prose opens on the first line of dialogue and counts the rest of the scene.

    STATE WHAT THE GUARD CAN AND CANNOT CLAIM. It is COST-BOUNDING, not a
    correctness oracle: non-termination cannot be proven from a prefix, since
    any prefix of a spiral is also a possible prefix of an output that closes
    later. Target a low false-abort rate, short detection latency and compute
    saved -- never "catches every runaway and nothing else".
    And distinguish LOCAL from GLOBAL length: a 15,000-token DOCUMENT can be
    valid while a 15,000-token single field is a runaway. Bounding the
    structural unit is what lets the artifact grow without weakening the guard.
    Use a LATCHED StoppingCriteria: detect, set a flag, return True, let
    generate() return normally, then classify and raise OUTSIDE. Raising from
    inside a criterion skips the caller's decode/evidence construction and the
    streamer's own teardown, and arrives unclassified.
    Raise a DISTINCT, REROLLABLE phase. Reusing the capacity-exhausted phase
    makes every diagnostic lie: a halted decode stops with most of its
    allowance unspent, so "ended at the provider capacity limit" sends the next
    reader hunting a budget defect that does not exist.
    Keep schema ceilings, but as a STRUCTURAL backstop sized far above anything
    real content produces, and reject at a GUARD BAND below them wider than the
    longest single token the tokenizer can emit. Route that rejection to a
    reroll, never to silently accepted text.
    DO NOT reach for no-repeat-n-grams when a grammar is active: the n-gram ban
    and the grammar mask both write -inf, prefix validation only checks that the
    grammar returned a non-empty list rather than that a token SURVIVED the ban,
    and the intersection can be empty -- which crashes sampling outright.
  verify: |
    Automatable, and the false-positive tests are the ones that matter:
    (0) Feed it a NON-REPEATING spiral -- one unit, thousands of tokens, every
        token new -- and assert signal 2 fires while signal 1 does not. A guard
        tested only against loops will pass while blind to a third of the
        known failures.
    (1) Feed the detector thousands of tokens of VARIED output and assert it
        does NOT fire. A test whose no-halt case never crosses the threshold
        proves nothing -- size the input far beyond any bound.
    (2) Feed it a cycle at the measured period and assert it fires.
    (3) Assert structural repetition is ignored: repeated keys with VARYING
        values (a real JSON array) must not trip it, while a perfectly periodic
        stream must.
    (4) Assert the rejection threshold sits at least one max-token-length below
        the schema ceiling, computed from the real tokenizer vocabulary.
    (5) Assert the halt reaches the retry ladder as RECOVERABLE, and that a
        deterministic prompt-side refusal stays non-recoverable.
    (6) Assert the guard is wired into the PRODUCTION entry point, not only
        callable in isolation -- delete the call site and the suite must go red.
  tags: [llm, structured-json, grammar-constrained, lm-format-enforcer, degenerate-repetition, runaway-decode, stopping-criteria, liveness, silent-truncation, tokenizer-independence, no-repeat-ngram, fail-loud, xref-11.50]
  legacy_id: "OTR-2026-08-13-writer-decode-runaway"

- id: "12.101"
  phase: 12
  area: a-key-enumerating-normalizer-silently-drops-every-field-it-does-not-name
  symptom: |
    A shipped artifact carries a null identity field on EVERY row of one kind,
    while the PARALLEL rows in the same file carry the real value. Measured:
    all eleven spoken rows of a published episode ledger said
    `speaker: null`, and the beat rows beside them named the right characters.
    Nothing crashes, nothing logs, no test goes red -- the record simply does
    not say who says each line.
    It hides for a long time because ONE downstream consumer looks correct: it
    re-derives the name from a foreign key (`char_id` -> cast table) and never
    reads the dropped field, so the rendered output is right while the record
    is wrong. Every consumer that has no such fallback -- an audit, a export,
    a later pass reasoning about who spoke -- silently gets nothing.
  cause: |
    Two normalizers exist for two parallel row types, and each rebuilds its
    rows as a literal dict that ENUMERATES the keys it keeps. The beat
    normalizer names the field; the line normalizer does not. A caller that
    supplies the field on a line row has it discarded at the boundary, so the
    upstream can be entirely correct and the value still never reaches disk.
    THE TELL IS THE ASYMMETRY, NOT THE ABSENCE. An enumerating normalizer is a
    silent allowlist: it does not fail on an unknown key, it forgets it. That
    is fine while one normalizer exists; the moment there are two for parallel
    row types, any field only ONE of them names is a field the other drops.
    In the measured case the very same method had already lost a different
    shared field this way once before -- which is what makes this a defect
    CLASS rather than a typo. A normalizer that has dropped one field will
    drop the next one too.
    The compounding factor is that the producers were ALSO not supplying the
    field, so a reviewer looking at either half alone concludes the other half
    is the bug.
  fix: |
    FIX BOTH HALVES IN ONE CHANGE, and prove the symmetry rather than the
    field.
    (a) Add the field to the silent normalizer, mirroring its sibling exactly
        -- same coercion, same empty-to-null rule. Emit the key ALWAYS, with
        an explicit null when absent, so a consumer reads a value instead of
        guessing whether the key exists.
    (b) Supply the field at EVERY assembly site, sourced from the row that
        already owns it (here: the owning beat's speaker), never re-asked of a
        model that already answered it upstream. Where a helper builds the row
        and a sibling helper builds the parallel row, have the second READ the
        first rather than take the value a second time -- then the two cannot
        disagree by construction.
    (c) Do not stop at the lane that produced the artifact. The normalizer is
        SHARED, so a lane-only fix leaves every other producer broken.
    (d) Regenerate any golden fixture the row schema pins, DELIBERATELY, and
        say in the commit that the contract changed by design.
    DO NOT "fix" it downstream with another char_id -> name fallback. A second
    re-derivation makes the hole invisible to one more consumer and leaves the
    record still wrong.
  verify: |
    Automatable, and the symmetry assertion is the one that lasts:
    (1) Feed the same identity value to BOTH sibling normalizers and assert
        they return the same answer. A test that only asserts the new field
        survives one normalizer passes again the day a third row type is added
        without it.
    (2) Assert the key is PRESENT and null when the caller omits it -- absent
        key and null value are different bugs downstream.
    (3) Statically assert both normalizers enumerate the shared field. Parse
        the module, collect the dict keys each builds, and diff the two sets:
        this is the check that goes red when someone deletes the field again.
    (4) Run the real assembly for each producing lane and assert every spoken
        row's field equals its owning parent row's field -- not merely that it
        is non-null.
    (5) Grep the sealed on-disk artifact, not the in-memory object. The
        in-memory row can be right while the normalizer that writes it is not.
  tags: [schema, normalizer, allowlist, silent-data-loss, ledger, sibling-asymmetry, golden-fixture, fail-loud, xref-12.99]
  legacy_id: "OTR-PBUG-20260814-01-ledger-speaker-drop"

- id: "12.102"
  phase: 12
  area: a-schema-cap-must-never-sit-at-the-number-a-downstream-trim-already-enforces
  symptom: |
    A pipeline stage dies on a RICHER-THAN-USUAL input, and the model was
    right. Measured: a news story naming 11 places and 14 institutions was
    extracted correctly by the model, and the pydantic `max_length` on those
    list fields rejected the reply three times in a row. The retry ladder
    exhausted, the run raised, and the episode was lost -- twice, on two
    separate attempts, because a re-roll cannot make a source poorer.
    The tell that it is THIS bug and not a model failure: the rejected value
    is CORRECT, the count is barely over the cap, and the error is a schema
    violation rather than a content complaint.
  cause: |
    The same number was written in two places with two different meanings.
    Downstream, a merge already trimmed each list to N deterministically --
    that is the real, intended limit. Upstream, the parse-time schema carried
    `max_length=N` as well, which is not a limit but a REFUSAL, and it fires
    FIRST. So the trim that exists to handle exactly this case can never run.
    A cap and a trim look interchangeable when you write them and are opposite
    in effect: a trim accepts the input and shortens it, a cap rejects the
    input entirely.
    It hides because it only fires on inputs richer than the cap. Every test
    fixture and every ordinary source stays under it, so the code looks
    correct for months and fails the first time reality is generous.
    Note the interaction with the decoding mode, because it changes the
    SYMPTOM completely. Under a constrained/grammar decode the array ceiling
    is enforced during generation, so the model is cut off and the artifact is
    silently SHORT. Under parse-then-validate the same ceiling REFUSES and the
    run dies. Same defect, one loud and one silent, and the silent one is
    worse.
  fix: |
    SEPARATE THE TWO NUMBERS AND SAY WHICH IS WHICH.
    (a) The schema ceiling becomes a BACKSTOP, sized well above anything a
        real input produces. Its only job is to keep a degenerate decode
        finite. It must never be reachable by legitimate content.
    (b) The LIMIT stays exactly where it was -- in the deterministic trim that
        already knew how to apply it.
    (c) SWEEP THE WHOLE MODEL, not just the field that failed. One instance of
        this is rarely the only one: the same audit found three more list
        fields in the same schema with the same cap-equals-trim collision,
        each one a live failure waiting for a richer input.
    (d) Where the trim DISCARDS content, receipt what it dropped and why, so
        the loss is auditable rather than invisible.
    DO NOT "fix" it by raising the cap to a bigger number. That moves the
    cliff instead of removing it, and leaves the same contradiction in place.
    DO NOT fix it by loosening a downstream gate to tolerate the refusal --
    that trades a real protection for an imaginary one.
  verify: |
    (1) Construct the model with EACH bounded list one item OVER its trim
        limit and assert it parses. This is the regression that matters; it
        is exactly the input that killed the run.
    (2) Assert the trim still returns the limit for that same over-long
        input, so the cap change did not widen the real contract.
    (3) Assert the backstop still refuses at its own ceiling, so the guard
        against a degenerate decode survives.
    (4) STATICALLY DIFF the two numbers: enumerate every bounded list field in
        the schema and every trim limit applied downstream, and fail if any
        cap equals its trim. This is the check that catches the next one --
        a per-field test only ever covers the fields someone remembered.
    (5) Re-run the real pipeline on the input that failed and confirm it now
        passes the stage. A unit test proves the parse; only the live run
        proves the stage.
  tags: [schema, pydantic, validation, hard-cap, silent-truncation, retry-ladder, defect-class-sweep, grammar-constrained, fail-loud, xref-12.100, xref-12.101]
  legacy_id: "OTR-2026-08-14-dossier-cap-refuses-a-rich-source"

- id: "12.103"
  phase: 12
  area: a-model-rewrite-pass-must-never-hold-authority-over-a-field-another-owner-writes-deterministically
  symptom: |
    A voiced/spoken row ships shorter than what was composed -- a deterministic,
    Python-owned fact appended verbatim by an earlier assembly step is silently
    gone from the final row, even though the interpreter that produced the fact
    was correct and the ledger still carries the original sentence elsewhere in
    meta. Measured: a closing-announcer row that should read an authored bridge
    plus a factual news coda shipped with only the bridge; the durable meta
    fields that hold the true sentence (spoken_coda_source /
    provenance_coda_line) still carry it, so the RECEIPT and the SPOKEN ROW
    disagree. Rewrite rate measured at 9 of 14 voiced rows across three
    episodes in one overnight gate.
  cause: |
    A later cleanup/"clean stage" pass judges every voiced row for "anything
    that is not speech" and hands a MODEL the rewrite of what it flags. The pass
    has no concept of a protected/content-owned span within a row -- it treats
    the row as one undifferentiated block of text to judge and rewrite, not as
    a composite of an LLM-authored bridge plus a Python-appended fact. Whatever
    the model decides is "not speech" (or simply drops during rewrite) is gone,
    and nothing downstream distinguishes "the model paraphrased this" from "the
    model deleted this." It shipped unnoticed because the pass was proven safe
    on a planted-ledger measurement rig that never runs the writer tail and
    therefore never composes a coda -- the one row shape with a protected
    component was never in the harness's input space.
  fix: |
    Mark protected/content-owned spans at the point of composition -- the same
    call that appends the deterministic fact records that the row is now a
    composite -- and make the clean/rewrite pass read that mark BEFORE it ever
    hands a row to the model: rows carrying a protected span are either
    excluded from full-row model rewrite, or the rewrite is scoped to operate
    only on the non-protected portion and the protected substring is
    re-appended byte-identically afterward.
    The marker must be ONE shared constant imported by both the emitter and the
    skip reader, and it must be stamped INDEPENDENTLY of whether the authored
    half succeeded: a flag derived from the compose outcome is decided after
    the point where the clean pass needs to already know to keep its hands off,
    so it cannot identify the row in time.
    DO NOT "fix" it by asking the model nicely to preserve facts in the prompt
    -- an instructed model is still a model, and the guarantee must be
    structural (the protected span physically cannot enter the model's edit
    surface), not persuasive.
    DO NOT fix it with a post-hoc check that only logs a warning -- the row
    must ship correct, not merely diagnosed as wrong after the fact.
    DO NOT scope the exemption by speaker role or row type: the sibling rows of
    the same role are legitimately judged, and a role-keyed exemption silently
    drops them out of the pass.
  verify: |
    (1) For any ledger whose meta carries a Python-owned coda/fact value,
    assert that value appears byte-identically at least once in the
    corresponding final row's text -- anchor on the durable meta value with a
    substring/endswith test, never on a fixed separator string, since the
    separator itself is conditional on other flags.
    (2) Feed the clean stage a synthetic row built from a bridge + protected
    coda, same shape as production, and assert the protected row is never the
    SUBJECT of a judge call -- not merely that the text came back similar.
    Similarity cannot distinguish "protected" from "rewritten into something
    close", which is why the original defect survived a green suite. Assert on
    the row under judgement, not on the whole prompt: the protected text
    legitimately appears inside a NEIGHBOURING row's context window, and
    banning it from the prompt entirely fails on correct behaviour.
    (3) Prove the fixture is not self-fulfilling: run the identical ledger
    WITHOUT the marker and assert the fact is destroyed, so the test measures
    the guard rather than an uncleanable input.
    (4) Assert the ordinary rows of the same speaker role ARE still judged, so
    the guard cannot grow into a general exemption.
    (5) Statically assert the emitter imports the shared marker constant rather
    than hardcoding its string, walking the AST so a mention in a docstring
    cannot satisfy it.
    (6) Close the fixture gap directly: extend whatever measurement rig proved
    the clean stage safe so its planted ledgers include at least one row
    carrying a protected span -- the original miss was a rig that could not
    have caught this by construction.
  tags: [content-ownership, model-rewrite, field-authority, ledger-clean, protected-span, deterministic-fact, silent-deletion, receipt-mismatch, fixture-gap, producer-consumer-constant, xref-12.49, xref-12.54, xref-12.60, xref-12.86]
  legacy_id: "OTR-PBUG-20260815-01-clean-stage-deletes-source-attribution"

- id: "12.104"
  phase: 12
  area: a-proof-minted-before-an-authorized-mutator-must-learn-the-mutator-runs-and-reconcile-transactionally
  symptom: |
    A finished job dies at its own integrity audit, on its own legitimate
    output, long after the expensive work completed. Measured: a content-owned
    story lane raised "line receipt mismatch for l004" 13.6 minutes in --
    script written, cast built, score composed -- and l004 was provably the
    FIRST row a sanctioned repair pass had rewritten, while the rows that pass
    left alone (l001, l002) sailed through the same audit. Nothing is corrupt
    and the repair was correct; the receipt simply describes an instant that no
    longer exists. The failure rate tracks how dirty the draft was, so the lane
    fails intermittently and a clean draft hides the defect entirely -- which
    is also why a green suite says nothing about it.
  cause: |
    An acceptance proof hashes canonical content at mint time and the audit
    re-hashes the live content later. That contract is exact only while NOTHING
    runs in between, and it was written when nothing did. Sanctioned passes
    were then inserted into the window (a model-driven repair pass, and a
    cleanup pass that can blank an item out of the covered set entirely), and
    neither was ever taught to exist by the proof -- so every legitimate edit
    reads as tampering.
    THE SNAPSHOT'S VALIDITY WINDOW IS A PIPELINE FACT, NOT A CONSTANT. It
    shortens the moment anyone inserts a stage between the mint and the check,
    and nothing in the proof's own code changes when that happens: there is no
    compile error, no failing test, and no reviewer signal. The proof keeps
    asserting a contract the pipeline quietly stopped honouring.
    The second half is a failure-mode defect rather than a proof defect: the
    audit's only verb was "raise". A proof that could not be reconciled had no
    outcome available to it except killing work that was already finished.
  fix: |
    Teach the proof that a NAMED, CLOSED SET of authorized stages may run
    inside the window, and make the record DETECTIVE rather than permissive: a
    transition receipt naming the stages, exactly which ids moved, and the
    before AND after hash of each -- so an unattributed mutation still fails
    exactly as loudly as before. Widening the audit's tolerance (fuzzy
    matching, "close enough" comparison, skipping whatever the repair pass
    touched) is the WRONG fix: it hides real corruption along with the false
    positive, and the false positive is the only part that was wrong.
    CAPTURE ONE WINDOW AROUND EVERY AUTHORIZED STAGE, never one receipt per
    stage. Per-stage chaining is impossible by construction -- the second
    stage's before-state is the first stage's output, so it can never equal the
    acceptance the chain must start from. Stamp once, from one emission point,
    and refuse a second, differing stamp.
    Bind the chain to THIS acceptance using the parent receipt's digest, not
    merely to content that happens to hash the same: ids repeat across runs, so
    before-state equality alone lets a transition be lifted from one artifact
    onto another.
    Emit NOTHING on a no-op, so an untouched artifact keeps validating through
    the unchanged path and the marker's presence always means something
    happened.
    THEN MAKE THE WINDOW A TRANSACTION. Snapshot before the first authorized
    stage; reconcile after the last one and before anything derives from the
    final content. If the reseal cannot be PROVED, restore the accepted state,
    stamp a durable degradation receipt naming the cause, and CONTINUE. The
    repair is what gets sacrificed, never the finished work.
    Snapshot the CONTAINERS, not a hand-listed set of fields. A field list goes
    stale the first time a stage learns to write one more key, and a partial
    restore leaves a state that is neither the old one nor the new one. Include
    any IN-MEMORY proof state a stage holds: a document-only copy cannot
    restore an object attribute, and a finalizer left holding post-repair
    content will fail a perfectly good rollback.
    Restore IN PLACE. Callers hold aliases to those containers; rebinding them
    leaves every later write landing in a detached copy the artifact never
    sees -- a silent hole shaped exactly like a working artifact.
    Do not leave a rolled-back stage's own telemetry behind: a repair receipt
    describing edits that no longer exist tells every downstream reader that
    items were touched which were not. Move it into the degradation receipt so
    nothing is lost and nothing lies.
    DO NOT re-run the reseal to verify the rollback. The reseal is usually the
    thing that just failed, so calling it again reports the same error and
    labels a good rollback corrupt; verify with the read-only validator
    instead.
  verify: |
    (1) Mutate one item inside the window and assert the audit PASSES and the
    artifact still carries the mutated content. The regression is the death, so
    the test must exercise the whole mint -> mutate -> audit path, not the
    receipt in isolation.
    (2) Assert the transition names EXACTLY the ids that moved, in BOTH
    directions. An under-declared change is corruption; an over-declared one is
    a receipt that names innocent items, which is an audit trail nobody can
    trust in detail.
    (3) Assert an UNATTRIBUTED mutation still raises, calling the fail-loud
    primitive directly. This is the assertion that proves the fix is not a
    widened tolerance, and it is the one a future "simplification" will try to
    delete.
    (4) Assert a no-op emits no marker and leaves the artifact byte-identical.
    (5) Force the reseal to fail and assert ALL of: no exception escapes; the
    artifact is restored to the accepted state; the read-only validator passes
    on the restored state; the degradation receipt names the cause; no
    transition marker survives; and the rolled-back stage's telemetry is gone
    from the artifact.
    (6) Corrupt the in-memory proof state after the failure and assert the
    rollback brings it back -- the failure mode a document-only snapshot cannot
    even detect.
    (7) Assert the restore keeps the SAME container objects by IDENTITY, not
    equality, so an aliasing caller keeps writing into the live artifact.
    (8) Assert END TO END that the pipeline actually OPENS the transaction: run
    the real tail with a stage stubbed to mutate an item, then validate. A
    unit-tested transaction nobody calls is dead code, and this defect's whole
    shape is a stage that shipped and ran dormant.
    (9) Cover the sibling lane that holds NO in-memory proof object. One shared
    contract must cover both, or the lane without the object silently gets no
    protection and nothing fails to say so.
  tags: [acceptance-proof, receipt-validity-window, authorized-mutation, transition-receipt, transactional-rollback, degradation-receipt, in-memory-state, container-aliasing, detective-not-permissive, no-op-emission, dead-wiring, intermittent-failure, xref-12.49, xref-12.86, xref-12.103, xref-12.105]
  legacy_id: "OTR-PBUG-20260815-02a-authorized-clean-window-breaks-the-acceptance-receipt"

- id: "12.105"
  phase: 12
  area: a-repair-loop-diagnostic-must-state-the-required-shape-not-only-the-offense
  symptom: |
    A bounded repair/retry ladder exhausts all attempts re-emitting the SAME
    malformed token/output, even though the ladder mechanically does carry the
    rejected draft plus its defect list into the next turn. Measured: a
    terminal-delimiter parser required a literal `END.` (with period); the
    model wrote bare `END` on every rung across four attempts, because the two
    reported defects (a bad line shape, a missing terminal marker) describe
    what is wrong with zero indication of the one-character fix that would
    satisfy them.
  cause: |
    The defect/diagnostic text a repair turn receives states the OFFENSE
    ("this line's shape is bad", "the terminal marker is missing") but never
    states the REQUIRED SHAPE (the exact accepted string or pattern). A model
    has no way to infer "add a period" from being told its output is malformed
    and missing -- those are two symptoms of one omission, not two independent
    facts it can reason its way out of. Because the repair mechanism (carrying
    the rejected draft plus defects forward) LOOKS complete -- it does feed
    context forward -- the missing ingredient (the target) is easy to miss in
    review; the ladder's plumbing is not the defect, its payload is.
    The validator half compounds it: a delimiter regex that demands ornament
    the model has no reason to supply turns one plausible output into two
    reported defects, which reads in the log as a bigger problem than the
    single missing character it is.
  fix: |
    Every defect a repair loop reports must carry, alongside what is wrong, a
    positive statement of what would be accepted -- the exact required
    literal, an example of the accepted shape, or a regex/grammar description
    a small model can pattern-match against. Where the accepted set is small
    (a fixed terminal delimiter, a fixed enum), show the literal values
    directly in the defect text, not merely the pattern that validates them.
    Give the new diagnostic its OWN helper rather than adding a branch to an
    existing repair note that answers a different question from different
    defect data -- one function producing two unrelated diagnoses teaches the
    next reader the wrong rule for their defect. Make each note self-silencing
    so a repair turn carries exactly the rules its own defects call for.
    Source the advertised literals from the validator's own grammar, and
    assert the two cannot drift: a diagnostic that names a form its validator
    rejects teaches a wrong target, which is worse than saying nothing.
    Separately, widen the validator to the forms a model actually produces --
    but only to an enumerated set. Widening a terminal delimiter into "anything
    containing END" stops it being structural, and the parser must still be
    able to tell the end of the script from a line of dialogue about endings.
  verify: |
    (1) For every accepted terminal/delimiter form the parser recognizes,
    assert the repair-turn defect text contains that literal string verbatim,
    and assert the parser accepts every form the note advertises -- a
    drift test in both directions, not just one.
    (2) Construct a fixture whose only defect is the ONE-CHARACTER gap (bare
    `END` vs `END.`) and assert the repair ladder converges within its normal
    budget once the defect text names the required literal -- this is the
    regression that matters, it is exactly the input that exhausted the ladder
    live.
    (3) Assert the note is SILENT for unrelated defects, so it cannot pad every
    repair turn with every rule until the one that matters is lost.
    (4) Content-bearing, trailing-content and unpaired-bracket variants must
    still fail loud -- the fix must not turn the validator permissive.
    (5) BUILD THE FIXTURE FROM THE REAL DEFECT RECORD, not a hand-rolled stub.
    A stub that invents an attribute name the producer never sets (a `.kind`
    string where production sets a `.code` enum) lets a helper that can never
    fire in production pass a green suite -- the test agrees with the bug.
  tags: [repair-loop, retry-ladder, diagnostic-design, required-shape, unrepairable-by-construction, markup-parser, terminal-delimiter, defect-class-sweep, test-stub-drift, xref-11.26, xref-11.35, xref-12.103]
  legacy_id: "OTR-PBUG-20260815-03-fable2-end-delimiter-repair-loop"
- id: "12.106"
  phase: 12
  area: a-generation-request-sized-from-a-schema-ceiling-can-exceed-the-models-entire-context
  symptom: |
    A model pass fails 100% of the time on a given model with a transport-level
    budget error naming three numbers that do not add up -- "prompt requires
    1203 input tokens, requested_output=8320, context_cap=8192 leaves only 6989
    output tokens". Measured: a story lane died at 10:18 on a live headless
    render, after the expensive upstream passes had already succeeded. The
    prompt size in the message is a RED HERRING and sends readers off trimming
    prompts: 8320 exceeds the 8192 context outright, so the request could not
    have been served by an EMPTY prompt either. The suite is green throughout.
  cause: |
    The per-call `max_new_tokens` was a CONSTANT derived from the pass's SCHEMA
    ceiling -- max_containers x max_items_per_container x tokens_per_item +
    envelope -- where the schema ceiling deliberately carries a headroom
    multiplier (here 2x) so the SCHEMA can accept more than any legal artifact
    contains. That multiplier is correct for a GUARD and wrong for a REQUEST: it
    asks for exactly N times the output any real job needs, and once the
    doubled number crosses the model's context window the pass becomes
    unsatisfiable rather than merely wasteful. Nothing in the code says
    "request" versus "ceiling", so the same expression served both roles.
    IT WAS INVISIBLE BECAUSE THE TESTS PINNED THE CONSTANT. Assertions of the
    form `assert job["max_new_tokens"] == THE_CONSTANT` cannot fail when the
    constant is impossible -- they re-assert the defect. The suite agreed with
    the bug, so only a live render could find it.
  fix: |
    Size the request to the JOB IN HAND, not to the schema maximum: derive
    `max_new_tokens` from the actual item count this call was handed
    (`len(items) * tokens_per_item + envelope`). Leave the schema's own
    max_length guard exactly where it is -- right-size the job, never raise the
    guard.
    THAT ALONE IS NOT ENOUGH, AND THIS IS THE HALF THAT GETS MISSED. If the job
    SIZE is chosen by the model, sizing the request to it only moves the same
    death behind a data condition. Measured on the same defect: the first fix
    replaced the impossible constant with a per-job request and shipped -- but
    the schema accepted twice the intended items per container AND the upstream
    prompt literally instructed the model "at most <schema ceiling> items per
    container", so a legal, actively invited draft reproduced the exact
    unfittable number. It bites below the ceiling too: at 7/8ths of it the
    request plus a measured prompt already exceeded the window.
    So BOUND THE CALL, not just the estimate: split the job into chunks that fit
    by construction, sized from the REAL topology rather than the schema
    ceiling, and keep the full context visible in every chunk so only the
    RETURN set narrows and the model still sees what it is reasoning about. In
    the common case the whole job is one chunk and the behaviour is unchanged.
    DO NOT fix it by lowering the ceiling advertised in the prompt instead. The
    schema headroom exists precisely because models overshoot what they are
    told, so an advertised limit is guidance where this must be a guarantee --
    and narrowing it changes the artifact's shape for no correctness gain.
    DO NOT silently clamp the request to the context window. A clamp returns a
    truncated artifact that then fails a downstream completeness validator with
    a misleading message; a deterministic pre-flight refusal that names the
    three numbers is information. If the right-sized job still does not fit,
    that is a real capacity problem and it should say so.
    DO NOT "fix" it by raising the model's context or swapping models -- the
    request was wrong, not the model.
    Record the LARGEST request the run actually made in the call journal instead
    of the constant. A receipt naming a number no call ever used is precisely
    how an impossible 8320 sat in every journal unread.
    Then SWEEP THE CLASS ARITHMETICALLY rather than by inspection: enumerate
    every generation budget in the package and compare each against the smallest
    shipped context window. It is a two-minute computation and it converts "we
    think this was the only one" into a measurement (it was, out of four).
  verify: |
    (1) Assert the PROPERTY, never the constant: the request equals the
    job-sized formula for the items actually passed, AND is strictly less than
    the smallest shipped context window. The second half is the assertion that
    would have caught this; the first half alone would have been rewritten to
    match the bug.
    (2) Add a static sweep over every declared generation budget asserting each
    is below that window, so a NEW pass cannot reintroduce the class.
    (3) Prove the sweep is not vacuous: feed it a deliberately impossible budget
    in a fixture and assert it fails.
    (4) Exercise the pass at its LARGEST legal job size, not a two-item toy --
    the toy fits, which is why the schedule tests never noticed. Walk EVERY size
    from one to the schema ceiling and assert each one's request still fits;
    testing only the intended size passes on a fix that leaves the defect
    reachable by a legal draft.
    (4b) Drive the real splitting function with an over-large job and assert
    three things: it split, no item was lost or reordered, and every chunk still
    carries the whole job's context. A chunker that quietly drops the tail is a
    worse bug than the one being fixed.
    (4c) Assert the ORDINARY job still takes exactly ONE call, so the split
    stays invisible in production and cannot silently multiply model spend.
    (5) When a pre-flight refusal is the correct outcome, assert the message
    names input tokens, requested output AND the cap. A budget error that
    reports only one of the three sends the next reader to the wrong file.
  tags: [token-budget, context-window, schema-ceiling-vs-request, model-controlled-job-size, chunk-to-fit, max-new-tokens, unsatisfiable-request, test-pins-the-constant, suite-agrees-with-the-bug, arithmetic-sweep, call-journal-receipt, xref-12.86, xref-12.104, xref-12.105]
  legacy_id: "OTR-PBUG-20260815-10-scene-review-request-exceeds-context-window"
- id: "12.107"
  phase: 12
  area: a-configured-widget-that-is-never-forwarded-is-inert-while-every-mapping-test-passes
  symptom: |
    An operator-facing control does nothing on the code path that matters, and
    nothing anywhere says so. The widget exists, its choices are correct, its
    value-to-behaviour mapping has a passing unit test, and the feature it
    controls simply never happens. Measured: a cameo knob offering "always
    include" produced episodes with no cameo for months, while the graph, the
    dropdown and the mapping dict were all correct.
    THE TELL IS A SPLIT. The control works on one path and not another: a
    legacy in-line branch read the value directly from the entry function's
    local variable, so anyone exercising THAT path saw it work, while every
    dispatched lane received a resolved-inputs dict that never carried the key.
    Which path a reader happens to test decides whether the bug appears to
    exist.
  cause: |
    The value was resolved but never FORWARDED. The entry function accepted the
    widget, a resolver built the dict every downstream consumer reads, and the
    call site between them omitted that one keyword argument. Nothing raises:
    the resolver has a default, the consumers use `.get()`, and a missing key
    is indistinguishable from a deliberate "not requested".
    IT SURVIVES UNIT TESTS BY CONSTRUCTION. The natural test asserts the
    MAPPING -- `assert FORCE_MAP["always include"] is True` -- which is a
    statement about a dict literal and stays green no matter who reads it. A
    mocked resolver is worse than no test: mocks accept any keyword, so the
    omission is invisible precisely in the test written to cover it.
    A SECOND HAZARD RIDES ALONG, and it is why the failure is silent rather
    than loud: the mapping was read with `.get()`, which returns None for an
    unknown key -- and None was ALSO the encoding for "the default behaviour".
    So a TYPO in the widget value degraded to the default while looking like an
    explicit choice, and the two states were indistinguishable downstream.
  fix: |
    Resolve the control ONCE, in the resolver, and make every consumer -- the
    legacy path included -- read it from the resolved dict rather than from the
    entry function's local. One resolution site is what makes two paths
    incapable of disagreeing.
    Validate EXACT membership at that site and FAIL LOUD on an unknown value,
    naming the legal choices. Never map unknown to the default: an
    unrecognized input and a deliberate default must not share an encoding, or
    a typo is unobservable.
    Do this BEFORE any expensive work in the resolver (network fetch, model
    load), so a mistyped widget costs a millisecond rather than a round trip.
  verify: |
    (1) Assert ARRIVAL, not mapping: call the resolver with each legal choice
    and assert the resolved dict carries the expected value under the key the
    consumers actually read. A mapping-dict assertion cannot catch this class.
    (2) Prove the FORWARDING at the call site STRUCTURALLY rather than with a
    mock -- parse the module and assert the argument appears in that call's
    keywords. A mock resolver accepts anything and passes against the defect.
    Assert there is EXACTLY ONE such call site while you are there; a second is
    a second place to forget.
    (3) Assert an unknown value RAISES and that the message names every legal
    choice, so the failure is self-describing.
    (4) Assert the default path is unchanged: omitting the control entirely
    must behave exactly as the documented default, or an old saved graph with a
    short widgets_values vector silently changes behaviour.
    (5) Where the control has a live consumer, prove it END TO END on a real
    run -- force the non-default value and assert the artifact shows the
    effect. A green unit suite proved nothing here for months.
  tags: [widget-reaches-nothing, inert-control, missing-forwarding, resolved-inputs, one-resolution-site, get-returns-none, typo-degrades-to-default, mock-hides-the-omission, ast-call-site-assertion, legacy-path-split, xref-12.86, xref-12.104]
  legacy_id: "OTR-PBUG-20260811-03-lemmy-cameo-widget-inert-on-dispatched-lanes"
- id: "12.108"
  phase: 12
  area: an-engine-owned-negative-prompt-vetoes-the-style-the-config-selected
  symptom: |
    A pipeline that offers selectable visual styles renders one output that
    contradicts its own setting, and does so INCONSISTENTLY inside a single
    piece of work. Measured: a 74-second episode configured as "cartoon" cut
    between an animated short, a live-action photograph and a painting --
    bookends cartoon, one character beat photoreal, a later beat painterly.
    THE TELL IS THAT THE PROMPTS ALL AGREE. Every generated positive prompt
    correctly said "bright cartoon illustration", the style config was right,
    and the images diverged anyway -- so a text-level consistency audit passes
    while the pixels disagree. Any detector that reads prompts is blind here.
    It looks like a gradient rather than a switch: where the positive was
    style-worded the style won, and where the positive was dense with other
    detail (an anatomy-heavy face description) the veto won.
  cause: |
    The NEGATIVE prompt lived in the ENGINE as a hardcoded house-style constant
    and was blind to the selected style. On a cartoon render the engine sent
    positive "bright cartoon illustration" AND negative "cartoon, illustration"
    in the same sampler call: the engine suppressed exactly what the
    configuration asked for. The constant was tuned when one look existed and
    was never re-scoped when styles became selectable.
    IT IS INVISIBLE AT cfg 1.0 AND LIVE ABOVE IT. A negative has no effect on a
    guidance-distilled engine (no unconditional branch), so the same constant
    is inert on one engine and decisive on another -- which is why it survives
    review on whichever engine the reader happens to open.
    AN AMPLIFIER TURNS ONE BAD OUTPUT INTO MANY. The engine that accepted a
    reference image propagated the first vetoed result as the identity anchor
    for every later related render, so a single mis-conditioned still became
    the look of the whole work -- consistency machinery faithfully spreading
    the wrong answer.
    A SECOND DEFECT HID INSIDE THE FIRST: the request already carried a
    per-object negative field, the dispatcher populated it, and NO engine read
    it. The value was computed, merged, carried and silently discarded, so a
    reviewer greps the field, finds it populated, and concludes it is wired.
  fix: |
    Move the STYLE half of the negative to whatever owns style -- the style
    pack/profile -- and leave the engine only an anti-ARTIFACT floor with no
    style opinion in it. The default style keeps the historical string verbatim
    so the shipped look is byte-identical and the change is provably scoped.
    COMPOSE the style negative with any per-object negative; never let one win.
    They are orthogonal axes (a look versus a subject constraint), so any
    precedence order silently drops one of them.
    Make the new field KNOWN-but-OPTIONAL, not required, when frozen records
    embed a copy of the config and verify it by hash: a required key fails
    every historical record on the missing-key path, and injecting a default to
    compensate changes the bytes and trips the hash instead.
    Resolve SELF-CONFLICT mechanically rather than by editing one string: drop
    any negative phrase that the same profile's own positive surfaces ask for.
    That holds for profiles authored later and for runtime-composed ones, so
    the class cannot return. Compare comma-separated PHRASES, not bare words --
    "plastic skin" must not be dropped because a positive wants realistic skin.
    Keep a fallback: an empty composed negative must fall back to the artifact
    floor, never to nothing, or historical records lose protection they had.
  verify: |
    (1) Assert the engine constant carries NO style vocabulary and DOES carry
    the artifact terms. This is the regression that makes the whole fix
    cosmetic if it silently returns.
    (2) For every shipped style profile, assert its negative contains no phrase
    that its own positive surfaces request. Parametrize over the profiles
    discovered on disk, not a hardcoded list, or a profile added later escapes
    the check entirely.
    (3) Assert the engine HONOURS a request-supplied negative -- pass a
    non-empty value and assert it reaches the sampler. Grepping that the field
    is populated proves nothing; the defect was that nobody read it.
    (4) Assert an EMPTY composed negative falls back to the artifact floor
    rather than to an empty string.
    (5) Assert a profile WITHOUT the optional key still validates, and that a
    non-string value is still type-rejected -- optional must not mean
    unvalidated.
    (6) Record cfg per engine alongside the negative in any receipt: a negative
    logged without its guidance scale can be accurate and still misleading,
    because below the threshold it conditioned nothing.
  tags: [engine-owned-style-constant, negative-vetoes-positive, style-blind-default, cfg-1-inert-negative, reference-image-amplifier, request-field-never-read, compose-not-precedence, known-but-optional-schema, frozen-record-hash-forbids-defaults, self-veto-resolution, phrase-not-word-matching, prompt-audit-cannot-see-pixels]
  legacy_id: "OTR-PBUG-20260817-01-image-engine-negative-vetoes-selected-visual-style"
- id: "12.109"
  phase: 12
  area: hand-built-graph-never-adopted-the-family-input-convention
  symptom: |
    An engine/adapter that builds its inference graph in code renders
    successfully forever and nothing ever goes red. No exception, no dangling
    reference, no failing test -- and, unlike a regression, no operator saying
    "it used to look better", because it never did. Output is plausible but
    subtly off: weaker prompt adherence (a named material or subject attribute
    the prompt asked for does not show up), occasional spurious text-like
    marks, and background that resolves to mush where the prompt described a
    scene. Nobody can point at a good build, because there has never been one:
    the defect has been present since the adapter's first commit.
    THE DISCOVERY IS ALWAYS ACCIDENTAL. It surfaces when somebody reads the
    host framework's own node source for an unrelated reason, not from any
    test, review or audit the project runs on itself.
  cause: |
    The host framework ships a DEDICATED node for that model family precisely
    because the family needs special input handling -- most often an
    instruction-style wrapper the checkpoint was TRAINED on (a system line plus
    a separator token, prepended to the user prompt). A hand-built graph wires
    the GENERIC node instead, so every generation runs out-of-distribution.
    Nothing complains, and cannot: the generic node is a legal, correctly typed
    producer for that slot, returns a valid conditioning, and samples cleanly.
    The convention is a TRAINING fact, not a schema fact, so no type check,
    graph validator or dead-reference scan can see it. The dedicated node's
    existence is the only written record that the convention exists at all.
    THE ASYMMETRY IS WHAT KEEPS IT HIDDEN, AND IT ALSO CREATES FALSE POSITIVES.
    For some families the wrapper is applied INSIDE the tokenizer, so the
    generic node is already correct and the dedicated node adds only unrelated
    capability. An author who checks one such family concludes the generic node
    is fine and generalizes -- and an auditor who instead flags every unused
    dedicated node reports defects that are not there.
  fix: |
    Audit CONFORMANCE AGAINST THE RUNTIME, not against your own history. Read
    the live node inventory from the running host, list the dedicated
    per-family nodes in the conditioning space, and compare that list against
    the node classes each of your hand-built graphs actually wires. Scope the
    audit to the engines actually reachable in your shipped configuration;
    auditing dormant ones spends the same effort for no live risk.
    ADJUDICATE EACH HIT BY READING THE TOKENIZER, NEVER THE NODE NAME. Open the
    family's text-encoder implementation and determine whether it applies the
    wrapper itself. Wrapper inside the tokenizer -> the generic node is correct
    and the dedicated node is not owed. No wrapper -> the caller must supply
    it, and the generic node is a live defect. Skipping this step converts the
    audit into a false-positive generator.
    Prefer COMPOSING the trained string into the generic node over swapping to
    the dedicated node when the two are otherwise equivalent -- verify that by
    reading both implementations, which are usually the same two encoder calls
    with a concatenation in front. Composing keeps ONE graph shape (the two
    node classes take different input names, so supporting both forces the
    builder to branch on which class resolved), keeps the composition unit-
    testable with no framework import, and avoids depending on the dedicated
    node being installed. Make the composition IDEMPOTENT so a double-composed
    prompt cannot double-prefix.
    Compose on EVERY conditioning branch the sampler reads, positive and
    negative alike, whenever the dedicated node has no branch-specific mode --
    wiring one of those nodes into each side is what conformance means. Check
    the guidance scale first: below the threshold where an unconditional branch
    exists, the negative conditions nothing and the question is moot.
    KEEP THE COMPOSED STRING OUT OF ANY UPSTREAM IDENTITY. If a cache key,
    content hash or derived seed is computed from the prompt, it must keep
    reading the RAW request text; compose only inside the graph builder.
    BUMP THE ENGINE/ADAPTER VERSION IN THE SAME CHANGE. The fix alters encoder
    text, not prompt text, so every prompt-derived cache input is unchanged and
    a cached pre-fix result stays valid by every test the cache applies. Without
    the bump, a resumed job re-serves the out-of-distribution output forever and
    the fix is silently retroactive to nothing.
  verify: |
    (1) Assert the composed string is BYTE-IDENTICAL to what the host's
    dedicated node builds, with the framework's own system/wrapper constants
    reproduced verbatim in the assertion. This test is the drift detector: it
    is the only thing that will notice when the upstream constants change.
    (2) Assert composition on BOTH the positive and negative branches, and that
    each carries exactly ONE separator token.
    (3) Assert idempotence -- composing an already-composed string returns it
    unchanged -- and cover the empty-prompt edge, which must match what the
    dedicated node emits for empty input rather than being special-cased away.
    (4) Assert the raw request text survives in the params/request the
    dispatcher hashes, so cache keys and derived seeds provably do not move.
    (5) Assert the adapter version changed, or pin the cache key over a
    known input pair so a silent revert fails.
    (6) A/B ON PIXELS AT A FIXED SEED, and keep the pre-fix arm as a permanent
    flag on the smoke harness rather than deleting it. Structural divergence is
    not proof the output improved; this class is visible only in comparison.
    Treat a single pair as evidence of MATERIAL CHANGE and direction, never as
    a quality measurement across the lane.
    (7) Keep any harness that claims to mirror the engine recipe importing the
    real composition function rather than re-typing the string, or the mirror
    quietly stops being one.
  tags: [hand-built-graph, dedicated-family-node-unused, trained-input-convention, out-of-distribution-forever, no-good-build-to-diff, tokenizer-self-wrap-discriminator, false-positive-audit, compose-over-node-swap, idempotent-prompt-composition, raw-text-feeds-cache-key, adapter-version-bump, fixed-seed-pixel-ab, harness-must-import-not-retype]
  legacy_id: "OTR-PBUG-20260817-02-lumina-engine-skipped-trained-prompt-start-convention"
- id: "11.61"
  phase: 11
  area: two-naming-authorities-let-an-upstream-plan-name-leak-into-an-assigned-record
  symptom: |
    A per-record generated field describes the WRONG PERSON. The record's own
    identity is replaced by a name from an earlier planning artifact, and that
    other person's attributes follow it -- face, build, bearing, delivery, the
    whole portrait. Measured: a three-row cast in which two rows were
    contaminated, one of them reading "Late 50s, Seasoned yet vulnerable
    LUCILLE PENNY. Face: ... Voice: warm, calm urgency, like a mother in a
    storm" on a row named RICK STEINER and typed male. Across the archive, 28
    rows in 20 of the 124 record sets that carry an upstream named cast -- 16%
    -- and the most recent was produced the day before the sweep, so this is
    live behaviour and not a retired regime.
    Nothing errors and nothing is malformed. The field is non-empty, on-format,
    schema-valid and well written; it is simply about somebody else. The
    contaminated string is then copied VERBATIM into the downstream image
    prompt, so the picture is painted of the other person too, and the wrong
    record ships to every consumer that reads either surface.
  cause: |
    TWO AUTHORITIES NAME THE SAME ENTITY, and the pass that must choose between
    them is never told which one wins. An upstream generative planning step
    (pitch, brief, treatment, outline) invents entity names as part of its
    prose. A downstream deterministic assigner then overrides those names with
    its own -- pool draws, roster rows, ids. The per-record generation prompt
    is handed BOTH: the upstream text goes in as story context, the assigned
    name goes in as a labelled field, and no precedence is stated anywhere.
    The template makes it easy to get wrong. A format string of the shape
    "<age band>, <story-linked role>. <attributes>" reserves a free-text slot
    immediately after the age band, and when the surrounding context keeps
    naming people, a NAME is an entirely plausible filler for "story-linked
    role". The model is not malfunctioning; it is resolving an ambiguity the
    prompt created, in the direction the context weights.
    It survives every guard because it is a SEMANTIC mismatch wearing correct
    syntax: name-shape validators pass (it IS a well-formed name), length and
    schema validators pass, non-empty passes, and any per-field test passes.
    It also hides behind adjacent audits: this was found only because a GENDER
    audit tripped on a female-coded name inside a male-typed row, and had it
    been repaired as the gender defect it appeared to be, the wrong-person
    prose would have survived with the gender cue sanded off -- a visible
    defect converted into an invisible one.
  fix: |
    Declare ONE naming authority and enforce it at the boundary, not in the
    prompt. Decide which pass owns entity names. If the downstream assigner
    owns them, then every upstream text that will be shown to a later pass must
    have the superseded names REWRITTEN to the assigned ones (or removed)
    before it enters any per-record prompt. Reconcile the artifact; do not ask
    the model to arbitrate between two authorities you handed it.
    DO NOT fix it by instructing the model harder. "Use the Name field, not
    names in the story" is persuasion, and an instructed model is still a
    model; the guarantee has to be structural -- the conflicting name must not
    be in the context, or the output must be checked after.
    DO NOT fix it with fuzzy name repair. The reflex fix for stray names in
    generated text -- match them to the nearest roster entry and rewrite -- is
    ACTIVELY HARMFUL here: it rewrites the foreign name to the record's own and
    leaves that other person's face, bearing and delivery prose in place. The
    record still describes the wrong human and now nothing points at it.
    The structural gate is an ENSEMBLE-SCOPED FOREIGN-NAME CHECK: reject any
    record whose generated field contains a proper name that NO record in the
    ensemble owns. Scope matters and both obvious variants are wrong. "No
    record may name ANOTHER record" is wrong in both directions -- it flags
    correct relational prose ("foil to the Time Traveler", "Rosalind's
    confidante"), which is legitimate and desirable, and it MISSES this defect
    entirely, because the leaked name belongs to no record at all. On the
    corpus that produced this entry the sibling-name variant returned 47 hits
    of which roughly 45 were correct relational writing, and it did not flag
    the record the bug was reported from.
    Carry the repair to every DERIVED surface in the same change. The
    contaminated string had already been copied into the image prompt, so a fix
    that repairs only the source field leaves the rendered artifact wrong and
    the two surfaces disagreeing.
  verify: |
    (1) Sweep the ARCHIVE, not only new runs. For every record set that carries
    both an upstream named cast and an assigned roster, assert no generated
    field contains a name from the upstream cast that no roster row owns. This
    class ships silently for months, so a forward-only check measures nothing.
    (2) Pin the known-bad artifact and require the check to flag EXACTLY the
    contaminated records in it -- not the set, the rows. A detector that only
    reports "this episode is dirty" cannot be used to repair.
    (3) Prove the naive variant is not the fix: assert the sibling-name check
    passes on a legitimate relational description AND fails to flag the
    known-bad record. Without this, the cheap check gets adopted and the defect
    keeps shipping under a green gate.
    (4) Assert the DERIVED surface as well as the source field. Anywhere the
    generated text is copied verbatim downstream, the same assertion applies to
    the copy, or a green source check certifies a wrong artifact.
    (5) Prove the guard fires: disable the name reconciliation and require the
    sweep to go red. A check that stays green with the reconciler removed is
    measuring the generator, not the guard.
    (6) Statically assert the boundary. The function that builds the per-record
    prompt must receive reconciled upstream text -- walk to the call site and
    assert the raw upstream field is not what gets inlined, so a later refactor
    cannot quietly restore the two-authority prompt.
  tags: [llm, prompt-authority, two-naming-authorities, entity-identity, cross-record-contamination, upstream-plan-vs-assigner, free-text-slot, semantic-mismatch-correct-syntax, ensemble-scoped-check, relational-mention-false-positive, fuzzy-repair-launders-the-defect, derived-surface, archive-sweep, adjacent-audit-found-it, xref-10.03, xref-10.08, xref-12.103]
  legacy_id: "OTR-PBUG-20260817-03-upstream-plan-name-pasted-into-assigned-character-record"

- id: "12.110"
  phase: 12
  area: one-field-two-meanings-gate-the-consumer-on-the-lane-not-on-truthiness
  symptom: |
    A field is populated, correctly, on every lane -- and a consumer that reads
    it produces nonsense on some of them. Nothing is null, nothing is
    malformed, no schema complains, and the value is genuinely right for the
    lane that wrote it. Measured: a field naming "the work this episode adapts"
    was threaded to a narrator so it could announce the work by name. On the
    adaptation lanes it holds a play title and the announcement is correct. On a
    different lane the same field holds the PUBLICATION a post came from, so the
    narrator would have announced a scene from a magazine that has no scenes --
    on 56 of 98 live records, 57% of that lane. The consumer was new; the field
    and both its meanings had been correct and shipping for months.
  cause: |
    ONE FIELD ACQUIRED TWO MEANINGS, one per lane, and each was reasonable when
    it was added. The extractor has a per-lane branch -- lane A maps its title
    into the field, lane B maps its publisher into the same field -- and the
    field name describes only the first meaning. Nothing is wrong until a
    consumer arrives that means specifically the FIRST meaning and tests the
    field the obvious way: `if value:`. Truthiness cannot distinguish two
    meanings; it only distinguishes present from absent, and both meanings are
    present.
    The trap is that the field's own name argues for the mistake. A reviewer
    reading `work_title` reasonably concludes it holds the work's title, and the
    second meaning is visible only in the extractor's other branch, which nobody
    reads when wiring a new consumer.
    It also survives review by construction: a static reviewer that follows the
    producer finds the field always populated and declares the lane safe -- the
    error is not in either branch, it is in the ASSUMPTION that one name means
    one thing.
  fix: |
    GATE THE CONSUMER ON THE LANE, NEVER ON TRUTHINESS. Export the set of lanes
    for which the consumer's meaning actually holds, as a NAMED CONSTANT beside
    the extractor that creates the ambiguity, and have the consumer test
    membership in that set instead of testing the value. The name of the
    constant carries the distinction the field name could not.
    Record the MEASUREMENT beside the constant -- how many live records carry
    the other meaning -- so the next reader learns the field is overloaded
    without having to rediscover it.
    Do NOT rename or split the field as the first move if other consumers
    already read it correctly for their own lane: both meanings are load-bearing
    and a rename is a wider blast radius than the defect. Splitting is right
    only when a second consumer needs the second meaning explicitly.
    Do NOT special-case by matching the value's shape or content -- that is
    name-matching, it ships false positives, and it breaks the moment either
    lane's data changes.
  verify: |
    (1) Assert the gate is a MEMBERSHIP test against the exported constant, not
    a truthiness test on the value. Walk the AST if necessary -- an `if value:`
    reintroduced later looks harmless in review.
    (2) POSITIVE CONTROL, and this is the one that matters: assert a record from
    a lane where the meaning DOES hold passes the gate. Without it the gate is
    satisfied by a predicate that is false for everything, which is green and
    useless.
    (3) NEGATIVE CONTROL from real data: construct the other lane's record with
    its field populated, and assert the consumer declines it. Use the actual
    shape from the corpus, not an invented one -- the defect is that the value
    looks legitimate.
    (4) Sweep the corpus for how many records carry the second meaning and put
    that number in the test's message, so a future reader sees the blast radius
    without re-measuring.
    (5) Prove the consumer end to end on a real run of BOTH lanes. A static
    reviewer cleared the affected lane here by reading the producer module and
    finding nothing that wrote the field; the live records disagreed, and only
    the artifact settled it.
  tags: [overloaded-field, per-lane-meaning, truthiness-gate, named-constant, positive-control, static-audit-cannot-prove-behaviour, corpus-measurement, xref-11.61, xref-12.89]
  legacy_id: "OTR-item-F-work-title-means-two-things-across-lanes"
- id: "12.111"
  phase: 12
  area: an-instrument-that-overwrites-the-evidence-its-own-record-cites-by-hash
  symptom: |
    A qualification, approval or acceptance record cites an artifact BY SHA256 --
    a manifest, a key, a set of clips -- and the tool that produced that artifact
    writes to the same path every time it runs. Re-running it to refresh the
    evidence destroys the bytes the existing record names, so the record now
    points at a hash nothing on disk has. Nobody sees an error: the re-run is
    green, the files are present, and the citation is silently unverifiable.
    Measured: a voice-route qualification cited
    `<audition_dir>/MANIFEST.json` by sha256; the audition script defaulted to
    that directory and rewrote it. A second instrument in the same repo wrote a
    manifest cited by sha256 in THREE separate provisional records with no
    overwrite guard at all.
    The near-miss variant is worse than the miss: a re-run under CHANGED code
    can also produce BYTE-IDENTICAL artifacts, which looks like confirmation and
    is actually proof of nothing -- the instrument was bypassing the very code
    path that changed.
  cause: |
    THE INSTRUMENT AND THE RECORD HAVE DIFFERENT LIFETIMES AND NOBODY SAID SO.
    An audition script is written to be re-run; a qualification record is written
    to be permanent. The moment a record cites the script's output by hash, that
    output became an append-only archive, and the script's default output path
    became a destructive one. Nothing in either file states the dependency.
    A partial guard reads as a complete one. Refusing only when a specific file
    (`MANIFEST.json`) exists leaves every sibling artifact unprotected: the WAVs
    in a manifest-less directory, and -- the one that actually matters -- the
    separate `_KEY` directory holding the blinding map, which is what says which
    arm a human approved. A guard that names one filename teaches readers the
    hazard is handled.
  fix: |
    Make the instrument REFUSE to write into any non-empty output location, and
    make "output location" include every directory it touches, not just the one
    holding the file you thought of. Reject a path that exists and is not a
    directory; reject a directory that has any entry in it.
    Render to a NEW, dated or otherwise distinct directory per run, and let the
    record cite that directory. A new run is a new artifact; refreshing evidence
    in place is never the operation you want.
    Put the runtime INSIDE the artifact. A manifest a record cites by hash must
    carry the facts the record claims -- the live code fingerprint, the resolved
    parameters PER ARM, the reference id and its hash -- so the citation can be
    checked without trusting a second file that may have moved on.
    Do NOT solve this with a backup-before-overwrite step, a timestamp suffix
    bolted on inside the writer, or a `--force` that defaults on. The first two
    still destroy the cited path; the third makes the safe case opt-in.
  verify: |
    (1) Run the instrument twice against the SAME output directory and assert
    the second run exits non-zero and writes nothing. Assert on the exit code
    and on file mtimes, not on stdout text.
    (2) Assert the refusal covers a directory containing ONLY the sibling
    artifacts -- no manifest present, just clips -- and separately a
    key/secondary directory that exists while the primary does not. These are
    the two states a partial guard lets through.
    (3) Grep the repo for every writer of the cited filename and check each one
    has the guard. The defect class travels: fixing the instrument that bit you
    while its sibling stays unguarded is how the same outage recurs under a
    different name.
    (4) Re-hash every artifact a record cites and assert it still matches. This
    is the cheap standing check that catches a citation that has already rotted.
    (5) Prove that a re-run under CHANGED code produces DIFFERENT bytes. If the
    artifacts are byte-identical after a real code change, the instrument is
    bypassing the changed path and its output cannot qualify anything -- assert
    the instrument drives the production entry point, not a private shortcut.
  tags: [evidence-by-hash, append-only-artifact, overwrite-guard, partial-guard-reads-as-complete, sibling-instrument, audition-record, provenance-in-artifact, byte-identical-is-not-confirmation]
  legacy_id: "OTR-2026-08-18-audition-overwrites-cited-evidence"
- id: "12.112"
  phase: 12
  area: sequential-arm-loop-must-reset-total-state-not-assign-a-delta
  symptom: |
    A test harness or audition instrument runs N configurations ("arms") in
    sequence inside ONE process, blinded so the order is randomized. One arm
    means "use the defaults" and is written as an empty or partial override
    dict -- it names no keys, meaning to inherit whatever the code's own
    defaults are. Instead it silently inherits whatever the PREVIOUS arm in
    the shuffled order left set in process-global state (an env var, a module
    global, a singleton config). Because the shuffle decides which arm runs
    first, the contamination is non-deterministic across runs of the same
    harness -- it does not even fail the same way twice.
    Measured: a blinded audition rendered a "shipped defaults" arm
    immediately after a "ceiling disabled" control arm. The shipped arm's
    resolved settings matched the control's leftover value, not the code's
    actual defaults, and the qualification record built from that arm would
    have certified a build that was never rendered.
  cause: |
    The per-arm loop ASSIGNS only the keys the current arm's dict names:
    `for key, value in arm_env.items(): os.environ[key] = value`. An arm
    meaning "inherit the defaults" is naturally written by OMITTING those
    keys from its dict -- and omission does nothing to a key a PRIOR
    iteration already set. The loop is incremental (only ADDs), while the
    intended semantics are total (each arm's environment should be exactly
    what its own dict says, no more).
    This is invisible in code review because each arm's dict, read on its
    own, looks correct and complete -- the bug is only visible against the
    EXECUTION ORDER, which is exactly the thing a blinded/shuffled harness
    deliberately hides from the reader.
  fix: |
    Before applying an arm's overrides, POP every key any arm in the set is
    allowed to control -- not just the keys THIS arm happens to name -- then
    apply this arm's overrides on top of the now-clean state. Maintain the
    full set of controlled keys as one explicit constant the loop reads, so
    adding a new controllable variable to any arm's dict is impossible without
    also adding it to the reset list.
    Do NOT fix this by reordering arms, by re-running a specific arm first, or
    by memoizing "the previous arm's settings" to diff against -- all three
    leave the underlying incremental-assignment bug in place for the next
    added arm or the next shuffle seed.
  verify: |
    (1) Run the harness with a FIXED, non-default shuffle order that places
    the "inherit defaults" arm immediately after an arm with a NON-default
    override, and assert the inheriting arm's resolved/observed settings
    equal the code's actual defaults, not the preceding arm's values.
    (2) Repeat with the reverse order (defaults arm first) and assert the
    SAME result -- order-independence is the actual property being protected,
    not just one ordering.
    (3) If the harness records what it resolved (a manifest, a receipt), assert
    the recorded value for each arm matches what a fresh, isolated process
    would resolve for that arm's dict alone.
    (4) Grep every dict in the arm set for keys used by ANY arm; assert the
    reset list is a superset. A newly added controllable key that is not in
    the reset list reintroduces the bug silently.
  tags: [sequential-state, blinded-harness, env-contamination, incremental-vs-total-reset, shuffle-order-dependent, non-deterministic-across-runs, audition-instrument]
  legacy_id: "OTR-2026-08-18-audition-arm-env-contamination"
- id: "12.113"
  phase: 12
  area: a-downstream-passs-finished-output-fed-back-as-context-to-an-earlier-pass-forbidden-from-producing-it
  symptom: |
    A multi-pass LLM pipeline runs pass B (produces a short, factual,
    validated field) BEFORE pass A (writes a large free-text document, e.g.
    a whole script), then folds B's finished OUTPUT into A's INPUT context
    because A's prompt happens to serialize "everything known so far." A's
    system prompt separately instructs it never to produce content of B's
    kind ("a separate factual note is appended by the producer, you do not
    write it") -- but A can now SEE that exact content sitting in its own
    context. A small local model does not reliably honor "do not repeat this"
    when the thing not to repeat is right there to copy.
    Measured: pass A's output (a fictional bridge line) echoed pass B's
    output (a real-world fact) almost verbatim, word for word on the shared
    clause, even though pass A's prompt explicitly forbade stating any
    real-world fact.
  cause: |
    The prompt-assembly code does the generically correct thing --
    "serialize the full accumulating state object into the next prompt" --
    without asking whether every field in that state object is something
    THIS prompt wants the model to see. A field that is a LATER pass's
    finished, protected output looks, to the generic serializer, identical to
    every other field the model legitimately needs (cast, setting, premise).
    The negative instruction ("never state X") and the positive leak (X is
    sitting right there) are added independently, by different code paths, so
    nothing forces them to be checked against each other. A reviewer reading
    either the prompt TEXT or the state-passing CODE in isolation sees nothing
    wrong; the contradiction only exists in their combination at runtime.
  fix: |
    At the ONE call site that builds the forbidden pass's prompt, explicitly
    EXCLUDE the field(s) the model must not see from the serialized state
    (e.g. `model.model_dump(exclude={"the_field"})`), rather than trying to
    make the model resist a temptation you chose to put in front of it. Leave
    the field intact on the state object for every OTHER consumer (downstream
    assembly, receipts, audits) -- the exclusion is scoped to the one prompt
    that must not see it, not a deletion.
    Do NOT rely on strengthening the "never state X" instruction alone
    (already the first fix reached for, and it does not hold under a small
    local model once X is visible in context); do NOT rely on a downstream
    parser catching the leak after the fact (structural grammar checks do not
    inspect semantic content, so a leak of this shape parses as perfectly
    valid output).
  verify: |
    (1) Unit test: build the forbidden pass's prompt with a DISTINCTIVE marker
    string planted in the field that must be excluded, and assert the marker
    never appears anywhere in the built prompt.
    (2) Assert every OTHER field on the same state object DOES still reach the
    prompt, so the exclusion is proven scoped rather than accidentally wiping
    the whole object.
    (3) Assert the empty/not-yet-populated case (the excluded field's default)
    produces a byte-identical prompt to before the fix, so passes that never
    populate the field are unaffected.
    (4) On a live render, diff the forbidden pass's actual output against the
    other pass's output for shared substrings above a trivial length -- an
    echoed phrase is the concrete, observable symptom, not an inference from
    reading the prompt.
  tags: [prompt-contamination, pipeline-ordering, state-object-serialization, small-local-model, negative-instruction-not-sufficient, context-exclusion, live-echo-symptom, multi-pass-llm]
  legacy_id: "OTR-2026-08-18-scifi-news-pro-coda-leaks-the-news-read"
- id: "12.114"
  phase: 12
  area: a-reserved-identity-asset-is-reachable-from-the-general-selection-pool
  symptom: |
    An asset that MEANS one specific named identity -- a signature voice, a
    signature portrait, a character's theme, a branded style -- is handed to an
    ordinary subject who is not that identity. Nothing errors: the asset is
    valid, the selection is deterministic and auditable, and the output plays or
    renders normally. The damage is semantic and cumulative: an asset can only
    mean "this is X" while it is the only place it is ever encountered, so every
    wrong assignment quietly spends the identity that a qualification, audition
    or design decision established.
    Measured: a cameo character's operator-qualified voice reference was
    assigned to an ordinary character in an episode whose cast contained no such
    cameo, and that character spoke in the cameo's signature accent for the whole
    episode. The reference simply sat in the general character pool like any
    other row, so the seeded draw could hand it to anybody.
  cause: |
    THE RESERVATION EXISTS AS A CONVENTION, NOT AS A FILTER. The asset was
    qualified FOR one identity in one subsystem (a route, a policy, a casting
    record), and a DIFFERENT subsystem -- the general selector -- enumerates the
    same catalogue and never learns that some rows are spoken for. Both are
    individually correct; the coupling between them was never written down.
    The near-miss shape is a hand-kept exclusion list. It works the day it is
    written and drifts the first time somebody adds a route, because the list
    and the thing it describes have no mechanical relationship.
    The over-correction is equally real: reserving EVERY asset the identity is
    associated with sweeps in shared catalogue entries the identity merely
    borrows, and pulling those out of the general pool trades one defect for
    another (a preferred announcer voice, a house style, a stock portrait).
    THE DEEPER CAUSE, AND THE ONE THAT SURVIVED THE FIRST FIX: the guard was
    installed at ONE chokepoint -- the deterministic selector -- while production
    reached the same assignment through a SECOND path that never touches it.
    Measured: an LLM-proposed assignment was validated and stamped directly,
    skipping the selector entirely on 1871 of 1953 assignments (82 fell back).
    The scoring selector everyone reads as "the code that assigns voices" was
    running on 4% of real traffic. Neither the proposal builder nor its validator
    knew reserved ids existed, so the leak walked around a guard that was, in its
    own path, working perfectly.
    AND THERE WAS A THIRD PATH, WHICH THE FIRST FIX ALSO MISSED: the
    gender-agnostic FALLBACK used when the normal lookup cannot serve a row. It
    drew UNIFORMLY with no reserved filter and no quality filter at all -- a
    fallback is written to always return something, so it tends to be authored
    with fewer guards than the path it backs up, not more. What made it high
    traffic rather than a rare edge: a canonical category ("other") is 20% of
    every roll and the catalogue carries NO rows for it, so every one of those
    rows fell through to the unfiltered fallback. A category with no inventory
    silently promotes a fallback into a main path.
  fix: |
    Derive the reserved set FROM the authority that grants the identity, and
    apply it as a deterministic PRE-FILTER on the candidate pool -- never a score
    reweight, which only makes the wrong answer less likely rather than
    impossible.
    Reserve only assets the identity OWNS (a clone of its own recording, a
    bespoke asset), never the shared catalogue entries it is merely pointed at.
    Distinguish those by the KIND recorded in the grant, not by name matching.
    Make the reservation free to extend: adding a new grant must reserve its
    asset with no second edit, because a list maintained in parallel is a list
    that drifts.
    Fail SOFT in the helper (an unreadable authority reserves nothing and
    selection behaves exactly as before) and keep strictness where the grant is
    claimed. A helper that raises breaks every render on an import error.
    Confirm the reserved identity can still receive its own asset: the grant path
    must stamp it directly, never come through the filtered selector, or the fix
    starves the identity of the very thing being protected.
    ENUMERATE EVERY PATH THAT CAN ASSIGN THE ASSET BEFORE CHOOSING WHERE THE
    GUARD GOES, and put it on all of them or at the join below them. A guard on
    the path you happened to read is not a guard on the system. Grep for every
    writer of the assignment field, not just the function whose name says it
    selects -- an LLM-proposed or cached or operator-pinned assignment typically
    validates and stamps on its own path, and a validator that does not know
    about reservations will happily approve a reserved id.
  verify: |
    (1) Sweep the SELECTOR, not the helper. Assert across many seeds and every
    demographic branch that no reserved asset is ever returned for an ordinary
    subject. Tests that only check the reserved LIST prove the list is right and
    say nothing about the pool, which is where the defect lives.
    (1b) Count the traffic on each path before trusting any of them. The path
    whose name says it selects may carry a small minority of real assignments;
    measure from the corpus, not from reading the code. And test the FALLBACK
    explicitly -- it is the path least likely to carry the guard and most likely
    to be reached by a category the catalogue cannot serve.
    (2) Prove the test has teeth: assert the reserved asset IS present in the
    unfiltered candidate pool. If it is absent for some unrelated reason, the
    sweep passes for the wrong reason and keeps passing if the guard is deleted.
    (3) Assert the reserved identity still gets its own asset through the grant
    path, so the guard cannot starve what it protects.
    (4) Assert the shared/borrowed assets are NOT reserved, pinning the
    over-correction.
    (5) Count the corpus by ROLE before concluding anything about concentration.
    A pinned role (an announcer, a narrator) legitimately repeats one asset in
    every output and will dominate a naive frequency count, hiding or faking a
    pool problem in the rows that actually vary.
    (6) A POST-FIX SIGHTING HAS TWO EXPLANATIONS AND THEY LOOK IDENTICAL FROM
    THE OUTSIDE: a STALE PROCESS still running the pre-fix module, or an
    UNCOVERED PATH the fix never touched. Measured: the defect reappeared SIXTEEN
    HOURS after a correct fix, and the first diagnosis -- a long-running server
    that never tears down, holding the old import -- was plausible, consistent
    with the timeline, and WRONG. The real cause was a second assignment path
    that skipped the guarded selector entirely.
    Tell them apart by REPRODUCING ON A FRESHLY IMPORTED MODULE through the path
    production actually takes. A live call at HEAD either reproduces it (uncovered
    path -- the fix is incomplete) or does not (stale process -- the fix is fine).
    Do not settle this by reasoning about process start times against commit
    timestamps: that argument is available for both explanations and selects the
    comfortable one. Corpus silence is not proof either -- a defect at a ~1%
    assignment rate is absent from most samples while remaining fully live.
  tags: [reserved-identity, general-pool-leak, deterministic-pre-filter, derived-not-hand-kept, owns-versus-borrows, selector-not-helper, test-has-teeth, role-aware-corpus-count, uncovered-second-path, guard-at-one-chokepoint, unguarded-fallback-path, empty-category-routes-to-fallback, post-fix-sighting-two-explanations, reproduce-on-fresh-import, low-rate-defect-hides-in-corpus]
